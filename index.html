                    const candsNormal = groupNight.filter(s => isFeasible(s, d, sched, false));
                    const candsRelax = groupNight.filter(s => isFeasible(s, d, sched, true));
                    pending.push({ d, need, nNormal: candsNormal.length, nRelax: candsRelax.length });
                }
                if (pending.length === 0) break; // 全枠充足

                // MRV: 通常候補が最も少ない日を優先。同数なら need が多い日。
                // 完全同点の日順も seed 依存にして、パターンの多様性を確保する。
                pending.sort((a, b) => {
                    if (a.nNormal !== b.nNormal) return a.nNormal - b.nNormal;
                    if (a.need !== b.need) return b.need - a.need;
                    return tieKey('day', a.d) - tieKey('day', b.d);
                });
                const target = pending[0];
                const d = target.d;

                // まず通常候補で配置。無ければ連直緩和候補で配置（ロック状況などで到達するため）。
                let cands = groupNight.filter(s => isFeasible(s, d, sched, false));
                if (cands.length === 0) {
                    cands = groupNight.filter(s => isFeasible(s, d, sched, true));
                }
                if (cands.length === 0) {
                    // この日は absolute hard により配置不能 → 充足不可。この日を不足として記録し離脱。
                    break;
                }
                const chosen = chooseStaff(cands, d);
                applyNight(chosen, d, sched);
                nightCounts[chosen.id] = (nightCounts[chosen.id] || 0) + 1;
            }
            return { sched, nightCounts };
        };

        // === 修復フェーズ（ローカルサーチ: スワップ + min-conflict + tabu） ===
        // 貪欲構築は「一度置いた夜勤を戻せない」ため、解が存在しても不足が残ることがある。
        // ここでは不足日に対し、(1) 直接配置、(2) 近傍の夜勤を別日へ移動して空きを作るスワップ、
        // を試し、min-conflict（不足が最も減る手）で反復改善する。tabu と乱択で局所最適を脱出。
        // hard（夜勤人数の充足条件・連直物理整合）と Step0 ロックは常に厳守する。
        const shortageDaysOf = (sched) => {
            const arr = [];
            for (const d of days) {
                const need = nightShiftCount - countNightOnDay(d, sched);
                if (need > 0) arr.push({ d, need });
            }
            return arr;
        };
        const totalShortage = (sched) => days.reduce((a, d) => a + Math.max(0, nightShiftCount - countNightOnDay(d, sched)), 0);

        // 不足日 d に「直接」配置できる候補（通常→緩和の順）を返す
        const directCandidates = (d, sched) => {
            let c = groupNight.filter(s => isFeasible(s, d, sched, false));
            if (c.length === 0) c = groupNight.filter(s => isFeasible(s, d, sched, true));
            return c;
        };

        // 不足日 d を埋めるための「スワップ」候補手を列挙する。
        //  - 職員 s が d に置けない原因が「s 自身の近傍(d-2..d+2)の夜勤」である場合、
        //    その夜勤 (s,e) を一旦外し、(s,d) を置けるか試す。外したことで生じる新たな不足(e)は、
        //    別の職員 t で e を埋め直すなら相殺できる（=スワップ成立）。
        const enumerateMoves = (d, sched, rng) => {
            const moves = [];
            // 1) 直接配置
            directCandidates(d, sched).forEach(s => moves.push({ type: 'direct', s, d }));
            // 2) スワップ: 近傍夜勤を移動
            const wnd = [d - 2, d - 1, d + 1, d + 2].filter(e => e >= 1 && e <= daysInMonth);
            for (const s of groupNight) {
                for (const e of wnd) {
                    if (sched[s.id][e] !== SHIFT_TYPES.NIGHT) continue;
                    if (isCellLocked(s.id, e, sched)) continue; // ロック夜勤は動かせない
                    const snap = JSON.parse(JSON.stringify(sched[s.id]));
                    if (!removeNight(s, e, sched)) continue;
                    const canDplace = isFeasible(s, d, sched, false) || isFeasible(s, d, sched, true);
                    if (canDplace) {
                        const eNeedAfter = nightShiftCount - countNightOnDay(e, sched);
                        let filler = null;
                        if (eNeedAfter > 0) {
                            const fillCands = groupNight.filter(t => t.id !== s.id && (isFeasible(t, e, sched, false) || isFeasible(t, e, sched, true)));
                            if (fillCands.length > 0) filler = fillCands[(rng() * fillCands.length) | 0];
                        }
                        moves.push({ type: 'swap', s, dFrom: e, dTo: d, filler });
                    }
                    sched[s.id] = snap; // 元に戻す
                }
            }
            return moves;
        };

        // 1手を適用（filler があれば dFrom も埋める）
        const applyMove = (mv, sched) => {
            if (mv.type === 'direct') {
                applyNight(mv.s, mv.d, sched);
            } else {
                removeNight(mv.s, mv.dFrom, sched);
                applyNight(mv.s, mv.dTo, sched);
                if (mv.filler) applyNight(mv.filler, mv.dFrom, sched);
            }
        };

        // 決定論的な簡易乱数（seed で再現性を確保）
        const makeRng = (seed) => {
            let x = (seed * 2654435761) >>> 0 || 1;
            return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
        };

        // 修復本体: min-conflict + tabu。sched を改善し最終 sched を返す。
        const repairSchedule = (startSched, seed) => {
            let sched = JSON.parse(JSON.stringify(startSched));
            const rng = makeRng(seed + 7);
            const maxIter = daysInMonth * 40 + 200;
            const tabu = new Map();
            const tabuTenure = Math.max(3, Math.floor(groupNight.length / 2));
            let best = JSON.parse(JSON.stringify(sched));
            let bestShort = totalShortage(best);
            let noImprove = 0;

            for (let iter = 0; iter < maxIter && bestShort > 0; iter++) {
                const shorts = shortageDaysOf(sched);
                if (shorts.length === 0) { bestShort = 0; best = JSON.parse(JSON.stringify(sched)); break; }
                shorts.sort((a, b) => directCandidates(a.d, sched).length - directCandidates(b.d, sched).length || b.need - a.need);
                const pick = (rng() < 0.8) ? shorts[0] : shorts[(rng() * shorts.length) | 0];
                const d = pick.d;

                const moves = enumerateMoves(d, sched, rng);
                if (moves.length === 0) {
                    noImprove++;
                    if (noImprove > daysInMonth * 2) break;
                    if (noImprove > daysInMonth) { sched = JSON.parse(JSON.stringify(best)); }
                    continue;
                }

                let bestMv = null, bestMvShort = Infinity, bestMvTabu = true;
                for (const mv of moves) {
                    const trial = JSON.parse(JSON.stringify(sched));
                    applyMove(mv, trial);
                    const sh = totalShortage(trial);
                    const key = mv.type === 'direct' ? (mv.s.id + ':' + mv.d) : (mv.s.id + ':' + mv.dTo);
                    const isTabu = (tabu.get(key) || 0) > iter;
                    const allowed = !isTabu || sh < bestShort;
                    if (!allowed) continue;
                    if (sh < bestMvShort || (sh === bestMvShort && bestMvTabu && !isTabu)) {
                        bestMv = mv; bestMvShort = sh; bestMvTabu = isTabu;
                    }
                }
                if (!bestMv) {
                    bestMv = moves[(rng() * moves.length) | 0];
                }

                applyMove(bestMv, sched);
                const key = bestMv.type === 'direct' ? (bestMv.s.id + ':' + bestMv.d) : (bestMv.s.id + ':' + bestMv.dTo);
                tabu.set(key, iter + tabuTenure);

                const curShort = totalShortage(sched);
                if (curShort < bestShort) {
                    bestShort = curShort;
                    best = JSON.parse(JSON.stringify(sched));
                    noImprove = 0;
                } else {
                    noImprove++;
                    if (noImprove > daysInMonth) {
                        sched = JSON.parse(JSON.stringify(best));
                        noImprove = 0;
                    }
                }
            }
            return best;
        };

        // === バランス修復フェーズ（個人の夜勤回数目標専用） ===
        // 夜勤人数の充足(hard)・ロック・NG・ペア禁止を厳守したまま、「目標を明示指定した職員」の
        // 夜勤回数を目標へ近づける。同じ日の中で「夜勤を持つ誰か X」→「その日空いている誰か Y」へ
        // 1枠を移す“同日スワップ”を行う（＝日別合計人数は不変）。X/Y のどちらが指定者でも、
        // 目標ズレ(explicitMismatch)が減るなら採用する。これにより
        //   ・目標未達の指定者に夜勤を「足す」（Y=不足指定者）
        //   ・目標超過の指定者から夜勤を「外す」（X=超過指定者、Y=自動職員）
        // の両方向を1つのロジックで扱える。
        // 採用条件は「目標ズレが減り、かつ他の soft 違反(NG/ペア/前々日/直近/翌々日/日勤充足)を増やさない」。
        const rebalanceSchedule = (startSched, seed) => {
            let sched = JSON.parse(JSON.stringify(startSched));
            const rng = makeRng(seed + 13);

            const hasTarget = (s) => typeof nightTargets[s.id] === 'number' && nightTargets[s.id] > 0;
            const countFor = (s, sc) => {
                let c = 0;
                for (let d = 1; d <= daysInMonth; d++) if (sc[s.id][d] === SHIFT_TYPES.NIGHT) c++;
                return c;
            };
            // 明示目標のズレ合計（最小化対象）
            const explicitMismatch = (sc) => groupNight.reduce((sum, s) =>
                hasTarget(s) ? sum + Math.abs(countFor(s, sc) - nightTargets[s.id]) : sum, 0);
            // 目標以外の soft 違反の“件数”合計（増やしてはならない）
            const softCounts = (sc) => {
                const ev = evaluate(sc);
                return ev.cat.ng + ev.cat.pair + ev.cat.prev2 + ev.cat.recent6 + ev.cat.nextnext + ev.cat.dayfill;
            };

            let best = JSON.parse(JSON.stringify(sched));
            let bestMismatch = explicitMismatch(best);
            const maxIter = daysInMonth * 8 + 80;
            let noImprove = 0;

            for (let iter = 0; iter < maxIter && bestMismatch > 0; iter++) {
                const beforeMismatch = explicitMismatch(sched);
                const beforeSoft = softCounts(sched);
                let applied = false;

                const days2 = Array.from({ length: daysInMonth }, (_, i) => i + 1).sort(() => rng() - 0.5);

                outer:
                for (const d of days2) {
                    // その日に夜勤を持つ「渡せる」職員 X（ロック夜勤は動かせない）
                    const donors = groupNight.filter(X => sched[X.id][d] === SHIFT_TYPES.NIGHT && !isCellLocked(X.id, d, sched));
                    if (donors.length === 0) continue;
                    // その日空いていて夜勤を「受けられる」職員 Y
                    const receivers = groupNight.filter(Y => sched[Y.id][d] === SHIFT_TYPES.NONE && !isCellLocked(Y.id, d, sched));
                    if (receivers.length === 0) continue;

                    const donorsShuf = [...donors].sort(() => rng() - 0.5);
                    const recvShuf = [...receivers].sort(() => rng() - 0.5);

                    for (const X of donorsShuf) {
                        for (const Y of recvShuf) {
                            if (X.id === Y.id) continue;
                            // 目標ズレが減る見込みが無い組合せは skip（無駄な試行を減らす）
                            const xOver = hasTarget(X) && countFor(X, sched) > nightTargets[X.id];
                            const yUnder = hasTarget(Y) && countFor(Y, sched) < nightTargets[Y.id];
                            const xExactOrUnder = hasTarget(X) && countFor(X, sched) <= nightTargets[X.id];
                            const yExactOrOver = hasTarget(Y) && countFor(Y, sched) >= nightTargets[Y.id];
                            if (!xOver && !yUnder) continue;         // どちらも改善に寄与しない
                            if (xExactOrUnder || yExactOrOver) continue; // Xを減らすと悪化 / Yを増やすと悪化

                            const snap = JSON.parse(JSON.stringify(sched));
                            if (!removeNight(X, d, sched)) { sched = snap; continue; }
                            if (!isFeasible(Y, d, sched, false) && !isFeasible(Y, d, sched, true)) { sched = snap; continue; }
                            applyNight(Y, d, sched);
                            const afterMismatch = explicitMismatch(sched);
                            if (afterMismatch < beforeMismatch && softCounts(sched) <= beforeSoft) {
                                applied = true;
                                break outer;
                            }
                            sched = snap; // 改善しない/悪化 → 巻き戻し
                        }
                    }
                }

                if (!applied) { noImprove++; if (noImprove > 4) break; continue; }

                const cur = explicitMismatch(sched);
                if (cur < bestMismatch) {
                    bestMismatch = cur;
                    best = JSON.parse(JSON.stringify(sched));
                    noImprove = 0;
                } else {
                    noImprove++;
                    if (noImprove > 4) { sched = JSON.parse(JSON.stringify(best)); noImprove = 0; }
                }
            }
            return best;
        };

        // スケジュール評価（未配置・soft違反・均等性・個人の夜勤回数目標の達成度）
        const evaluate = (sched) => {
            const shortageByDay = [];
            let unfilled = 0;
            for (let d = 1; d <= daysInMonth; d++) {
                const short = Math.max(0, nightShiftCount - countNightOnDay(d, sched));
                if (short > 0) shortageByDay.push({ day: d, short });
                unfilled += short;
            }
            const cat = { ng: 0, pair: 0, prev2: 0, recent6: 0, nextnext: 0, dayfill: 0, target: 0 };
            for (let d = 1; d <= daysInMonth; d++) {
                groupNight.forEach(s => {
                    if (sched[s.id][d] === SHIFT_TYPES.NIGHT) {
                        const orig = sched[s.id][d];
                        sched[s.id][d] = SHIFT_TYPES.NONE;
                        const v = evalSoftViolations(s, d, sched);
                        sched[s.id][d] = orig;
                        cat.ng += v.ng; cat.pair += v.pair; cat.prev2 += v.prev2;
                        cat.recent6 += v.recent6; cat.nextnext += v.nextnext; cat.dayfill += v.dayfill;
                    }
                });
            }
            // 個人の夜勤回数目標（nightTargets で明示指定された分のみ）は softだが極めて重いペナルティで
            // ほぼ hard 扱いにする。cat.target はズレの絶対値合計（内訳表示・件数表示にも使う）。
            let balance = 0;
            const targetMismatches = [];
            groupNight.forEach(s => {
                let c = 0;
                for (let d = 1; d <= daysInMonth; d++) if (sched[s.id][d] === SHIFT_TYPES.NIGHT) c++;
                const hasExplicitTarget = typeof nightTargets[s.id] === 'number' && nightTargets[s.id] > 0;
                const t = hasExplicitTarget ? nightTargets[s.id] : averageTarget;
                balance += Math.abs(c - t) * 10;
                if (hasExplicitTarget && c !== t) {
                    cat.target += Math.abs(c - t);
                    targetMismatches.push({ name: s.name, target: t, actual: c });
                }
            });
            const softTotal = cat.ng * VIO.ng + cat.pair * VIO.pair + cat.prev2 * VIO.prev2
                + cat.recent6 * VIO.recent6 + cat.nextnext * VIO.nextnext + cat.dayfill * VIO.dayfill
                + cat.target * VIO.target;
            // 夜勤充足を hard とするため、未配置には極めて大きいペナルティ
            const score = unfilled * 100000000 + softTotal + balance;
            return { unfilled, shortageByDay, cat, softTotal, balance, targetMismatches, score };
        };

        // --- 複数初期パターン × 修復フェーズを試し、最良（未配置最少→soft最少→均等）を採用 ---
        // 各初期解（貪欲構築）に不足が残る場合は repairSchedule（スワップ+min-conflict）で不足を潰す。
        // これにより「解があるのに貪欲法だけでは辿り着けない」ケースを大幅に救済する。
        // 計算が重くならないよう時間予算（安全網）を設ける。通常はこれに達する前に終わるが、
        // 職員数・日数が多い環境でも UI が固まらないよう、超過したら最良解で打ち切る。
        // 再配置は複数の変異を試すため、時間予算を多めに取る（それでも上限内で必ず打ち切る）。
        const DEADLINE = Date.now() + (isRetry ? 6000 : 2500);

        const MAX_PATTERNS = 40;

        // --- 1つの変異シードぶんの探索。最良解と、同等品質の別解候補を返す ---
        const runSearch = (vseed) => {
            let best = null;
            const alts = [];   // 未配置ゼロの解を、シグネチャ重複なしで保持（別パターン候補）
            const remember = (sched, ev, force) => {
                if (ev.unfilled > 0) return;
                if (!force && alts.length >= 24) return; // 最良解(force)は上限に関係なく必ず入れる
                const sig = nightSignature(sched);
                if (alts.some(x => x.sig === sig)) return;
                alts.push({ sched: JSON.parse(JSON.stringify(sched)), ev, sig });
            };
            for (let pattern = 0; pattern < MAX_PATTERNS; pattern++) {
                if (best && Date.now() > DEADLINE) break;
                const { sched } = buildAssignment(pattern + vseed);
                let ev = evaluate(sched);
                let cand = sched;
                if (ev.unfilled > 0) {
                    const repaired = repairSchedule(sched, pattern + vseed);
                    const evR = evaluate(repaired);
                    if (evR.score < ev.score) { ev = evR; cand = repaired; }
                }
                remember(cand, ev);
                if (!best || ev.score < best.ev.score) best = { sched: cand, ev };
                // 完全解（未配置なし・soft違反なし）に到達したら打ち切り。
                // 再配置時は「前回と違う解」を得たいので、別シグネチャの同等解が集まるまで少し多く回す。
                if (best.ev.unfilled === 0 && best.ev.softTotal === 0) {
                    if (!isRetry) break;
                    if (alts.some(x => x.sig !== currentSig && x.ev.score === best.ev.score)) break;
                    if (pattern >= 20) break;
                }
            }
            if (best && best.ev.unfilled > 0) {
                for (let s = 0; s < 12 && best.ev.unfilled > 0 && Date.now() < DEADLINE; s++) {
                    const repaired = repairSchedule(best.sched, 1000 + s * 37 + vseed);
                    const evR = evaluate(repaired);
                    if (evR.score < best.ev.score) best = { sched: repaired, ev: evR };
                }
            }
            if (best && best.ev.unfilled === 0 && best.ev.cat.target > 0) {
                for (let s = 0; s < 15 && best.ev.cat.target > 0 && Date.now() < DEADLINE; s++) {
                    const rebalanced = rebalanceSchedule(best.sched, 2000 + s * 53 + vseed);
                    const evR = evaluate(rebalanced);
                    if (evR.score < best.ev.score) best = { sched: rebalanced, ev: evR };
                }
            }
            if (best) remember(best.sched, best.ev, true);
            return { best, alts };
        };

        // --- 実行 ---
        // 「自動」: 変異0で探索し、その品質を基準(baseline)にする。
        // 「再配置」: 変異を変えながら「基準と同等以上の品質」かつ「前回と違うパターン」を探す。
        //             見つからなければ配置を変更しない（品質を落としてまで別解にはしない）。
        let best = null;
        let variantExhausted = false;

        const retryPool = []; // 再配置候補（前回と違うパターンのみ）。品質判定は後段の finalize 後に行う。
        if (!isRetry) {
            best = runSearch(0).best;
        } else {
            const seenSig = new Set();
            // 探索に時間を使い切らないよう、仕上げ評価ぶんの余力（約2秒）を残して打ち切る
            const SEARCH_DEADLINE = DEADLINE - 2000;
            // 変異ごとに「その変異での上位2件」だけを採用する。
            // ※1つの変異から大量に集めると、後続の変異（もっと良い解を持つ可能性）に
            //   探索が届かなくなるため、変異をまたいで満遍なく候補を確保する。
            for (let t = 0; t < 4 && (t === 0 || Date.now() < SEARCH_DEADLINE); t++) {
                const { best: b, alts } = runSearch((variant + t) * 104729);
                if (!b) continue;
                if (!best) best = b; // 候補が全滅した場合の保険
                alts
                    .filter(x => x.sig !== currentSig && !seenSig.has(x.sig))
                    .sort((p, q) => p.ev.score - q.ev.score)
                    .slice(0, 2)
                    .forEach(x => {
                        seenSig.add(x.sig);
                        retryPool.push({ sched: x.sched, ev: x.ev, vidx: variant + t });
                    });
            }
            retryPool.sort((p, q) => p.ev.score - q.ev.score); // 良い候補から順に試す
        }

        // === 日勤必要数の下限修復（連直を許容して日中が「必要数-1」を下回る日を解消）===
        // ある日 X で日中確保見込みが (必要数-1) 未満のとき、A群の連直を使って1名を日勤へ浮かせる：
        //  ・A: X-2 に夜勤（本来 X で休養）→ X-1 も夜勤(連直)にして X を「明け」に変える（Xでの拘束は不変）
        //  ・B: X-1 の夜勤を1つ外す（B を X-1/X で解放＝日勤に回せる）
        // これで X-1 の夜勤人数は 2 のまま、日中は B の分 +1 になる。
        // 予測: X-1夜勤の人は X で明け、X-2夜勤の人は X で休養（Step3で公休化）→日中不在として数える。
        const dayFloorAvail = (X, sched) => {
            if (X < 1 || X > daysInMonth) return Infinity;
            let avail = 0;
            staffData.forEach(st => {
                if (getShiftSafe(st.id, X - 1, sched) === SHIFT_TYPES.NIGHT) return; // 明け
                if (getShiftSafe(st.id, X - 2, sched) === SHIFT_TYPES.NIGHT) return; // 休養
                const shift = sched[st.id][X];
                // 朝ピーク在籍とみなすシフト（早/日/早日/日遅。遅番は朝に数えない）＋ 空きで日勤に回せる人
                if (MORNING_PRESENT_SHIFTS.includes(shift)) {
                    avail += headWeight(st);
                } else if (shift === SHIFT_TYPES.NONE && !isCellLocked(st.id, X, sched)) {
                    if (!isNg(st.id, X, SHIFT_TYPES.DAY)) avail += headWeight(st);
                }
            });
            return avail;
        };
        const nightCountOf = (s, sched) => {
            let c = 0;
            for (let d = 1; d <= daysInMonth; d++) if (sched[s.id][d] === SHIFT_TYPES.NIGHT) c++;
            return c;
        };
        const repairDayFloor = (sched) => {
            const hasT = (s) => typeof nightTargets[s.id] === 'number' && nightTargets[s.id] > 0;
            // 目標超過度（大きいほど夜勤を手放してよい／小さい・マイナスほど夜勤を増やしてよい）
            const overBy = (s) => hasT(s) ? nightCountOf(s, sched) - nightTargets[s.id] : 0;
            for (let X = 1; X <= daysInMonth; X++) {
                const target = getMorningTargetForDay(X, calendar[X - 1].day); // 朝ピーク帯の必要数を下限基準に
                let guard = 0;
                while (dayFloorAvail(X, sched) < target - 1 && guard++ < 8) {
                    const before = dayFloorAvail(X, sched);
                    // 連直（当直→当直）は物理的に不可のため、連直を作る修復は使わない。
                    let applied = false;
                    // --- 修復パターン3: X で休養に入る人の「X-2の夜勤」を、Xにどのみち出られない人へ移す ---
                    // 夜勤は X-2 に入ると X が自動公休になる。X が希望休・研修などで元から出勤できない職員に
                    // その夜勤を持たせれば、休養で消えていた1人を X の日勤に戻せる。
                    if (!applied && X - 2 >= 1) {
                        const Rs = groupNight.filter(r =>
                            sched[r.id][X - 2] === SHIFT_TYPES.NIGHT && !isCellLocked(r.id, X - 2, sched)
                            && getShiftSafe(r.id, X - 3, sched) !== SHIFT_TYPES.NIGHT   // 連直の途中は動かさない
                            && !(sched[r.id][X - 1] === SHIFT_TYPES.NIGHT)
                            && (sched[r.id][X] === SHIFT_TYPES.NONE || sched[r.id][X] === SHIFT_TYPES.OFF)
                            && !isCellLocked(r.id, X, sched)
                            && !isNg(r.id, X, SHIFT_TYPES.DAY)
                        ).sort((a, b) => overBy(b) - overBy(a));

                        for (const R of Rs) {
                            // Q候補: X-2 と X-1 が空き（夜勤＋明けを置ける）/ X はロック済みで朝に出られない人
                            const Qs = groupNight.filter(q => q.id !== R.id
                                && sched[q.id][X - 2] === SHIFT_TYPES.NONE && !isCellLocked(q.id, X - 2, sched)
                                && !isNg(q.id, X - 2, SHIFT_TYPES.NIGHT)
                                && getShiftSafe(q.id, X - 3, sched) !== SHIFT_TYPES.NIGHT
                                && getShiftSafe(q.id, X - 4, sched) !== SHIFT_TYPES.NIGHT
                                && (X - 1 > daysInMonth
                                    || (sched[q.id][X - 1] === SHIFT_TYPES.NONE && !isCellLocked(q.id, X - 1, sched)))
                                && isCellLocked(q.id, X, sched)
                                && !MORNING_PRESENT_SHIFTS.includes(sched[q.id][X])
                                && sched[q.id][X] !== SHIFT_TYPES.NIGHT
                                && !(X + 1 <= daysInMonth && sched[q.id][X + 1] === SHIFT_TYPES.NIGHT)
                            ).sort((a, b) => (hasT(a) ? 1 : 0) - (hasT(b) ? 1 : 0) || overBy(a) - overBy(b));

                            for (const Q of Qs) {
                                const snapR = JSON.parse(JSON.stringify(sched[R.id]));
                                const snapQ = JSON.parse(JSON.stringify(sched[Q.id]));
                                // R: X-2 の夜勤と、自動付与された X-1 の明けを外す
                                sched[R.id][X - 2] = SHIFT_TYPES.NONE;
                                if (X - 1 <= daysInMonth && sched[R.id][X - 1] === SHIFT_TYPES.NIGHT_END && !isCellLocked(R.id, X - 1, sched)) {
                                    sched[R.id][X - 1] = SHIFT_TYPES.NONE;
                                }
                                // Q: X-2 を夜勤、X-1 を明けに
                                sched[Q.id][X - 2] = SHIFT_TYPES.NIGHT;
                                if (X - 1 <= daysInMonth && !isCellLocked(Q.id, X - 1, sched)) {
                                    sched[Q.id][X - 1] = SHIFT_TYPES.NIGHT_END;
                                }
                                const okCount = countNightOnDay(X - 2, sched) === nightShiftCount;
                                const improved = dayFloorAvail(X, sched) > before;
                                if (okCount && improved) { applied = true; break; }
                                sched[R.id] = snapR; sched[Q.id] = snapQ; // revert
                            }
                            if (applied) break;
                        }
                    }

                    if (!applied) break; // この日はこれ以上修復できない
                }
            }
        };
        // 連直修復で目標超過になった指定者を、非目標者への同日置換で目標へ戻す
        // （日勤必要数の下限 = 必要数-1 を壊さない範囲でのみ実施。連直の枠は動かさない）。
        const fixOverTargetAfterRepair = (sched) => {
            const hasT = (s) => typeof nightTargets[s.id] === 'number' && nightTargets[s.id] > 0;
            const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);
            groupNight.forEach(s => {
                if (!hasT(s)) return;
                let guard = 0;
                while (nightCountOf(s, sched) > nightTargets[s.id] && guard++ < 10) {
                    let moved = false;
                    for (const d of days) {
                        if (sched[s.id][d] !== SHIFT_TYPES.NIGHT) continue;
                        if (isCellLocked(s.id, d, sched)) continue;
                        // 連直の一部（前後日も夜勤）は動かさない＝日勤下限修復を壊さない
                        if (getShiftSafe(s.id, d - 1, sched) === SHIFT_TYPES.NIGHT) continue;
                        if (getShiftSafe(s.id, d + 1, sched) === SHIFT_TYPES.NIGHT) continue;
                        const receivers = groupNight.filter(t => t.id !== s.id && (!hasT(t) || nightCountOf(t, sched) < nightTargets[t.id]));
                        for (const t of receivers) {
                            const snapS = JSON.parse(JSON.stringify(sched[s.id]));
                            const snapT = JSON.parse(JSON.stringify(sched[t.id]));
                            if (!removeNight(s, d, sched)) { sched[s.id] = snapS; continue; }
                            if (!isFeasible(t, d, sched, false) && !isFeasible(t, d, sched, true)) { sched[s.id] = snapS; sched[t.id] = snapT; continue; }
                            applyNight(t, d, sched);
                            const floorOK = [d, d + 1, d + 2].every(X => X < 1 || X > daysInMonth
                                || dayFloorAvail(X, sched) >= getMorningTargetForDay(X, calendar[X - 1].day) - 1);
                            if (floorOK && countNightOnDay(d, sched) === nightShiftCount) { moved = true; break; }
                            sched[s.id] = snapS; sched[t.id] = snapT;
                        }
                        if (moved) break;
                    }
                    if (!moved) break;
                }
            });
        };
        // 仕上げ（連直による日勤下限修復 → 目標超過の是正）まで通してから評価する。
        // 品質比較は必ずこの finalize 後の値どうしで行う（修復前後で soft 違反数が変わるため）。
        const finalize = (sched) => {
            repairDayFloor(sched);
            fixOverTargetAfterRepair(sched);
            return evaluate(sched);
        };

        // --- 採用可否の基準 ---
        // 基準は「自動」実行時の品質に固定する（再配置のたびに基準を上げると、2回目以降が
        // ほぼ通らなくなり『押しても変わらない』状態に戻るため）。
        //  ・絶対に悪化させない: 夜勤回数の目標未達 / NG指定 / 禁止ペア
        //  ・許容幅を持たせる  : 連勤間隔などの快適性指標（別パターンを出すための余地）
        const SOFT_TOLERANCE = 400;
        const blRef = nightBaselineRef.current;
        const acceptable = (e) => !blRef || (
            e.cat.target <= blRef.target &&
            e.cat.ng <= blRef.ng &&
            e.cat.pair <= blRef.pair &&
            e.softTotal <= blRef.softTotal + SOFT_TOLERANCE
        );

        if (isRetry) {
            // 再配置: 前回と違うパターンのうち、仕上げ後の品質が基準を満たすものを採用する。
            const atLeastAsGood = acceptable;
            let chosen = null;
            const pool = retryPool.slice(0, 8);
            for (let i = 0; i < pool.length; i++) {
                // 上位4件は時間予算に関わらず必ず評価する（毎回「候補なし」になるのを防ぐ）
                if (i >= 4 && Date.now() > DEADLINE) break;
                const c = pool[i];
                const s = JSON.parse(JSON.stringify(c.sched));
                const e = finalize(s);
                if (e.unfilled === 0 && atLeastAsGood(e) && nightSignature(s) !== currentSig) {
                    chosen = { sched: s, ev: e };
                    nightVariantRef.current = c.vidx; // 次回はこの続きから探す
                    break;
                }
            }
            if (chosen) {
                best = chosen;
            } else {
                if (best) best.ev = finalize(best.sched);
                variantExhausted = true; // 同等品質の別パターンは見つからなかった
            }
        } else if (best) {
            best.ev = finalize(best.sched);
        }

        const ev = best.ev;

        // 夜勤充足は hard 制約 → 未配置が残る場合はエラー停止し、適用しない（ロック・既存配置は保持）。
        if (ev.unfilled > 0) {
            const dayList = ev.shortageByDay.map(x => `${x.day}日(不足${x.short})`).join('、');
            setNightViolations({
                unfilled: ev.unfilled,
                shortageByDay: ev.shortageByDay,
                items: [],
                hardFail: true,
            });
            setMessage({
                text: `Step 2: 夜勤人数を満たせません。次の日が不足しています → ${dayList}。夜勤可能な職員数・前月夜勤・ロック枠・公休/NG等の制約を見直してください（充足できないため自動配置は適用していません）。`,
                type: 'error',
            });
            return; // 適用しない（hard 充足違反のため停止）
        }

        // 再配置で「品質が下がる別解」しか得られなかった場合は適用しない（現状維持）。
        // 目標未達が増える／soft違反が増える案は採用せず、次の押下で別候補を試せるようにする。
        if (isRetry && !acceptable(ev)) {
            setMessage({
                text: 'Step 2: 品質が下がる案しか見つからなかったため、配置は変更していません（夜勤回数の目標・NG・禁止ペアが悪化するため）。もう一度「再配置」を押すと別の候補を試します。',
                type: 'info',
            });
            return;
        }

        // 充足成功 → 適用
        const finalSchedule = best.sched;
        setSchedule(finalSchedule);
        setScheduleStep(step);
        // 品質基準は「自動」実行時のみ確定する（再配置では更新しない＝基準が上がって
        // 2回目以降の別パターンが出せなくなるのを防ぐ）。
        if (!isRetry) {
            nightBaselineRef.current = {
                target: ev.cat.target,
                ng: ev.cat.ng,
                pair: ev.cat.pair,
                softTotal: ev.softTotal,
            };
        }

        const items = [];
        Object.keys(VIO_LABELS).forEach(key => {
            if (key === 'target') return; // 個人目標の未達は下の専用リストで詳細表示する
            if (ev.cat[key] > 0) items.push({ label: VIO_LABELS[key], count: ev.cat[key] });
        });
        setNightViolations({
            unfilled: 0,
            shortageByDay: [],
            items,
            targetMismatches: ev.targetMismatches,
            hardFail: false,
        });

        // 再配置したのに同等の別解が無かった場合は、その旨を明示（ボタンが壊れて見えないように）
        if (variantExhausted) {
            setMessage({ text: 'Step 2: これ以上の別パターンは見つかりませんでした（制約が厳しく、同じ品質の解が他にありません）。配置は現状のままです。ロックや希望・NG、公休の見直しで選択肢が増えます。', type: 'info' });
        } else if (ev.targetMismatches.length > 0) {
            const detail = ev.targetMismatches.map(m => `${m.name}(目標${m.target}→実績${m.actual})`).join('、');
            // ここは「作業を止める失敗」ではなく、そのまま次へ進める案内（info）。シフトは適用済み。
            setMessage({ text: `Step 2: ${isRetry ? '別パターンで' : ''}全枠を充足しました（夜勤人数・ロック・NG・ペア禁止は厳守）。次の職員は希望・NG・ロック等の都合で夜勤回数が目標と一致しませんでした → ${detail}。このまま次へ進めます（必要なら該当セルを手動調整してください）。`, type: 'info' });
        } else if (ev.softTotal === 0) {
            setMessage({ text: isRetry ? `Step 2: 別パターン(${nightVariantRef.current})で全枠を条件違反なく充足しました。` : 'Step 2: すべての夜勤枠を条件違反なく充足しました。', type: 'success' });
        } else {
            setMessage({ text: `Step 2: ${isRetry ? `別パターン(${nightVariantRef.current})で` : ''}全枠を充足しました（夜勤人数・ロックは厳守）。soft条件（均等性ほか）の違反が残っています。下記の内訳をご確認ください。`, type: 'success' });
        }
      };

      const autoFillDayShiftsAndAdjust = () => {
        saveHistory();
        const newSchedule = applyWeekdayPattern(JSON.parse(JSON.stringify(schedule)));
        
        const groupNight = staffData.filter(s => ['A', 'D'].includes(s.group));
        groupNight.forEach(staff => {
          for (let d = 1; d <= daysInMonth; d++) {
            const shift = newSchedule[staff.id][d];
            if (shift === SHIFT_TYPES.NIGHT) {
              // 連直（翌日も夜勤）の場合は、明け/休養を最後の夜勤の後で処理するため、この日はスキップ。
              // ※ここで翌日を明けに上書きすると、連直配置が壊れてその日の夜勤人数が不足する。
              if (d + 1 <= daysInMonth && newSchedule[staff.id][d + 1] === SHIFT_TYPES.NIGHT) continue;
              if (d + 1 <= daysInMonth && !isCellLocked(staff.id, d + 1, newSchedule)) {
                if (!isNg(staff.id, d + 1, SHIFT_TYPES.NIGHT_END)) {
                  newSchedule[staff.id][d + 1] = SHIFT_TYPES.NIGHT_END;
                }
              }
              if (d + 2 <= daysInMonth && !isCellLocked(staff.id, d + 2, newSchedule)) {
                const nextNext = newSchedule[staff.id][d + 2];
                if (nextNext === SHIFT_TYPES.NIGHT) continue;
                if (![SHIFT_TYPES.PAID, SHIFT_TYPES.REFRESH].includes(nextNext)) {
                   if (!isNg(staff.id, d + 2, SHIFT_TYPES.OFF)) {
                     newSchedule[staff.id][d + 2] = SHIFT_TYPES.OFF;
                   }
                }
              }
            }
          }
        });

        const calcConsecutiveDetail = (staffId, day, sched) => {
          let left = 0;
          let isConsecutive = true;
          for (let d = day - 1; d >= 1; d--) {
            if (isPotentialWorkDay(sched[staffId][d])) left++; else { isConsecutive = false; break; }
          }
          if (isConsecutive && prevMonthSchedule[staffId]) {
              const prevDays = Object.keys(prevMonthSchedule[staffId]).length;
              for (let d = prevDays; d >= 1; d--) {
                  if (isWorkDay(prevMonthSchedule[staffId][d])) left++; else break;
              }
          }

          let right = 0;
          for (let d = day + 1; d <= daysInMonth; d++) {
            if (isPotentialWorkDay(sched[staffId][d])) right++; else break;
          }
          return { left, right, total: left + right + 1 };
        };

        // === 公休の「飛び飛び」判定 ===
        // 前後が勤務日である単独の公休を数える（少ないほど連休になっている＝良い）。
        // 明け・有休・リフレッシュの隣は休養の続きとみなし、単独とは数えない。
        const isOffLikeShift = (v) => v === SHIFT_TYPES.OFF || v === SHIFT_TYPES.PAID || v === SHIFT_TYPES.REFRESH;
        const isRestNeighbor = (v) => isOffLikeShift(v) || v === SHIFT_TYPES.NIGHT_END;
        const countIsolatedOffs = (staffId, sched) => {
          let n = 0;
          for (let d = 1; d <= daysInMonth; d++) {
            if (sched[staffId][d] !== SHIFT_TYPES.OFF) continue;
            const prevOk = (d <= 1) ? true : isRestNeighbor(sched[staffId][d - 1]);
            const nextOk = (d >= daysInMonth) ? true : isRestNeighbor(sched[staffId][d + 1]);
            if (!prevOk && !nextOk) n++;
          }
          return n;
        };
        // offDay を公休に、workDay を日勤に入れ替えたときの「単独公休」増減を返す（+なら悪化）
        const isoDeltaOfMove = (staffId, sched, offDay, workDay) => {
          const before = countIsolatedOffs(staffId, sched);
          const keepOff = sched[staffId][offDay];
          const keepWork = sched[staffId][workDay];
          sched[staffId][offDay] = SHIFT_TYPES.OFF;
          sched[staffId][workDay] = SHIFT_TYPES.DAY;
          const after = countIsolatedOffs(staffId, sched);
          sched[staffId][offDay] = keepOff;
          sched[staffId][workDay] = keepWork;
          return after - before;
        };

        // === 早番枠・夕方枠の確保 ===
        // Step4で早番/夕方を割り振るとき、候補になれるのは非C群だけ。さらに
        //  ・早番(7:30出勤) … 前日の退勤が16:30以前（日勤17:00・遅番/日遅19:00・研修の翌日は不可）
        //  ・夕方(19:00退勤) … 翌日の出勤が10:30以降（翌日が日勤/早番/研修だと不可）
        // という前後日の条件がある。公休をここで置くときに候補を全部つぶしてしまうと、
        // Step4の時点でどう頑張っても早番ゼロ・夕方ゼロの日ができる。そこで
        // 「その日に早番へ入れる人／夕方へ出せる人を最低1名ずつ残す」ことを hard 条件にする。
        const prevBlocksEarly = (v) => [SHIFT_TYPES.DAY, SHIFT_TYPES.LATE, SHIFT_TYPES.DAY_LATE,
                                        SHIFT_TYPES.EARLY_DAY, SHIFT_TYPES.TRAINING].includes(v);
        const nextBlocksEvening = (v) => [SHIFT_TYPES.DAY, SHIFT_TYPES.EARLY, SHIFT_TYPES.EARLY_DAY,
                                          SHIFT_TYPES.TRAINING].includes(v);
        // d に出勤できる見込みがあるか（空きか、すでに日中の勤務が入っている）
        const canWorkDayAt = (st, d, sched) => {
          const v = sched[st.id][d];
          if (v === SHIFT_TYPES.NONE) return !isCellLocked(st.id, d, sched);
          return [SHIFT_TYPES.DAY, SHIFT_TYPES.EARLY, SHIFT_TYPES.EARLY_DAY,
                  SHIFT_TYPES.LATE, SHIFT_TYPES.DAY_LATE].includes(v);
        };
        const earlyCapableIds = (d, sched, exceptId) => staffData.filter(st =>
          st.group !== 'C' && st.id !== exceptId && canWorkDayAt(st, d, sched)
          && !isNg(st.id, d, SHIFT_TYPES.EARLY)
          && !prevBlocksEarly(getShiftSafe(st.id, d - 1, sched))
        ).map(st => st.id);
        const eveningCapableIds = (d, sched, exceptId) => staffData.filter(st =>
          st.group !== 'C' && st.id !== exceptId && canWorkDayAt(st, d, sched)
          && !isNg(st.id, d, SHIFT_TYPES.DAY_LATE)
          && (d + 1 > daysInMonth || !nextBlocksEvening(sched[st.id][d + 1]))
        ).map(st => st.id);
        // 早番と夕方は同じ人では兼ねられないので、両方必要な日は「別人が2名」必要。
        const keepsEarlyEveningSlots = (d, sched, exceptId) => {
          const needEarly = getEarlyTargetForDay(calendar[d - 1].day) > 0;
          const needEve = eveningTarget > 0;
          if (!needEarly && !needEve) return true;
          const E = earlyCapableIds(d, sched, exceptId);
          const L = eveningCapableIds(d, sched, exceptId);
          if (needEarly && E.length < 1) return false;
          if (needEve && L.length < 1) return false;
          if (needEarly && needEve && new Set([...E, ...L]).size < 2) return false;
          return true;
        };

        const neededOffs = {};
        staffData.forEach(staff => {
          let currentOffs = 0;
          for (let d = 1; d <= daysInMonth; d++) {
            const s = newSchedule[staff.id][d];
            if (s === SHIFT_TYPES.OFF) currentOffs++;
          }
          const targetOffDays = (staff.isCustomTime && staff.customOffDays !== '' && staff.customOffDays !== undefined) 
                                ? Number(staff.customOffDays) 
                                : requiredOffDays;
          neededOffs[staff.id] = Math.max(0, targetOffDays - currentOffs);
        });

        let totalNeeded = Object.values(neededOffs).reduce((a, b) => a + b, 0);

        while (totalNeeded > 0) {
          let bestCandidate = null;

          staffData.forEach(staff => {
            if (neededOffs[staff.id] <= 0) return; 

            for (let d = 1; d <= daysInMonth; d++) {
              if (newSchedule[staff.id][d] === SHIFT_TYPES.NONE && !isCellLocked(staff.id, d, newSchedule)) {
                if (isNg(staff.id, d, SHIFT_TYPES.OFF)) continue; 

                const dayInfo = calendar[d-1];
                let score = 0;
                
                const { left, right, total } = calcConsecutiveDetail(staff.id, d, newSchedule);
                
                if (total > getMaxRun(staff)) {
                  score += 100000 + (total * 50000); 
                  const diff = Math.abs(left - right);
                  score -= diff * 5000;
                }

                const shiftM1 = getShiftSafe(staff.id, d - 1, newSchedule);
                const shiftM2 = getShiftSafe(staff.id, d - 2, newSchedule);
                const shiftP1 = getShiftSafe(staff.id, d + 1, newSchedule);
                const shiftP2 = getShiftSafe(staff.id, d + 2, newSchedule);

                const isOffLike = (s) => s === SHIFT_TYPES.OFF || s === SHIFT_TYPES.PAID || s === SHIFT_TYPES.REFRESH;
                const isOffOrEnd = (s) => isOffLike(s) || s === SHIFT_TYPES.NIGHT_END;

                if (!isOffOrEnd(shiftM1) && isOffOrEnd(shiftM2)) {
                    score -= 30000;
                }
                if (!isOffOrEnd(shiftP1) && isOffLike(shiftP2)) {
                    score -= 30000;
                }

                if (isOffOrEnd(shiftM1)) score += 15000;
                if (isOffLike(shiftP1)) score += 15000;

                if (dayInfo.day === 0) score += 40; 
                else if (dayInfo.day === 6) score += 40; 
                else score += 10;
                
                let potentialDayStaff = 0;
                staffData.forEach(s => {
                  const val = newSchedule[s.id][d];
                  // 空き(日勤に回せる) or 既に朝在籍シフト(日/早/早日/日遅) を朝ピーク供給として数える
                  if (val === SHIFT_TYPES.NONE || MORNING_PRESENT_SHIFTS.includes(val)) {
                    potentialDayStaff += headWeight(s);
                  }
                });

                // 朝ピーク帯の必要数に対する hard/soft ガード（Step3では日中=朝在籍とみなせる）
                const dayFloorTarget = getMorningTargetForDay(d, dayInfo.day);
                const myOffContribution = headWeight(staff);
                const remainAfterOff = potentialDayStaff - myOffContribution;
                // ★hard: この公休を置くと朝在籍可能数が (必要数-1) を下回る＝2以上不足になる場合は禁止
                if (remainAfterOff < dayFloorTarget - 1) {
                  continue;
                }
                // ★hard: 早番枠・夕方枠を1名ずつ残す（自分を抜いた残りで数える）
                if (staff.group !== 'C' && !keepsEarlyEveningSlots(d, newSchedule, staff.id)) {
                  continue;
                }
                // soft: (必要数-1)以上は保つが、必要数ちょうどを割る(=1不足)なら強めに回避
                if (remainAfterOff < dayFloorTarget) {
                  score -= 50000;
                }

                score += Math.random();

                if (!bestCandidate || score > bestCandidate.score) {
                  bestCandidate = { staffId: staff.id, date: d, score: score };
                }
              }
            }
          });

          if (bestCandidate) {
            newSchedule[bestCandidate.staffId][bestCandidate.date] = SHIFT_TYPES.OFF;
            neededOffs[bestCandidate.staffId]--;
            totalNeeded--;
          } else {
            break;
          }
        }

        // 残りの空きを日勤で埋める。
        // 非常勤で連勤上限が設定されている職員は、上限を超える連勤にならないよう、
        // 超える位置には公休(×)を入れて連勤を断ち切る（連勤上限は hard 扱い）。
        staffData.forEach(staff => {
          const maxRun = getMaxRun(staff);
          const capped = staff.isCustomTime && maxRun < 4;
          let run = 0; // 直近の連続勤務日数
          for (let d = 1; d <= daysInMonth; d++) {
            const cur = newSchedule[staff.id][d];
            if (cur !== SHIFT_TYPES.NONE) {
              run = isWorkDay(cur) ? run + 1 : 0;
              continue;
            }
            if (isCellLocked(staff.id, d, newSchedule)) { run = 0; continue; }

            if (capped && run >= maxRun) {
              // これ以上連勤させられない → 公休で区切る（NG指定があれば日勤のまま）
              if (!isNg(staff.id, d, SHIFT_TYPES.OFF)) {
                newSchedule[staff.id][d] = SHIFT_TYPES.OFF;
                run = 0;
                continue;
              }
            }
            if (!isNg(staff.id, d, SHIFT_TYPES.DAY)) {
              newSchedule[staff.id][d] = SHIFT_TYPES.DAY;
              run++;
            } else {
              run = 0;
            }
          }
        });

        const shuffledStaff = [...staffData].sort(() => Math.random() - 0.5);

        let mutations = 0;
        let attempts = 0;
        while (mutations < 20 && attempts < 1000) {
          attempts++;
          const staff = shuffledStaff[Math.floor(Math.random() * shuffledStaff.length)];
          const days = Array.from({length: daysInMonth}, (_, i) => i + 1);
          
          const dayDays = days.filter(d => newSchedule[staff.id][d] === SHIFT_TYPES.DAY && !isCellLocked(staff.id, d, newSchedule) && !isNg(staff.id, d, SHIFT_TYPES.OFF));
          const offDays = days.filter(d => {
             if (newSchedule[staff.id][d] !== SHIFT_TYPES.OFF) return false;
             if (isCellLocked(staff.id, d, newSchedule)) return false;
             if (isNg(staff.id, d, SHIFT_TYPES.DAY)) return false;
             const prevDay = d - 1;
             if (prevDay >= 1 && newSchedule[staff.id][prevDay] === SHIFT_TYPES.NIGHT_END) return false;
             return true;
          });

          if (dayDays.length > 0 && offDays.length > 0) {
            const d1 = dayDays[Math.floor(Math.random() * dayDays.length)];
            const d2 = offDays[Math.floor(Math.random() * offDays.length)];

            const isoBefore = countIsolatedOffs(staff.id, newSchedule);
            newSchedule[staff.id][d1] = SHIFT_TYPES.OFF;
            newSchedule[staff.id][d2] = SHIFT_TYPES.DAY;
            const isoAfter = countIsolatedOffs(staff.id, newSchedule);

            const cons = calcConsecutiveDetail(staff.id, d2, newSchedule).total;
            
            let isNightEndDay = false;
            const shiftP1 = getShiftSafe(staff.id, d2 - 1, newSchedule);
            const shiftP2 = getShiftSafe(staff.id, d2 - 2, newSchedule);
            if (shiftP1 === SHIFT_TYPES.NIGHT_END && shiftP2 === SHIFT_TYPES.NIGHT) {
                isNightEndDay = true;
            }

            const countD1 = getDayShiftCount(d1, newSchedule);
            const countD2 = getDayShiftCount(d2, newSchedule);
            const morningD1 = getMorningTargetForDay(d1, calendar[d1-1].day); // 朝ピーク下限の基準
            const targetD2 = getTargetForDay(d2, calendar[d2-1].day);

            // countD1 が 朝ピーク必要数-1 を下回る＝2以上不足を作る移動は破棄（hard）。
            // あわせて、公休が飛び飛びに増える移動（単独公休が増える）も破棄して連休を守る。
            if (cons > getMaxRun(staff) || isNightEndDay || countD1 < morningD1 - 1 || countD2 > targetD2 + 2
                || isoAfter > isoBefore) {
               newSchedule[staff.id][d1] = SHIFT_TYPES.DAY;
               newSchedule[staff.id][d2] = SHIFT_TYPES.OFF;
            } else {
               mutations++;
            }
          }
        }

        let pairMutations = 0;
        let pairAttempts = 0;
        while (pairMutations < 15 && pairAttempts < 1000) {
            pairAttempts++;
            const s1 = shuffledStaff[Math.floor(Math.random() * shuffledStaff.length)];
            const s2 = shuffledStaff[Math.floor(Math.random() * shuffledStaff.length)];
            if (s1.id === s2.id) continue;

            const days = Array.from({length: daysInMonth}, (_, i) => i + 1);
            
            const candidatesD1 = days.filter(d => 
                newSchedule[s1.id][d] === SHIFT_TYPES.DAY && 
                newSchedule[s2.id][d] === SHIFT_TYPES.OFF &&
                !isCellLocked(s1.id, d, newSchedule) && !isCellLocked(s2.id, d, newSchedule) &&
                !isNg(s1.id, d, SHIFT_TYPES.OFF) && !isNg(s2.id, d, SHIFT_TYPES.DAY) &&
                getShiftSafe(s2.id, d - 1, newSchedule) !== SHIFT_TYPES.NIGHT_END 
            );
            
            const candidatesD2 = days.filter(d => 
                newSchedule[s1.id][d] === SHIFT_TYPES.OFF && 
                newSchedule[s2.id][d] === SHIFT_TYPES.DAY &&
                !isCellLocked(s1.id, d, newSchedule) && !isCellLocked(s2.id, d, newSchedule) &&
                !isNg(s1.id, d, SHIFT_TYPES.DAY) && !isNg(s2.id, d, SHIFT_TYPES.OFF) &&
                getShiftSafe(s1.id, d - 1, newSchedule) !== SHIFT_TYPES.NIGHT_END 
            );

            if (candidatesD1.length > 0 && candidatesD2.length > 0) {
                const d1 = candidatesD1[Math.floor(Math.random() * candidatesD1.length)];
                const d2 = candidatesD2[Math.floor(Math.random() * candidatesD2.length)];

                const isoBefP = countIsolatedOffs(s1.id, newSchedule) + countIsolatedOffs(s2.id, newSchedule);
                newSchedule[s1.id][d1] = SHIFT_TYPES.OFF;
                newSchedule[s2.id][d1] = SHIFT_TYPES.DAY;
                newSchedule[s1.id][d2] = SHIFT_TYPES.DAY;
                newSchedule[s2.id][d2] = SHIFT_TYPES.OFF;

                const consS1 = calcConsecutiveDetail(s1.id, d2, newSchedule).total;
                const consS2 = calcConsecutiveDetail(s2.id, d1, newSchedule).total;

                let isNightEndDayS1 = false;
                const shiftP1_S1 = getShiftSafe(s1.id, d2 - 1, newSchedule);
                const shiftP2_S1 = getShiftSafe(s1.id, d2 - 2, newSchedule);
                if (shiftP1_S1 === SHIFT_TYPES.NIGHT_END && shiftP2_S1 === SHIFT_TYPES.NIGHT) isNightEndDayS1 = true;

                let isNightEndDayS2 = false;
                const shiftP1_S2 = getShiftSafe(s2.id, d1 - 1, newSchedule);
                const shiftP2_S2 = getShiftSafe(s2.id, d1 - 2, newSchedule);
                if (shiftP1_S2 === SHIFT_TYPES.NIGHT_END && shiftP2_S2 === SHIFT_TYPES.NIGHT) isNightEndDayS2 = true;

                const isoAftP = countIsolatedOffs(s1.id, newSchedule) + countIsolatedOffs(s2.id, newSchedule);

                // 公休が飛び飛びに増える入替も破棄して連休を守る
                if (consS1 > getMaxRun(s1) || consS2 > getMaxRun(s2) || isNightEndDayS1 || isNightEndDayS2
                    || isoAftP > isoBefP) {
                    newSchedule[s1.id][d1] = SHIFT_TYPES.DAY;
                    newSchedule[s2.id][d1] = SHIFT_TYPES.OFF;
                    newSchedule[s1.id][d2] = SHIFT_TYPES.OFF;
                    newSchedule[s2.id][d2] = SHIFT_TYPES.DAY;
                } else {
                    pairMutations++;
                }
            }
        }

        for (let loop = 0; loop < 3000; loop++) {
          let changed = false;

          for (const staff of shuffledStaff) {
            for (let d = 1; d <= daysInMonth; d++) {
              if (newSchedule[staff.id][d] === SHIFT_TYPES.DAY && !isCellLocked(staff.id, d, newSchedule)) { 
                 if (isNg(staff.id, d, SHIFT_TYPES.OFF)) continue;
                 const cons = calcConsecutiveDetail(staff.id, d, newSchedule).total;
                 if (cons > getMaxRun(staff)) {
                   const candidates = [];
                   for (let fd = 1; fd <= daysInMonth; fd++) {
                     if (newSchedule[staff.id][fd] === SHIFT_TYPES.OFF && !isCellLocked(staff.id, fd, newSchedule)) {
                        if (isNg(staff.id, fd, SHIFT_TYPES.DAY)) continue;
                        
                        const prevDayOfFd = fd - 1;
                        if (prevDayOfFd >= 1 && newSchedule[staff.id][prevDayOfFd] === SHIFT_TYPES.NIGHT_END) {
                          continue; 
                        }

                        let isNightEndDay = false;
                        const shiftP1 = getShiftSafe(staff.id, fd - 1, newSchedule);
                        const shiftP2 = getShiftSafe(staff.id, fd - 2, newSchedule);
                        if (shiftP1 === SHIFT_TYPES.NIGHT_END && shiftP2 === SHIFT_TYPES.NIGHT) {
                            isNightEndDay = true;
                        }
                        if (isNightEndDay) continue;

                        const dayCountFree = getDayShiftCount(fd, newSchedule); 
                        const dayCountTarget = getDayShiftCount(d, newSchedule); 
                        const targetDayInfo = calendar[fd-1];
                        const sourceDayInfo = calendar[d-1];

                        const destTarget = getTargetForDay(fd, targetDayInfo.day);
                        const sourceTarget = getTargetForDay(d, sourceDayInfo.day);

                        if (dayCountTarget <= 3) continue; 
                        if (dayCountFree >= 8) continue; 
                        
                        if (dayCountTarget <= sourceTarget) continue;

                        let score = 0;
                        if (dayCountTarget > sourceTarget) score += 50; 
                        if (dayCountFree < destTarget) score += 30; 

                        // 公休が飛び飛びにならない移動を優先する
                        const isoDelta = isoDeltaOfMove(staff.id, newSchedule, d, fd);
                        if (isoDelta > 0) score -= 200 * isoDelta;
                        else if (isoDelta < 0) score += 80 * (-isoDelta);

                        candidates.push({ date: fd, score });
                     }
                   }
                   
                   if (candidates.length > 0) {
                     candidates.sort((a, b) => b.score - a.score);
                     const best = candidates[0];
                     newSchedule[staff.id][d] = SHIFT_TYPES.OFF;
                     newSchedule[staff.id][best.date] = SHIFT_TYPES.DAY;
                     changed = true;
                     break; 
                   }
                 }
              }
            }
          }

          const richDays = [];
          for (let d = 1; d <= daysInMonth; d++) {
            const t = getTargetForDay(d, calendar[d-1].day);
            if (getDayShiftCount(d, newSchedule) > t) richDays.push(d);
          }
          
          if (richDays.length > 0) {
            const targetDay = richDays[Math.floor(Math.random() * richDays.length)];
            const workingStaff = shuffledStaff.filter(s => newSchedule[s.id][targetDay] === SHIFT_TYPES.DAY && !isCellLocked(s.id, targetDay, newSchedule) && !isNg(s.id, targetDay, SHIFT_TYPES.OFF));
            
            if (workingStaff.length > 0) {
              const staff = workingStaff[Math.floor(Math.random() * workingStaff.length)];
              const candidates = [];
              for (let fd = 1; fd <= daysInMonth; fd++) {
                if (newSchedule[staff.id][fd] === SHIFT_TYPES.OFF && !isCellLocked(staff.id, fd, newSchedule) && !isNg(staff.id, fd, SHIFT_TYPES.DAY)) {
                   const prevDayOfFd = fd - 1;
                   if (prevDayOfFd >= 1 && newSchedule[staff.id][prevDayOfFd] === SHIFT_TYPES.NIGHT_END) {
                     continue; 
                   }

                   const cnt = getDayShiftCount(fd, newSchedule);
                   const dayInfo = calendar[fd-1];
                   const destTarget = getTargetForDay(fd, dayInfo.day);

                   let moveScore = 0;
                   moveScore += (8 - cnt) * 10; 
                   if (cnt < destTarget) moveScore += 40; 
                   if (cnt >= destTarget + 1) moveScore = -9999;

                   // 公休が飛び飛びにならない移動を優先する
                   const isoDelta = isoDeltaOfMove(staff.id, newSchedule, targetDay, fd);
                   if (isoDelta > 0) moveScore -= 200 * isoDelta;
                   else if (isoDelta < 0) moveScore += 80 * (-isoDelta);

                   if (moveScore > 0) {
                      candidates.push({ date: fd, score: moveScore });
                   }
                }
              }
              
              if (candidates.length > 0) {
                candidates.sort((a, b) => b.score - a.score); 
                const dest = candidates[0];
                const isoBeforeMove = countIsolatedOffs(staff.id, newSchedule);
                
                newSchedule[staff.id][targetDay] = SHIFT_TYPES.OFF;
                newSchedule[staff.id][dest.date] = SHIFT_TYPES.DAY;
                
                const cons = calcConsecutiveDetail(staff.id, dest.date, newSchedule).total;
                
                let isNightEndDay = false;
                const shiftP1 = getShiftSafe(staff.id, dest.date - 1, newSchedule);
                const shiftP2 = getShiftSafe(staff.id, dest.date - 2, newSchedule);
                if (shiftP1 === SHIFT_TYPES.NIGHT_END && shiftP2 === SHIFT_TYPES.NIGHT) {
                    isNightEndDay = true;
                }

                const isoWorse = countIsolatedOffs(staff.id, newSchedule) > isoBeforeMove;

                if (cons > getMaxRun(staff) || isNightEndDay || isoWorse) {
                  newSchedule[staff.id][targetDay] = SHIFT_TYPES.DAY;
                  newSchedule[staff.id][dest.date] = SHIFT_TYPES.OFF;
                } else {
                  changed = true;
                }
              }
            }
          }

          if (!changed && loop > 100) break; 
        }

        // === 仕上げ: 単独で入ってしまった公休を連休にまとめ直す ===
        // 公休の総数は変えずに「出勤→公休→出勤」の公休を、既にある休みの隣へ移動する。
        const consolidateOffs = () => {
          let moved = 0;
          for (let pass = 0; pass < 6; pass++) {
            let changedThisPass = false;

            for (const staff of staffData) {
              if (!newSchedule[staff.id]) continue;
              const w = headWeight(staff);

              for (let d = 1; d <= daysInMonth; d++) {
                if (newSchedule[staff.id][d] !== SHIFT_TYPES.OFF) continue;
                if (isCellLocked(staff.id, d, newSchedule)) continue;
                // 単独公休だけを対象にする
                const prevRest = (d <= 1) ? true : isRestNeighbor(newSchedule[staff.id][d - 1]);
                const nextRest = (d >= daysInMonth) ? true : isRestNeighbor(newSchedule[staff.id][d + 1]);
                if (prevRest || nextRest) continue;
                // 公休を外して日勤にできる日か
                if (isNg(staff.id, d, SHIFT_TYPES.DAY)) continue;
                const dP1 = getShiftSafe(staff.id, d - 1, newSchedule);
                const dP2 = getShiftSafe(staff.id, d - 2, newSchedule);
                if (dP1 === SHIFT_TYPES.NIGHT_END && dP2 === SHIFT_TYPES.NIGHT) continue;
                if (dP1 === SHIFT_TYPES.NIGHT_END) continue;
                if (!restOk(dP1, SHIFT_TYPES.DAY)) continue;
                if (!restOk(SHIFT_TYPES.DAY, getShiftSafe(staff.id, d + 1, newSchedule))) continue;

                const cands = [];
                for (let t = 1; t <= daysInMonth; t++) {
                  if (t === d) continue;
                  if (newSchedule[staff.id][t] !== SHIFT_TYPES.DAY) continue;
                  if (isCellLocked(staff.id, t, newSchedule)) continue;
                  if (isNg(staff.id, t, SHIFT_TYPES.OFF)) continue;

                  // 抜けた日の人員が下限を割らないこと（必要数-1／朝ピーク-1 まで）
                  const tInfo = calendar[t - 1];
                  if (getDayShiftCount(t, newSchedule) - w < getTargetForDay(t, tInfo.day) - 1) continue;
                  if (getMorningSupply(t, newSchedule) - w < getMorningTargetForDay(t, tInfo.day) - 1) continue;

                  // 実際に入れ替えて連休が増えるか・連勤上限を超えないかを確認
                  newSchedule[staff.id][d] = SHIFT_TYPES.DAY;
                  newSchedule[staff.id][t] = SHIFT_TYPES.OFF;
                  const iso = countIsolatedOffs(staff.id, newSchedule);
                  const consOk = calcConsecutiveDetail(staff.id, d, newSchedule).total <= getMaxRun(staff);
                  const restOkT = restOk(getShiftSafe(staff.id, t - 1, newSchedule), SHIFT_TYPES.OFF);
                  newSchedule[staff.id][d] = SHIFT_TYPES.OFF;
                  newSchedule[staff.id][t] = SHIFT_TYPES.DAY;
                  if (!consOk || !restOkT) continue;

                  const tP1 = getShiftSafe(staff.id, t - 1, newSchedule);
                  const tN1 = getShiftSafe(staff.id, t + 1, newSchedule);
                  const adjacent = isRestNeighbor(tP1) || isRestNeighbor(tN1);
                  if (!adjacent) continue;

                  cands.push({ date: t, iso });
                }

                if (cands.length === 0) continue;
                const isoNow = countIsolatedOffs(staff.id, newSchedule);
                cands.sort((a, b) => a.iso - b.iso);
                const best = cands[0];
                if (best.iso >= isoNow) continue;

                newSchedule[staff.id][d] = SHIFT_TYPES.DAY;
                newSchedule[staff.id][best.date] = SHIFT_TYPES.OFF;
                moved++;
                changedThisPass = true;
              }
            }

            if (!changedThisPass) break;
          }
          return moved;
        };
        consolidateOffs();

        // === 仕上げ: 夕方に出せる人がいない日を作らない ===
        // 夕方(19:00退勤)に入れるのは「翌日が休み・当直・遅番」の非C職員だけ。
        // 日勤の埋め合わせの結果、その条件を満たす人がゼロの日が残ることがある。
        // その日に日勤している非C職員の「翌日の日勤」を公休に替え、代わりに
        // その人の別の公休を日勤に戻す（公休の総数は変えない）ことで枠を作る。
        const ensureEveningCapable = () => {
          let made = 0;
          for (let d = 1; d < daysInMonth; d++) {
            if (eveningTarget <= 0) break;
            const ok = staffData.some(st => st.group !== 'C'
              && [SHIFT_TYPES.DAY, SHIFT_TYPES.EARLY].includes(newSchedule[st.id][d])
              && !nextBlocksEvening(newSchedule[st.id][d + 1])
              && !isNg(st.id, d, SHIFT_TYPES.DAY_LATE));
            if (ok) continue;

            let fixed = false;
            for (const st of staffData) {
              if (fixed) break;
              if (st.group === 'C') continue;
              if (newSchedule[st.id][d] !== SHIFT_TYPES.DAY) continue;
              if (isNg(st.id, d, SHIFT_TYPES.DAY_LATE)) continue;
              // 翌日を公休にできること
              if (newSchedule[st.id][d + 1] !== SHIFT_TYPES.DAY) continue;
              if (isCellLocked(st.id, d + 1, newSchedule)) continue;
              if (isNg(st.id, d + 1, SHIFT_TYPES.OFF)) continue;
              const w = headWeight(st);
              const info1 = calendar[d];
              if (getMorningSupply(d + 1, newSchedule) - w < getMorningTargetForDay(d + 1, info1.day) - 1) continue;
              // 代わりに日勤へ戻せる、その人の公休を探す
              for (let e = 1; e <= daysInMonth; e++) {
                if (e === d || e === d + 1) continue;
                if (newSchedule[st.id][e] !== SHIFT_TYPES.OFF) continue;
                if (isCellLocked(st.id, e, newSchedule)) continue;
                if (isNg(st.id, e, SHIFT_TYPES.DAY)) continue;
                const p1 = getShiftSafe(st.id, e - 1, newSchedule);
                if (p1 === SHIFT_TYPES.NIGHT_END || p1 === SHIFT_TYPES.NIGHT) continue;
                if (!restOk(p1, SHIFT_TYPES.DAY)) continue;
                if (!restOk(SHIFT_TYPES.DAY, getShiftSafe(st.id, e + 1, newSchedule))) continue;
                newSchedule[st.id][d + 1] = SHIFT_TYPES.OFF;
                newSchedule[st.id][e] = SHIFT_TYPES.DAY;
                const runOk = calcConsecutiveDetail(st.id, e, newSchedule).total <= getMaxRun(st);
                if (!runOk) {
                  newSchedule[st.id][d + 1] = SHIFT_TYPES.DAY;
                  newSchedule[st.id][e] = SHIFT_TYPES.OFF;
                  continue;
                }
                made++; fixed = true; break;
              }
            }
          }
          return made;
        };
        ensureEveningCapable();

        setSchedule(newSchedule);
        setStep(3); 
        setScheduleStep(step);
        // 連勤上限のせいで公休が設定日数を超えた職員を報告（設定が厳しすぎないかの判断材料）
        const runCapNotes = [];
        staffData.forEach(staff => {
          const m = parseInt(staff.maxConsecutive, 10);
          if (!(staff.isCustomTime && m >= 1 && m <= 4)) return;
          let offs = 0;
          for (let d = 1; d <= daysInMonth; d++) if (newSchedule[staff.id][d] === SHIFT_TYPES.OFF) offs++;
          const targetOff = (staff.customOffDays !== '' && staff.customOffDays !== undefined)
            ? Number(staff.customOffDays) : requiredOffDays;
          if (offs > targetOff) runCapNotes.push(`${staff.name}(連勤上限${m}→公休${offs}日/設定${targetOff}日)`);
        });

        if (runCapNotes.length > 0) {
          setMessage({
            text: `Step 3: 展開・公休・日勤・均しを完了しました。連勤上限のため次の職員は公休が設定日数より多くなっています → ${runCapNotes.join('、')}。連勤上限を緩めるか公休数の設定を見直すと解消します。次は「早遅」の配置です。`,
            type: 'info',
          });
        } else {
          setMessage({ text: 'Step 3: 展開・公休・日勤・均しを一括で完了しました。次は「早遅」の配置です。', type: 'success' });
        }
      };

      const distributeEarlyLate = (isRetry = false) => {
        saveHistory();
        const newSchedule = applyWeekdayPattern(JSON.parse(JSON.stringify(schedule)));
        
        staffData.forEach(staff => {
            for (let d = 1; d <= daysInMonth; d++) {
                // 早/遅/早日/日遅 の自動配置分は一旦日勤へ戻す（ロック済み=手動指定は保持）
                if ([SHIFT_TYPES.EARLY, SHIFT_TYPES.LATE, SHIFT_TYPES.EARLY_DAY, SHIFT_TYPES.DAY_LATE].includes(newSchedule[staff.id][d]) && !isCellLocked(staff.id, d, newSchedule)) {
                    if (!isNg(staff.id, d, SHIFT_TYPES.DAY)) {
                        newSchedule[staff.id][d] = SHIFT_TYPES.DAY;
                    } else {
                        newSchedule[staff.id][d] = SHIFT_TYPES.NONE;
                    }
                }
            }
        });

        const earlyCounts = {};
        const lateCounts = {};
        staffData.forEach(s => {
          earlyCounts[s.id] = 0;
          lateCounts[s.id] = 0;
        });

        for (let d = 1; d <= daysInMonth; d++) {
          staffData.forEach(s => {
            const shift = newSchedule[s.id][d];
            if (shift === SHIFT_TYPES.EARLY) earlyCounts[s.id]++;
            if (shift === SHIFT_TYPES.LATE) lateCounts[s.id]++;
          });
        }

        let groupEarlyCounts = { nightGrp: 0, dayGrp: 0 };
        let groupLateCounts = { nightGrp: 0, dayGrp: 0 };
        
        staffData.forEach(s => {
            const isNightGrp = ['A', 'D'].includes(s.group);
            if (isNightGrp) {
                groupEarlyCounts.nightGrp += earlyCounts[s.id];
                groupLateCounts.nightGrp += lateCounts[s.id];
            } else if (s.group !== 'C') {
                groupEarlyCounts.dayGrp += earlyCounts[s.id];
                groupLateCounts.dayGrp += lateCounts[s.id];
            }
        });

        const earlyLateEligibleStaff = staffData.filter(s => s.group !== 'C');
        const nightGrpEligibleCount = earlyLateEligibleStaff.filter(s => ['A', 'D'].includes(s.group)).length || 1;
        const dayGrpEligibleCount = earlyLateEligibleStaff.filter(s => !['A', 'D'].includes(s.group)).length || 1;

        // === 公平性（グループ内均等化）と 早番/遅番の連続回避 のための共通処理 ===
        // 夜勤可能グループ(A/D)の中で早番数・遅番数を均等化することを最優先にする。
        // 併せて、早番どうし・遅番どうしが連続しないように配置する。
        const isEarlyType = (v) => v === SHIFT_TYPES.EARLY || v === SHIFT_TYPES.EARLY_DAY;
        const isLateType = (v) => v === SHIFT_TYPES.LATE || v === SHIFT_TYPES.DAY_LATE;
        const staffById = (sid) => staffData.find(s => s.id === sid);
        const isNightGrpId = (sid) => ['A', 'D'].includes(staffById(sid)?.group);
        const nightIds = earlyLateEligibleStaff.filter(s => ['A', 'D'].includes(s.group)).map(s => s.id);
        const dayIds = earlyLateEligibleStaff.filter(s => !['A', 'D'].includes(s.group)).map(s => s.id);
        // グループ内平均（この平均からの偏差が小さい人を選ぶことで、グループ内が均等化される）
        const meanOf = (ids, counts) => ids.length ? ids.reduce((a, id) => a + (counts[id] || 0), 0) / ids.length : 0;

        // 早番/遅番の「連続」ペナルティ。値が大きいほど避ける。
        const consecPenaltyEarly = (sid, d) => {
          const p1 = d > 1 ? newSchedule[sid][d - 1] : '';
          const p2 = d > 2 ? newSchedule[sid][d - 2] : '';
          const n1 = d < daysInMonth ? newSchedule[sid][d + 1] : '';
          let pen = 0;
          if (isEarlyType(p1)) pen += 3;   // 前日が早番＝早番の連続
          if (isEarlyType(n1)) pen += 3;   // 翌日が既に早番
          if (isLateType(p1)) pen += 5;    // 遅→早（勤務間隔が短い）
          if (isEarlyType(p2)) pen += 1;   // 1日おきの早番も少し避ける
          if (isLateType(n1)) pen += 1;
          return pen;
        };
        const consecPenaltyLate = (sid, d) => {
          const p1 = d > 1 ? newSchedule[sid][d - 1] : '';
          const p2 = d > 2 ? newSchedule[sid][d - 2] : '';
          const n1 = d < daysInMonth ? newSchedule[sid][d + 1] : '';
          let pen = 0;
          if (isLateType(p1)) pen += 3;    // 前日が遅番＝遅番の連続
          if (isLateType(n1)) pen += 3;    // 翌日が既に遅番
          if (isEarlyType(n1)) pen += 5;   // 遅→翌日早番（勤務間隔が短い）
          if (isLateType(p2)) pen += 1;    // 1日おきの遅番も少し避ける
          if (isEarlyType(p1)) pen += 1;
          return pen;
        };

        // 候補から最良（スコア最小）を1人選ぶ。割り当てのたびに再計算して均等化を保つ。
        const pickBest = (cands, scoreFn) => {
          let best = null, bestScore = Infinity;
          for (const sid of cands) {
            const sc = scoreFn(sid);
            if (sc < bestScore) { bestScore = sc; best = sid; }
          }
          return best;
        };
        // スコア: 連続ペナルティ と グループ内の偏差 のバランスを取る。
        //  ・実際の連続(ペナルティ3以上)は公平性より優先して回避する
        //  ・軽微なペナルティ(1＝1日おき等)は、回数の偏りが大きければ公平性を優先する
        //    （重み400と150の比により、偏差3回ぶんの差は軽微ペナルティを上回る）
        const makeScorer = (counts, penFn, d) => (sid) => {
          const own = isNightGrpId(sid) ? nightIds : dayIds;
          const dev = (counts[sid] || 0) - meanOf(own, counts);
          const groupMean = meanOf(own, counts);
          // 早番・遅番を合わせた総負担の偏差も見る（片方だけでなく「早遅の合計」が偏らないように）
          const totalCounts = {};
          own.forEach(id => { totalCounts[id] = (earlyCounts[id] || 0) + (lateCounts[id] || 0); });
          const devTotal = totalCounts[sid] - meanOf(own, totalCounts);
          return penFn(sid, d) * 400 + dev * 150 + devTotal * 80 + groupMean * 10 + Math.random() * 3;
        };

        for (let d = 1; d <= daysInMonth; d++) {
          let dayStaffIds = [];
          staffData.forEach(s => {
            if (newSchedule[s.id][d] === SHIFT_TYPES.DAY) {
              dayStaffIds.push(s.id);
            }
          });

          // 朝ピーク帯の下限を守るための遅番上限。朝在籍 = (日勤者 - 遅番) + 早日/日遅(固定で朝在籍)。
          // 遅番が朝ピークを (必要数-1) 未満に削らないよう、その日の遅番数を制限する（hard）。
          const morningReqD = getMorningTargetForDay(d, calendar[d - 1].day);
          // 既に入っている（手動ロック等の）早番/早日・遅番/日遅を集計し、必要数へ二重配置しないようにする
          let fixedMorningD = 0, earlyAlready = 0;
          staffData.forEach(s => {
            const v = newSchedule[s.id][d];
            if (v === SHIFT_TYPES.EARLY_DAY || v === SHIFT_TYPES.DAY_LATE) fixedMorningD += headWeight(s);
            if (v === SHIFT_TYPES.EARLY || v === SHIFT_TYPES.EARLY_DAY) earlyAlready++;
          });
          // 朝ピークに余裕がある日だけ遅番を出す。余裕がない日は(2)の日遅で夕方を確保し、
          // 朝の在籍を削らない（遅番は10:30出勤のため入浴帯の戦力にならない）。
          let dayWeightedD = 0;
          dayStaffIds.forEach(sid => {
            const st = staffData.find(x => x.id === sid);
            dayWeightedD += headWeight(st);
          });
          const maxLateToday = Math.max(0, Math.floor(dayWeightedD + fixedMorningD - morningReqD));
          let lateCountToday = 0;
          // 夕方(遅+日遅)の現在数を先頭で集計（手動ロックの遅/日遅も含む）。以降の遅番/日遅配置はこれを見て
          // 夕方必要数(eveningTarget)を超えないようにし、ロック済みへの二重配置を防ぐ。
          let eveningCoverage = 0;
          staffData.forEach(s => {
            const v = newSchedule[s.id][d];
            if (v === SHIFT_TYPES.LATE || v === SHIFT_TYPES.DAY_LATE) eveningCoverage++;
          });

          // 候補の抽出（勤務間隔15時間を hard 制約として厳守）
          //  ・早番: 前日の退勤が遅いと組めない。前日が日勤(17:00)/遅番(19:00)/早日/日遅 は不可。
          //          → 前日が 休み・明け・早番 の人だけが候補。
          //  ・遅番: 翌日の出勤が早いと組めない。遅番(19:00退勤)の翌日に 日勤/早番 は不可。
          //          → 翌日が 休み系 か 既に遅番系 の人だけが候補（実質「休みの前日」に置く）。
          let earlyCandidates = [];
          let lateCandidates = [];

          dayStaffIds.forEach(sid => {
            const staff = staffData.find(s => s.id === sid);
            if (staff && staff.group === 'C') return;
            if (isCellLocked(sid, d, newSchedule)) return;

            const prevShift = (d === 1) ? SHIFT_TYPES.OFF : newSchedule[sid][d - 1];
            const nextShift = (d === daysInMonth) ? SHIFT_TYPES.OFF : newSchedule[sid][d + 1];

            // 早番: 前日→早番 の間隔がOKなこと
            if (restOk(prevShift, SHIFT_TYPES.EARLY) && !isNg(sid, d, SHIFT_TYPES.EARLY)) {
              earlyCandidates.push(sid);
            }
            // 遅番: 前日→遅番 と 遅番→翌日 の両方の間隔がOKなこと
            if (restOk(prevShift, SHIFT_TYPES.LATE) && restOk(SHIFT_TYPES.LATE, nextShift) && !isNg(sid, d, SHIFT_TYPES.LATE)) {
              lateCandidates.push(sid);
            }
          });

          // === 早番の割り当て ===
          // 必要数まで1人ずつ選ぶ。毎回スコアを再計算するので、割り当てるほど均等化が進む。
          {
            const earlyReq = getEarlyTargetForDay(calendar[d - 1].day);
            const nEarly = Math.max(0, earlyReq - earlyAlready);
            for (let k = 0; k < nEarly; k++) {
              const pool = earlyCandidates.filter(sid => newSchedule[sid][d] === SHIFT_TYPES.DAY);
              if (pool.length === 0) break;
              const sid = pickBest(pool, makeScorer(earlyCounts, consecPenaltyEarly, d));
              if (!sid) break;
              newSchedule[sid][d] = SHIFT_TYPES.EARLY;
              earlyCounts[sid]++;
              if (isNightGrpId(sid)) groupEarlyCounts.nightGrp++; else groupEarlyCounts.dayGrp++;
              earlyCandidates = earlyCandidates.filter(id => id !== sid);
              lateCandidates = lateCandidates.filter(id => id !== sid);
            }
          }

          // === 夕方(17:00以降〜19:00)の在籍を確保 ===
          // 夕方在籍 = 遅番 + 日遅。まず朝ピークを割らない範囲(maxLateToday)で遅番を出し、
          // それでも足りない（＝遅番を増やすと朝ピークが割れる短い日）は日遅で延長し、朝も夕方も確保する。
          const eveningReq = eveningTarget;
          // eveningCoverage は日の先頭で集計済み。ここでは追加分のみ扱う。

          // (1) 遅番で夕方を確保（朝ピーク遅番上限を厳守・グループ内均等・連続回避）
          while (eveningCoverage < eveningReq && lateCountToday < maxLateToday) {
            const pool = lateCandidates.filter(sid => newSchedule[sid][d] === SHIFT_TYPES.DAY);
            if (pool.length > 0) {
              const sid = pickBest(pool, makeScorer(lateCounts, consecPenaltyLate, d));
              if (!sid) break;
              newSchedule[sid][d] = SHIFT_TYPES.LATE;
              lateCounts[sid]++; lateCountToday++; eveningCoverage++;
              if (isNightGrpId(sid)) groupLateCounts.nightGrp++; else groupLateCounts.dayGrp++;
              lateCandidates = lateCandidates.filter(id => id !== sid);
              continue;
            }
            // 「翌日が休み」の候補が居ない日は、翌日も遅番にする（連続遅番）ことで勤務間隔を守る。
            // 勤務間隔(hard) > 夕方の人員確保 > 連続回避(soft) の優先順位。翌日の朝ピーク下限は厳守する。
            const chain = dayStaffIds.filter(sid => {
              const st = staffData.find(s => s.id === sid);
              if (!st || st.group === 'C') return false;
              if (newSchedule[sid][d] !== SHIFT_TYPES.DAY) return false;
              if (isCellLocked(sid, d, newSchedule)) return false;
              if (isNg(sid, d, SHIFT_TYPES.LATE)) return false;
              const pv = (d === 1) ? SHIFT_TYPES.OFF : newSchedule[sid][d - 1];
              if (!restOk(pv, SHIFT_TYPES.LATE)) return false;
              const nd = d + 1;
              if (nd > daysInMonth) return true;
              // 翌日を遅番に変えられること
              if (newSchedule[sid][nd] !== SHIFT_TYPES.DAY) return false;
              if (isCellLocked(sid, nd, newSchedule)) return false;
              if (isNg(sid, nd, SHIFT_TYPES.LATE)) return false;
              // 翌々日との間隔（遅番→翌々日）も満たすこと
              const nnd = nd + 1;
              const nnShift = (nnd > daysInMonth) ? SHIFT_TYPES.OFF : newSchedule[sid][nnd];
              if (!restOk(SHIFT_TYPES.LATE, nnShift)) return false;
              // 翌日の朝ピーク下限を割らないこと
              const req = getMorningTargetForDay(nd, calendar[nd - 1].day);
              let supply = 0;
              staffData.forEach(x => {
                if (MORNING_PRESENT_SHIFTS.includes(newSchedule[x.id][nd])) supply += headWeight(x);
              });
              return (supply - 1) >= req - 1;
            });
            if (chain.length === 0) break;
            const sid = pickBest(chain, makeScorer(lateCounts, consecPenaltyLate, d));
            if (!sid) break;
            newSchedule[sid][d] = SHIFT_TYPES.LATE;
            lateCounts[sid]++; lateCountToday++; eveningCoverage++;
            if (isNightGrpId(sid)) groupLateCounts.nightGrp++; else groupLateCounts.dayGrp++;
            if (d + 1 <= daysInMonth) {
              newSchedule[sid][d + 1] = SHIFT_TYPES.LATE; // 連鎖させて勤務間隔を守る
              lateCounts[sid]++;
              if (isNightGrpId(sid)) groupLateCounts.nightGrp++; else groupLateCounts.dayGrp++;
            }
            lateCandidates = lateCandidates.filter(id => id !== sid);
          }

          // (2) それでも夕方が不足 → 日勤者を「日遅」に延長（朝ピークは維持したまま夕方を確保）
          if (eveningCoverage < eveningReq) {
             const dlCands = dayStaffIds.filter(sid => {
               const st = staffData.find(s => s.id === sid);
               if (!st || st.group === 'C') return false;
               if (newSchedule[sid][d] !== SHIFT_TYPES.DAY) return false; // まだ日勤のままの人
               if (isCellLocked(sid, d, newSchedule)) return false;
               if (isNg(sid, d, SHIFT_TYPES.DAY_LATE)) return false;
               // 日遅(19:00退勤)も勤務間隔を厳守する
               const pv = (d === 1) ? SHIFT_TYPES.OFF : newSchedule[sid][d - 1];
               const nx = (d === daysInMonth) ? SHIFT_TYPES.OFF : newSchedule[sid][d + 1];
               if (!restOk(pv, SHIFT_TYPES.DAY_LATE)) return false;
               if (!restOk(SHIFT_TYPES.DAY_LATE, nx)) return false;
               return true;
             }).sort((a, b) => {
               const ga = ['A', 'D'].includes(staffData.find(s => s.id === a).group) ? 1 : 0;
               const gb = ['A', 'D'].includes(staffData.find(s => s.id === b).group) ? 1 : 0;
               return ga - gb; // 非夜勤群(日勤メンバー)を優先して延長
             });
             for (const sid of dlCands) {
               if (eveningCoverage >= eveningReq) break;
               newSchedule[sid][d] = SHIFT_TYPES.DAY_LATE;
               eveningCoverage++;
             }
          }
        }

        // === 2巡目: 夕方が空いた日を埋め直す ===
        // 1巡目は日付順の前向き1パスなので、「翌日が遅番になる」ことをまだ知らずに
        // 日遅を見送ってしまう日がある。全日程が確定してからもう一度だけ拾い直す。
        {
          const isEveningShift = (v) => v === SHIFT_TYPES.LATE || v === SHIFT_TYPES.DAY_LATE;
          const morningSupplyOf = (day) => {
            let n = 0;
            staffData.forEach(st => {
              if (MORNING_PRESENT_SHIFTS.includes(newSchedule[st.id][day])) n += headWeight(st);
            });
            return n;
          };
          const earlyCountOf = (day) => staffData.filter(st =>
            [SHIFT_TYPES.EARLY, SHIFT_TYPES.EARLY_DAY].includes(newSchedule[st.id][day])).length;

          for (let d = 1; d <= daysInMonth; d++) {
            let cover = 0;
            staffData.forEach(st => { if (isEveningShift(newSchedule[st.id][d])) cover += headWeight(st); });
            if (cover >= eveningTarget) continue;
