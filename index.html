                      {staffData.map(s => (
                        <tr key={s.id} className="border-t">
                          <td className="p-2">
                            <input 
                              type="text" 
                              value={s.name}
                              onChange={(e) => handleUpdateStaff(s.id, 'name', e.target.value)}
                              className="border rounded px-2 py-1 w-full"
                            />
                          </td>
                          <td className="p-2">
                            <select 
                              value={s.group} 
                              onChange={(e) => handleUpdateStaff(s.id, 'group', e.target.value)}
                              className="border rounded px-1 sm:px-2 py-1 w-full text-xs sm:text-sm"
                            >
                              <option value="A">夜勤 (A)</option>
                              <option value="B">日勤 (B)</option>
                              <option value="C">日勤 (C:早遅なし)</option> 
                              <option value="D">夜勤 (D:当明当明 不可)</option> 
                            </select>
                          </td>
                          <td className="p-2 text-center">
                            {['A', 'D'].includes(s.group) ? (
                              <div className="flex items-center justify-center gap-1">
                                <input 
                                  type="number" 
                                  placeholder="自動"
                                  className="border rounded w-12 p-1 text-right text-xs"
                                  value={nightTargets[s.id] || ''}
                                  onChange={(e) => handleTargetChange(s.id, e.target.value)}
                                />
                                <span className="text-xs text-gray-500">回</span>
                              </div>
                            ) : (
                              <span className="text-xs text-gray-400">-</span>
                            )}
                          </td>
                          <td className="p-2 text-center">
                            {['A', 'D'].includes(s.group) ? (
                              <button 
                                onClick={() => setSettingForbiddenPairsFor(s.id)}
                                className={`border rounded px-2 py-1 text-xs font-bold w-full transition-colors ${s.forbiddenPairs?.length > 0 ? 'bg-red-100 text-red-700 border-red-200 hover:bg-red-200' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                              >
                                {s.forbiddenPairs?.length > 0 ? `${s.forbiddenPairs.length}名` : '設定'}
                              </button>
                            ) : (
                              <span className="text-xs text-gray-400">-</span>
                            )}
                          </td>
                          <td className="p-2">
                             <div className="flex flex-col items-center justify-center gap-1">
                               <div className="flex items-center justify-center gap-1 sm:gap-2">
                                  <label className="flex items-center gap-1 text-[10px] sm:text-xs font-medium shrink-0 cursor-pointer">
                                    <input 
                                      type="checkbox" 
                                      className="w-3 h-3 accent-blue-600 cursor-pointer"
                                      checked={s.isCustomTime}
                                      onChange={(e) => handleUpdateStaff(s.id, 'isCustomTime', e.target.checked)}
                                    />
                                    ON
                                  </label>
                                  {s.isCustomTime && (
                                    <div className="flex items-center gap-0.5 sm:gap-1 text-[10px] sm:text-xs">
                                      <input type="time" value={s.customStart || '09:00'} onChange={e => handleUpdateStaff(s.id, 'customStart', e.target.value)} className="border rounded px-0.5 py-0.5 w-[55px] sm:w-[70px]" />
                                      <span className="text-gray-500">~</span>
                                      <input type="time" value={s.customEnd || '15:00'} onChange={e => handleUpdateStaff(s.id, 'customEnd', e.target.value)} className="border rounded px-0.5 py-0.5 w-[55px] sm:w-[70px]" />
                                    </div>
                                  )}
                               </div>
                               {s.isCustomTime && (
                                  <div className="flex items-center gap-1 text-[10px] sm:text-xs">
                                    <span className="text-gray-500">人数換算:</span>
                                    <select
                                      value={Number(s.countWeight) === 1 ? '1' : '0.5'}
                                      onChange={e => handleUpdateStaff(s.id, 'countWeight', Number(e.target.value))}
                                      className="border rounded px-1 py-0.5 text-center"
                                      title="必要人数を数えるときに何人分として扱うか。0.5＝半人前、1＝常勤と同じ1人前"
                                    >
                                      <option value="0.5">0.5人</option>
                                      <option value="1">1人</option>
                                    </select>
                                  </div>
                               )}
                               {s.isCustomTime && (
                                  <div className="flex items-center gap-1 text-[10px] sm:text-xs">
                                    <span className="text-gray-500">公休数:</span>
                                    <input
                                      type="number"
                                      value={s.customOffDays !== undefined ? s.customOffDays : ''}
                                      onChange={e => handleUpdateStaff(s.id, 'customOffDays', e.target.value)}
                                      className="border rounded px-1 py-0.5 w-12 text-center"
                                      placeholder="全体"
                                    />
                                    <span className="text-gray-500">日</span>
                                  </div>
                               )}
                               {s.isCustomTime && (() => {
                                  const m = parseInt(s.maxConsecutive, 10);
                                  const hasLimit = m >= 1 && m <= 4;
                                  const needOff = hasLimit ? minOffDaysForRun(m, daysInMonth) : 0;
                                  const targetOff = (s.customOffDays !== '' && s.customOffDays !== undefined)
                                      ? Number(s.customOffDays) : requiredOffDays;
                                  const tight = hasLimit && needOff > targetOff;
                                  return (
                                    <div className="flex flex-col items-center gap-0.5">
                                      <div className="flex items-center gap-1 text-[10px] sm:text-xs">
                                        <span className="text-gray-500">連勤上限:</span>
                                        <select
                                          value={s.maxConsecutive !== undefined ? s.maxConsecutive : ''}
                                          onChange={e => handleUpdateStaff(s.id, 'maxConsecutive', e.target.value)}
                                          className="border rounded px-1 py-0.5 text-center"
                                        >
                                          <option value="">指定なし</option>
                                          <option value="1">1（連勤不可）</option>
                                          <option value="2">2</option>
                                          <option value="3">3</option>
                                          <option value="4">4</option>
                                        </select>
                                      </div>
                                      {tight && (
                                        <div className="text-[9px] sm:text-[10px] text-orange-700 bg-orange-50 border border-orange-200 rounded px-1 py-0.5 leading-tight max-w-[190px] text-center">
                                          ⚠ この設定だと休みが最低{needOff}日必要です（設定の公休{targetOff}日を超過）。
                                          超過分は自動で公休(×)になります。
                                        </div>
                                      )}
                                    </div>
                                  );
                               })()}

                               {/* 曜日固定（出勤/休みを曜日で固定する）。ONのときだけ設定でき、有効になる */}
                               {s.isCustomTime && (() => {
                                  const pat = Array.isArray(s.weekdayPattern) && s.weekdayPattern.length === 7
                                    ? s.weekdayPattern : ['', '', '', '', '', '', ''];
                                  const on = !!s.useWeekdayPattern;
                                  // 当月で何日が固定されるかを数える
                                  let fixWork = 0, fixOff = 0;
                                  calendar.forEach(c => {
                                    if (pat[c.day] === 'work') fixWork++;
                                    else if (pat[c.day] === 'off') fixOff++;
                                  });
                                  // 固定出勤だけで生じる最長連勤（連勤上限との矛盾チェック用）
                                  let runNow = 0, runMax = 0;
                                  calendar.forEach(c => {
                                    if (pat[c.day] === 'work') { runNow++; if (runNow > runMax) runMax = runNow; }
                                    else if (pat[c.day] === 'off') runNow = 0;
                                    else runNow = 0;
                                  });
                                  const mLimit = parseInt(s.maxConsecutive, 10);
                                  const runConflict = on && mLimit >= 1 && mLimit <= 4 && runMax > mLimit;
                                  const targetOff2 = (s.customOffDays !== '' && s.customOffDays !== undefined)
                                    ? Number(s.customOffDays) : requiredOffDays;
                                  const offConflict = on && fixOff > targetOff2;
                                  const cycle = (i) => {
                                    const order = ['', 'work', 'off'];
                                    const next = [...pat];
                                    next[i] = order[(order.indexOf(pat[i] || '') + 1) % 3];
                                    handleUpdateStaff(s.id, 'weekdayPattern', next);
                                  };
                                  return (
                                    <div className="flex flex-col items-center gap-0.5 mt-0.5">
                                      <label className="flex items-center gap-1 text-[10px] sm:text-xs font-medium cursor-pointer">
                                        <input
                                          type="checkbox"
                                          className="w-3 h-3 accent-emerald-600 cursor-pointer"
                                          checked={on}
                                          onChange={(e) => handleUpdateStaff(s.id, 'useWeekdayPattern', e.target.checked)}
                                        />
                                        <span className={on ? 'text-emerald-700' : 'text-gray-500'}>曜日固定</span>
                                      </label>
                                      {on && (
                                        <>
                                          <div className="flex gap-0.5">
                                            {WEEKDAYS.map((w, i) => {
                                              const v = pat[i] || '';
                                              const cls = v === 'work'
                                                ? 'bg-cyan-500 text-white border-cyan-600'
                                                : v === 'off'
                                                  ? 'bg-red-500 text-white border-red-600'
                                                  : 'bg-gray-100 text-gray-500 border-gray-300';
                                              return (
                                                <button
                                                  key={i}
                                                  type="button"
                                                  onClick={() => cycle(i)}
                                                  className={`w-6 h-7 rounded border text-[10px] font-bold leading-none flex flex-col items-center justify-center ${cls}`}
                                                  title={`${w}曜: ${v === 'work' ? '出勤' : v === 'off' ? '休み' : '指定なし'}（クリックで切替）`}
                                                >
                                                  <span>{w}</span>
                                                  <span className="text-[8px]">{v === 'work' ? '出' : v === 'off' ? '休' : '−'}</span>
                                                </button>
                                              );
                                            })}
                                          </div>
                                          <div className="text-[9px] text-gray-500 leading-tight">
                                            クリックで 指定なし→<span className="text-cyan-700 font-bold">出勤</span>→<span className="text-red-700 font-bold">休み</span>
                                            ／当月: 出勤{fixWork}日・休み{fixOff}日
                                          </div>
                                          {runConflict && (
                                            <div className="text-[9px] sm:text-[10px] text-orange-700 bg-orange-50 border border-orange-200 rounded px-1 py-0.5 leading-tight max-w-[190px] text-center">
                                              ⚠ 固定出勤が最長{runMax}連勤になり、連勤上限{mLimit}と矛盾します。曜日固定が優先されます。
                                            </div>
                                          )}
                                          {offConflict && (
                                            <div className="text-[9px] sm:text-[10px] text-orange-700 bg-orange-50 border border-orange-200 rounded px-1 py-0.5 leading-tight max-w-[190px] text-center">
                                              ⚠ 固定の休みが{fixOff}日あり、公休{targetOff2}日を超えます。曜日固定が優先されます。
                                            </div>
                                          )}
                                        </>
                                      )}
                                    </div>
                                  );
                               })()}
                             </div>
                          </td>
                          <td className="p-2 text-center">
                            <button onClick={() => handleRemoveStaff(s.id)} className="text-red-500 hover:text-red-700 font-bold text-lg leading-none">×</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="flex justify-between items-center">
                  <button onClick={handleAddStaff} className="bg-green-600 text-white px-3 py-2 rounded text-sm font-bold hover:bg-green-700">+ 新規追加</button>
                  <button onClick={() => setIsStaffModalOpen(false)} className="bg-slate-600 text-white px-4 py-2 rounded font-bold text-sm">閉じる</button>
                </div>
              </div>
            </div>
          )}

          {/* ペア禁止設定モーダル */}
          {settingForbiddenPairsFor && (() => {
            const staff = staffData.find(s => s.id === settingForbiddenPairsFor);
            if (!staff) return null;
            const nightStaffs = staffData.filter(s => ['A', 'D'].includes(s.group) && s.id !== staff.id);

            return (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[60]" onClick={() => setSettingForbiddenPairsFor(null)}>
                <div className="bg-white rounded-lg p-4 w-11/12 max-w-sm shadow-xl max-h-[80dvh] flex flex-col" onClick={e => e.stopPropagation()}>
                  <h3 className="font-bold text-lg mb-2">🚫 {staff.name} のペア禁止設定</h3>
                  <p className="text-xs text-gray-500 mb-4">夜勤で一緒に配置しない職員にチェックを入れてください。</p>
                  
                  <div className="flex-1 overflow-y-auto border rounded p-2 mb-4 grid grid-cols-2 gap-2">
                    {nightStaffs.length > 0 ? nightStaffs.map(ns => {
                      const isForbidden = staff.forbiddenPairs?.includes(ns.id);
                      return (
                        <label key={ns.id} className="flex items-center gap-2 p-2 hover:bg-gray-50 cursor-pointer rounded border border-transparent hover:border-gray-200">
                          <input 
                            type="checkbox" 
                            className="w-4 h-4 accent-red-500"
                            checked={isForbidden || false}
                            onChange={() => handleToggleForbiddenPair(staff.id, ns.id)}
                          />
                          <span className="text-sm font-medium">{ns.name}</span>
                        </label>
                      );
                    }) : <p className="text-sm text-gray-500 col-span-2 text-center py-4">他の夜勤職員がいません</p>}
                  </div>

                  <div className="flex justify-end shrink-0">
                    <button onClick={() => setSettingForbiddenPairsFor(null)} className="bg-slate-600 text-white px-4 py-2 rounded font-bold text-sm">完了</button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* Modal (Prev Night) */}
          {isPrevNightModalOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onClick={() => setIsPrevNightModalOpen(false)}>
              <div className="bg-white rounded-lg p-4 w-11/12 max-w-sm shadow-xl" onClick={e => e.stopPropagation()}>
                <h3 className="font-bold text-lg mb-2">🌙 前月夜勤者設定</h3>
                <p className="text-xs text-gray-500 mb-4">選択した職員は1日が「明」、2日が「公休」になります。</p>
                <div className="max-h-[50dvh] overflow-y-auto mb-4 border rounded p-2 grid grid-cols-2 gap-2">
                  {staffData.filter(s => ['A', 'D'].includes(s.group)).map(s => (
                    <label key={s.id} className="flex items-center gap-2 p-2 hover:bg-gray-50 cursor-pointer rounded border border-transparent hover:border-gray-200">
                      <input 
                        type="checkbox" 
                        className="w-4 h-4 accent-indigo-600"
                        checked={prevMonthNightStaff.includes(s.id)}
                        onChange={() => togglePrevNightStaff(s.id)}
                      />
                      <span className="text-sm font-medium">{s.name}</span>
                    </label>
                  ))}
                </div>
                <div className="flex justify-end">
                  <button onClick={() => setIsPrevNightModalOpen(false)} className="bg-slate-600 text-white px-4 py-2 rounded font-bold text-sm">閉じる</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
