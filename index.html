            const canExtend = (sid, from) => {
              const st = staffData.find(x => x.id === sid);
              if (!st || st.group === 'C') return false;
              if (newSchedule[sid][d] !== from) return false;
              if (isCellLocked(sid, d, newSchedule)) return false;
              if (isNg(sid, d, SHIFT_TYPES.DAY_LATE)) return false;
              const pv = (d === 1) ? SHIFT_TYPES.OFF : newSchedule[sid][d - 1];
              const nx = (d === daysInMonth) ? SHIFT_TYPES.OFF : newSchedule[sid][d + 1];
              return restOk(pv, SHIFT_TYPES.DAY_LATE) && restOk(SHIFT_TYPES.DAY_LATE, nx);
            };

            // (1) 日勤 → 日遅（朝の在籍は変わらないので最優先）
            let done = false;
            for (const st of staffData) {
              if (!canExtend(st.id, SHIFT_TYPES.DAY)) continue;
              newSchedule[st.id][d] = SHIFT_TYPES.DAY_LATE;
              done = true; break;
            }
            if (done) continue;

            // (2) 早番 → 日遅（その日に早番が2人以上いるときだけ。早番ゼロにはしない）
            if (earlyCountOf(d) >= 2) {
              for (const st of staffData) {
                if (!canExtend(st.id, SHIFT_TYPES.EARLY)) continue;
                newSchedule[st.id][d] = SHIFT_TYPES.DAY_LATE;
                done = true; break;
              }
            }
            if (done) continue;

            // (3) 早番の担当を入れ替えて日遅を作る
            // 夕方に出せるのが「その日の早番1名」だけ、という日がある。そのまま日遅にすると
            // 早番がゼロになるので、同じ日の別の日勤者に早番を代わってもらう。
            // 朝の在籍数（早番も日遅も朝に数える）と早番の人数はどちらも変わらない。
            for (const e of staffData) {
              if (!canExtend(e.id, SHIFT_TYPES.EARLY)) continue;
              let rep = null;
              for (const r of staffData) {
                if (r.id === e.id || r.group === 'C') continue;
                if (newSchedule[r.id][d] !== SHIFT_TYPES.DAY) continue;
                if (isCellLocked(r.id, d, newSchedule)) continue;
                if (isNg(r.id, d, SHIFT_TYPES.EARLY)) continue;
                const pv = (d === 1) ? SHIFT_TYPES.OFF : newSchedule[r.id][d - 1];
                const nx = (d === daysInMonth) ? SHIFT_TYPES.OFF : newSchedule[r.id][d + 1];
                if (!restOk(pv, SHIFT_TYPES.EARLY) || !restOk(SHIFT_TYPES.EARLY, nx)) continue;
                rep = r; break;
              }
              if (!rep) continue;
              newSchedule[e.id][d] = SHIFT_TYPES.DAY_LATE;
              newSchedule[rep.id][d] = SHIFT_TYPES.EARLY;
              done = true; break;
            }
            if (done) continue;

            // (4) 遅番の連鎖（当日と翌日を遅番に）。朝ピークの下限は両日とも厳守する。
            // 翌日がすでに日遅の人も対象にする（日遅→遅番に変えれば 19:00→10:30 で間隔を満たし、
            // 翌日の夕方在籍も保てる）。翌日の朝在籍は1人分減るので下限は厳守する。
            if (d < daysInMonth) {
              for (const st of staffData) {
                if (st.group === 'C') continue;
                if (newSchedule[st.id][d] !== SHIFT_TYPES.DAY) continue;
                const nextCur = newSchedule[st.id][d + 1];
                if (nextCur !== SHIFT_TYPES.DAY && nextCur !== SHIFT_TYPES.DAY_LATE) continue;
                if (isCellLocked(st.id, d, newSchedule) || isCellLocked(st.id, d + 1, newSchedule)) continue;
                if (isNg(st.id, d, SHIFT_TYPES.LATE) || isNg(st.id, d + 1, SHIFT_TYPES.LATE)) continue;
                const pv = (d === 1) ? SHIFT_TYPES.OFF : newSchedule[st.id][d - 1];
                const nn = (d + 2 > daysInMonth) ? SHIFT_TYPES.OFF : newSchedule[st.id][d + 2];
                if (!restOk(pv, SHIFT_TYPES.LATE) || !restOk(SHIFT_TYPES.LATE, nn)) continue;
                const w = headWeight(st);
                const req1 = getMorningTargetForDay(d, calendar[d - 1].day);
                const req2 = getMorningTargetForDay(d + 1, calendar[d].day);
                if (morningSupplyOf(d) - w < req1 - 1) continue;
                if (morningSupplyOf(d + 1) - w < req2 - 1) continue;
                newSchedule[st.id][d] = SHIFT_TYPES.LATE;
                newSchedule[st.id][d + 1] = SHIFT_TYPES.LATE;
                done = true;
                break;
              }
            }
            if (done) continue;

            // (5) 最終手段: その日の唯一の早番を日遅に回す。
            // 早番がゼロになるため、eveningPriority（夕方優先）が ON のときだけ実行する。
            if (eveningOverEarly) {
              for (const st of staffData) {
                if (!canExtend(st.id, SHIFT_TYPES.EARLY)) continue;
                newSchedule[st.id][d] = SHIFT_TYPES.DAY_LATE;
                break;
              }
            }
          }
        }

        setSchedule(newSchedule);
        setScheduleStep(step);
        if (isRetry) {
            setMessage({ text: 'Step 4: 早番・遅番を再配置しました (複数回押すことで別パターンを生成できます)。', type: 'success' });
        } else {
            setMessage({ text: 'Step 4: 早番・遅番を振り分けました。次は「早遅均」で別パターンを生成できます。', type: 'success' });
        }
      };

      const downloadCSV = () => {
        let csvContent = "\uFEFF";
        csvContent += "氏名,グループ," + calendar.map(c => `${c.date}(${WEEKDAYS[c.day]})`).join(",") + "\n";
        staffData.forEach(staff => {
          const row = [staff.name, staff.group];
          calendar.forEach(c => row.push(schedule[staff.id][c.date] || ''));
          csvContent += row.join(",") + "\n";
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.setAttribute("download", `シフト表_${year}年${month}月.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const getConsecutiveAlert = (staffId, day) => {
        if (!schedule || !schedule[staffId]) return false;
        
        const current = schedule[staffId][day];
        if (!isWorkDay(current) || current === SHIFT_TYPES.NONE) return false;

        let count = 1;
        let isConsecutive = true;
        for (let d = day - 1; d >= 1; d--) {
          const s = schedule[staffId][d];
          if (isWorkDay(s) && s !== SHIFT_TYPES.NONE) count++; else { isConsecutive = false; break; }
        }
        if (isConsecutive && prevMonthSchedule[staffId]) {
            const prevDays = Object.keys(prevMonthSchedule[staffId]).length;
            for (let d = prevDays; d >= 1; d--) {
                const s = prevMonthSchedule[staffId][d];
                if (isWorkDay(s) && s !== SHIFT_TYPES.NONE) count++; else break;
            }
        }

        for (let d = day + 1; d <= daysInMonth; d++) {
          const s = schedule[staffId][d];
          if (isWorkDay(s) && s !== SHIFT_TYPES.NONE) count++; else break;
        }
        // 連勤上限を超えたら警告（非常勤で1〜4を指定していればその値、未指定は4連勤まで）
        return count > getMaxRunById(staffId);
      };

      const getNightDenseAlert = (staffId, day) => {
        if (!schedule || !schedule[staffId]) return false;
        const current = schedule[staffId][day];
        if (current !== SHIFT_TYPES.NIGHT) return false;

        for (let start = day - 4; start <= day; start++) {
          let nightCount = 0;
          for (let i = 0; i < 5; i++) {
            const d = start + i;
            if (d >= 1 && d <= daysInMonth) {
               const s = schedule[staffId][d];
               if (s === SHIFT_TYPES.NIGHT) nightCount++;
            } else if (d <= 0) {
               if (prevMonthSchedule[staffId]) {
                   const prevDays = Object.keys(prevMonthSchedule[staffId]).length;
                   const targetDay = prevDays + d;
                   if (targetDay >= 1 && prevMonthSchedule[staffId][targetDay] === SHIFT_TYPES.NIGHT) {
                       nightCount++;
                   }
               } else if (d === 0 && prevMonthNightStaff.includes(staffId)) {
                   nightCount++;
               }
            }
          }
          if (nightCount >= 3) return true;
        }
        return false;
      };

      const getNightEndDayAlert = (staffId, day) => {
        if (!schedule || !schedule[staffId]) return false;
        const current = schedule[staffId][day];
        const staff = staffData.find(s => s.id === staffId);
        
        const isTargetWork = [SHIFT_TYPES.DAY, SHIFT_TYPES.EARLY, SHIFT_TYPES.LATE, SHIFT_TYPES.TRAINING].includes(current);
        const isNight = current === SHIFT_TYPES.NIGHT;
        
        if (!isTargetWork && !(staff?.group === 'D' && isNight)) return false;

        const prev1Shift = getShiftSafe(staffId, day - 1, schedule);
        const prev2Shift = getShiftSafe(staffId, day - 2, schedule);
        
        if (prev1Shift === SHIFT_TYPES.NIGHT_END && prev2Shift === SHIFT_TYPES.NIGHT) {
            return true;
        }
        return false;
      };

      const calculateCounts = (staffId) => {
        let counts = { night: 0, off: 0, early: 0, day: 0, late: 0 };
        if (!schedule || !schedule[staffId]) return counts;
        for (let d = 1; d <= daysInMonth; d++) {
          const s = schedule[staffId]?.[d];
          if (s === SHIFT_TYPES.NIGHT) counts.night++;
          if (s === SHIFT_TYPES.OFF) counts.off++;
          if (s === SHIFT_TYPES.EARLY) counts.early++;
          if (s === SHIFT_TYPES.DAY) counts.day++;
          if (s === SHIFT_TYPES.LATE) counts.late++;
        }
        return counts;
      };

      const getCellColor = (type, dayInfo) => {
        switch (type) {
          case SHIFT_TYPES.NIGHT: return 'bg-indigo-600 text-white font-bold border-indigo-700';
          case SHIFT_TYPES.NIGHT_END: return 'bg-orange-200 text-orange-900 border-orange-300';
          case SHIFT_TYPES.OFF: return 'bg-red-100 text-red-700 border-red-200';
          case SHIFT_TYPES.PAID: return 'bg-pink-100 text-pink-700 font-bold border-pink-200';
          case SHIFT_TYPES.REFRESH: return 'bg-green-100 text-green-700 font-bold border-green-200';
          case SHIFT_TYPES.TRAINING: return 'bg-lime-100 text-lime-800 font-bold border-lime-200'; 
          case SHIFT_TYPES.DAY: return 'bg-cyan-100 text-cyan-800 border-cyan-200 font-medium';
          case SHIFT_TYPES.EARLY: return 'bg-yellow-100 text-yellow-800 border-yellow-200 font-medium';
          case SHIFT_TYPES.EARLY_DAY: return 'bg-amber-200 text-amber-900 border-amber-300 font-bold';
          case SHIFT_TYPES.LATE: return 'bg-purple-100 text-purple-800 border-purple-200 font-medium';
          case SHIFT_TYPES.DAY_LATE: return 'bg-fuchsia-200 text-fuchsia-900 border-fuchsia-300 font-bold';
          default:
            if (dayInfo.day === 0) return 'bg-red-50 border-red-100';
            if (dayInfo.day === 6) return 'bg-blue-50 border-blue-100';
            return 'bg-gray-50 border-gray-200';
        }
      };

      const totalTargets = staffData.filter(s => ['A', 'D'].includes(s.group)).reduce((acc, s) => acc + (nightTargets[s.id] || 0), 0);

      const timelineData = useMemo(() => {
        if (selectedTimelineDay === null) return null;
        const d = selectedTimelineDay;
        const rows = staffData.map(staff => {
          const bars = [];
          const prevShift = getShiftSafe(staff.id, d - 1, schedule);
          
          if (prevShift === SHIFT_TYPES.NIGHT) {
            bars.push({ start: 0, end: timeToDecimal(shiftTimes.NIGHT.end), label: '明', color: 'bg-indigo-300' });
          }

          const currentShift = schedule[staff.id]?.[d] || SHIFT_TYPES.NONE;
          const isTargetWork = [SHIFT_TYPES.DAY, SHIFT_TYPES.EARLY, SHIFT_TYPES.EARLY_DAY, SHIFT_TYPES.LATE, SHIFT_TYPES.DAY_LATE, SHIFT_TYPES.NIGHT].includes(currentShift);

          if (isTargetWork) {
            if (staff.isCustomTime && currentShift !== SHIFT_TYPES.NIGHT) {
               bars.push({ start: timeToDecimal(staff.customStart), end: timeToDecimal(staff.customEnd), label: '個別', color: 'bg-emerald-500' });
            } else {
              if (currentShift === SHIFT_TYPES.EARLY) {
                bars.push({ start: timeToDecimal(shiftTimes.EARLY.start), end: timeToDecimal(shiftTimes.EARLY.end), label: '早番', color: 'bg-yellow-400' });
              } else if (currentShift === SHIFT_TYPES.EARLY_DAY) {
                bars.push({ start: timeToDecimal(shiftTimes.EARLY.start), end: timeToDecimal(shiftTimes.DAY.end), label: '早日', color: 'bg-amber-500' });
              } else if (currentShift === SHIFT_TYPES.DAY) {
                bars.push({ start: timeToDecimal(shiftTimes.DAY.start), end: timeToDecimal(shiftTimes.DAY.end), label: '日勤', color: 'bg-blue-400' });
              } else if (currentShift === SHIFT_TYPES.LATE) {
                bars.push({ start: timeToDecimal(shiftTimes.LATE.start), end: timeToDecimal(shiftTimes.LATE.end), label: '遅番', color: 'bg-purple-400' });
              } else if (currentShift === SHIFT_TYPES.DAY_LATE) {
                bars.push({ start: timeToDecimal(shiftTimes.DAY.start), end: timeToDecimal(shiftTimes.LATE.end), label: '日遅', color: 'bg-fuchsia-500' });
              } else if (currentShift === SHIFT_TYPES.NIGHT) {
                bars.push({ start: timeToDecimal(shiftTimes.NIGHT.start), end: 24, label: '当', color: 'bg-indigo-600' });
              }
            }
          }
          return { staff, bars };
        });

        const hourCounts = new Array(24).fill(0);
        for(let h=0; h<24; h++) {
           let count = 0;
           rows.forEach(row => {
              let isWorking = false;
              row.bars.forEach(bar => {
                 if (Math.max(h, bar.start) < Math.min(h + 1, bar.end)) {
                     isWorking = true;
                 }
              });
              if(isWorking) count++;
           });
           hourCounts[h] = count;
        }

        return { rows, hourCounts };
      }, [selectedTimelineDay, schedule, staffData, shiftTimes, prevMonthSchedule, prevMonthNightStaff]);


      return (
        <div className="flex flex-col h-[100dvh]">
          {/* Header */}
          <header className="bg-slate-800 text-white p-2 sm:p-3 shadow-md z-30 flex justify-between items-center shrink-0">
            <div className="flex items-center gap-1 sm:gap-2">
              <span className="text-lg sm:text-xl">📅</span>
              <h1 className="font-bold text-sm sm:text-lg hidden sm:block">シフト作成アプリ</h1>
              <h1 className="font-bold text-xs sm:hidden">シフト作成</h1>
              <a href="manual.html" target="_blank" rel="noopener" title="取扱説明書を別のタブで開く" className="ml-1 sm:ml-2 text-[10px] sm:text-sm bg-amber-400 text-slate-900 font-bold px-1.5 sm:px-2.5 py-0.5 sm:py-1 rounded hover:bg-amber-300 whitespace-nowrap">📖 使い方</a>
            </div>
            <div className="flex items-center gap-1 sm:gap-2 bg-slate-700 rounded-lg px-1 sm:px-2 py-1">
              <button onClick={() => setMonth(m => m - 1)} className="p-1 hover:bg-slate-600 rounded text-slate-300 leading-none">◀</button>
              <span className="font-mono text-sm sm:text-lg font-bold w-12 sm:w-16 text-center">{year}.{month}</span>
              <button onClick={() => setMonth(m => m + 1)} className="p-1 hover:bg-slate-600 rounded text-slate-300 leading-none">▶</button>
            </div>
            <div className="flex items-center gap-1 bg-slate-700 rounded-lg px-1 sm:px-2 py-1 ml-1 sm:ml-2 text-xs sm:text-sm">
              <span className="hidden sm:inline">公休:</span>
              <span className="sm:hidden">休:</span>
              <input 
                type="number" 
                className="w-8 sm:w-10 text-center text-black rounded" 
                value={requiredOffDays} 
                onChange={(e) => setRequiredOffDays(Number(e.target.value))} 
              />
              <span>日</span>
            </div>
            <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="sm:hidden p-1 text-xl font-bold ml-auto leading-none">
              {isMenuOpen ? '✕' : '≡'}
            </button>
          </header>

          {/* Control Panel */}
          <div className={`bg-white border-b shadow-sm transition-all duration-300 overflow-hidden ${isMenuOpen ? 'max-h-96' : 'max-h-[88px] sm:max-h-none'} shrink-0 z-20`}>
            <div className="p-2 sm:p-3 flex flex-col gap-2 sm:gap-3">
              <div className={`w-full px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg flex items-center gap-1 sm:gap-2 text-[10px] sm:text-sm font-medium ${
                message.type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 
                message.type === 'success' ? 'bg-green-50 text-green-700 border border-green-200' : 
                'bg-blue-50 text-blue-700 border border-blue-200'
              }`}>
                <span className="text-sm sm:text-lg shrink-0">ℹ️</span>
                <span className="truncate">{message.text}</span>
              </div>

              {nightViolations && nightViolations.hardFail && (
                <div className="w-full px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg bg-red-50 border border-red-400 text-red-800 text-[10px] sm:text-sm">
                  <div className="flex items-center justify-between mb-1">
                    <span className="font-bold">⛔ 夜勤人数を充足できません（自動配置は適用されていません）</span>
                    <button onClick={() => setNightViolations(null)} className="text-red-600 hover:text-red-900 font-bold px-1">✕</button>
                  </div>
                  <div className="mb-1">不足合計：<span className="font-bold">{nightViolations.unfilled}</span> 枠</div>
                  <div className="mb-0.5 font-semibold">不足している日：</div>
                  <div className="flex flex-wrap gap-1">
                    {nightViolations.shortageByDay && nightViolations.shortageByDay.map((x, i) => (
                      <span key={i} className="inline-block px-1.5 py-0.5 rounded bg-red-100 border border-red-300">
                        {x.day}日（不足{x.short}名）
                      </span>
                    ))}
                  </div>
                  <div className="mt-1.5 text-red-700">※ 夜勤可能な職員数・前月夜勤・ロック枠・公休/NG等の制約を見直してください。</div>
                </div>
              )}

              {nightViolations && !nightViolations.hardFail && nightViolations.targetMismatches && nightViolations.targetMismatches.length > 0 && (
                <div className="w-full px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg bg-orange-50 border border-orange-300 text-orange-800 text-[10px] sm:text-sm">
                  <div className="flex items-center justify-between mb-1">
                    <span className="font-bold">⚠️ 夜勤回数の目標未達（人数・ロックは厳守済）</span>
                    <button onClick={() => setNightViolations(null)} className="text-orange-600 hover:text-orange-900 font-bold px-1">✕</button>
                  </div>
                  <div className="flex flex-wrap gap-1">
                    {nightViolations.targetMismatches.map((m, i) => (
                      <span key={i} className="inline-block px-1.5 py-0.5 rounded bg-orange-100 border border-orange-300">
                        {m.name}（目標{m.target}→実績{m.actual}）
                      </span>
                    ))}
                  </div>
                </div>
              )}

              {nightViolations && !nightViolations.hardFail && nightViolations.items && nightViolations.items.length > 0 && (
                <div className="w-full px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg bg-amber-50 border border-amber-300 text-amber-800 text-[10px] sm:text-sm">
                  <div className="flex items-center justify-between mb-1">
                    <span className="font-bold">⚠️ 夜勤生成：soft条件の違反内訳（夜勤人数・ロックは厳守済）</span>
                    <button onClick={() => setNightViolations(null)} className="text-amber-600 hover:text-amber-900 font-bold px-1">✕</button>
                  </div>
                  <ul className="space-y-0.5">
                    {nightViolations.items.map((it, i) => (
                      <li key={i} className="flex justify-between">
                        <span>・{it.label}</span>
                        <span>{it.count} 件</span>
                      </li>
                    ))}
                  </ul>
                </div>
              )}

              {requestReport && (
                <div className="w-full px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg bg-rose-50 border border-rose-300 text-rose-900 text-[10px] sm:text-sm">
                  <div className="flex items-center justify-between mb-1">
                    <span className="font-bold">🙋 希望休の取り込み結果{requestReport.ym ? `（${requestReport.ym}分）` : ''}：{requestReport.staffCount}名 / {requestReport.applied}件を反映</span>
                    <button onClick={() => setRequestReport(null)} className="text-rose-600 hover:text-rose-900 font-bold px-1">✕</button>
                  </div>
                  <ul className="space-y-0.5">
                    {requestReport.unknown.length > 0 && (
                      <li>❌ <span className="font-bold">職員登録がない氏名（未反映）</span>：{requestReport.unknown.join('、')}</li>
                    )}
                    {requestReport.missing.length > 0 && (
                      <li>📭 <span className="font-bold">未提出</span>：{requestReport.missing.join('、')}</li>
                    )}
                    {requestReport.conflicts.length > 0 && (
                      <li>⚠️ <span className="font-bold">既存のシフトを上書き</span>：{requestReport.conflicts.join('、')}</li>
                    )}
                    {requestReport.outOfRange.length > 0 && (
                      <li>⚠️ <span className="font-bold">当月の範囲外（無視）</span>：{requestReport.outOfRange.join('、')}</li>
                    )}
                    {requestReport.warnings.map((w, i) => (
                      <li key={i}>🔎 {w}</li>
                    ))}
                    {requestReport.unknown.length === 0 && requestReport.missing.length === 0 && requestReport.conflicts.length === 0 && requestReport.outOfRange.length === 0 && requestReport.warnings.length === 0 && (
                      <li>✅ 全職員から回答があり、問題は見つかりませんでした。</li>
                    )}
                  </ul>
                </div>
              )}

              <div className="flex w-full justify-between gap-2 overflow-x-auto sm:overflow-visible hide-scrollbar sm:flex-wrap">
                {/* PC幅ではボタンを折り返して収める（狭いPCで右端が切れないようにする）。
                    スマホ幅では従来どおり1行＋横スクロール。 */}
                <div className="flex gap-1.5 sm:gap-2 items-center flex-nowrap shrink-0 sm:flex-wrap sm:shrink sm:min-w-0">
                  {step === 0 && (
                    <>
                      <button onClick={() => prevMonthFileInputRef.current.click()} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-purple-50 border border-purple-200 text-purple-700 rounded hover:bg-purple-100 whitespace-nowrap text-xs sm:text-sm font-bold">
                        📁 <span className="hidden sm:inline">先月読込</span><span className="sm:hidden">先月</span>
                      </button>
                      <input type="file" accept=".csv" ref={prevMonthFileInputRef} onChange={handleImportPrevMonthCSV} style={{ display: 'none' }} />
                      <button onClick={() => fileInputRef.current.click()} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-green-50 border border-green-200 text-green-700 rounded hover:bg-green-100 whitespace-nowrap text-xs sm:text-sm font-bold">
                        📁 <span className="hidden sm:inline">当月読込</span><span className="sm:hidden">当月</span>
                      </button>
                      <input type="file" accept=".csv" ref={fileInputRef} onChange={handleImportCSV} style={{ display: 'none' }} />
                      <button onClick={() => setIsStaffModalOpen(true)} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-gray-100 border border-gray-300 text-gray-700 rounded hover:bg-gray-200 whitespace-nowrap text-xs sm:text-sm font-bold">
                        👥 <span className="hidden sm:inline">職員設定</span><span className="sm:hidden">職員</span>
                      </button>
                      <button onClick={() => setIsDayTargetModalOpen(true)} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-blue-50 border border-blue-200 text-blue-700 rounded hover:bg-blue-100 whitespace-nowrap text-xs sm:text-sm font-bold">
                        📊 <span className="hidden sm:inline">人数設定</span><span className="sm:hidden">人数</span>
                      </button>
                      <button onClick={() => setIsShiftTimeModalOpen(true)} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-yellow-50 border border-yellow-200 text-yellow-700 rounded hover:bg-yellow-100 whitespace-nowrap text-xs sm:text-sm font-bold">
                        ⏰ <span className="hidden sm:inline">時間設定</span><span className="sm:hidden">時間</span>
                      </button>
                      <button onClick={() => setIsPrevNightModalOpen(true)} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-slate-100 border border-slate-300 text-slate-700 rounded hover:bg-slate-200 whitespace-nowrap text-xs sm:text-sm font-bold">
                        🌙 <span className="hidden sm:inline">前月夜勤</span><span className="sm:hidden">前月夜</span>
                      </button>
                      <button onClick={handleExportSettings} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-indigo-50 border border-indigo-200 text-indigo-700 rounded hover:bg-indigo-100 whitespace-nowrap text-xs sm:text-sm font-bold" title="職員・人数・時間の設定をファイルに保存">
                        ⚙️💾 <span className="hidden sm:inline">設定保存</span>
                      </button>
                      <button onClick={() => settingsFileInputRef.current.click()} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-indigo-50 border border-indigo-200 text-indigo-700 rounded hover:bg-indigo-100 whitespace-nowrap text-xs sm:text-sm font-bold" title="保存した設定ファイルを読み込む">
                        ⚙️📂 <span className="hidden sm:inline">設定読込</span>
                      </button>
                      <input type="file" accept=".json,application/json" ref={settingsFileInputRef} onChange={handleImportSettings} style={{ display: 'none' }} />
                      <button onClick={() => requestsFileInputRef.current.click()} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-rose-50 border border-rose-200 text-rose-700 rounded hover:bg-rose-100 whitespace-nowrap text-xs sm:text-sm font-bold" title="Googleフォームで集めた希望休を一括取り込み">
                        🙋📂 <span className="hidden sm:inline">希望休読込</span><span className="sm:hidden">希望休</span>
                      </button>
                      <input type="file" accept=".json,application/json" ref={requestsFileInputRef} onChange={handleImportRequests} style={{ display: 'none' }} />
                      <button onClick={handleExportStaffNames} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-rose-50 border border-rose-200 text-rose-700 rounded hover:bg-rose-100 whitespace-nowrap text-xs sm:text-sm font-bold" title="職員名簿CSVを書き出す（フォームの氏名プルダウン用）">
                        🙋💾 <span className="hidden sm:inline">名簿書出</span>
                      </button>
                      <button onClick={() => { setStep(1); setMessage({text:'Step1: 不足日を判定し、日勤を事前確保します。', type:'info'}); }} className="flex items-center gap-1 px-3 py-1.5 sm:px-4 sm:py-2 bg-blue-600 text-white rounded hover:bg-blue-700 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm">次へ ▶</button>
                    </>
                  )}

                  {step === 1 && (
                    <>
                      <button onClick={() => preFillDayShiftsForCriticalDays(false)} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm">
                        🛡️ <span className="hidden sm:inline">不足日ブロック</span><span className="sm:hidden">ブロック</span>
                      </button>
                      <button onClick={() => preFillDayShiftsForCriticalDays(true)} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-yellow-600 text-white rounded hover:bg-yellow-700 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm">
                        🔀 <span className="hidden sm:inline">再配置</span>
                      </button>
                      <button onClick={() => { setStep(2); setMessage({text:'Step2: 夜勤を配置します。', type:'info'}); }} className="flex items-center gap-1 px-3 py-1.5 sm:px-4 sm:py-2 bg-blue-600 text-white rounded hover:bg-blue-700 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm">次へ ▶</button>
                    </>
                  )}

                  {step === 2 && (
                    <>
                      <button onClick={() => generateNightShifts(true)} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-yellow-600 text-white rounded hover:bg-yellow-700 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm">
                        🔀 <span className="hidden sm:inline">再配置</span>
                      </button>
                      <button onClick={() => generateNightShifts(false)} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm">
                        🔄 <span className="hidden sm:inline">自動</span>
                      </button>
                      <button onClick={() => { setStep(3); setMessage({text:'Step3: 日勤を一括配置します。', type:'info'}); }} className="flex items-center gap-1 px-3 py-1.5 sm:px-4 sm:py-2 bg-blue-600 text-white rounded hover:bg-blue-700 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm">次へ ▶</button>
                    </>
                  )}

                  {step === 3 && (
                    <>
                      <button onClick={autoFillDayShiftsAndAdjust} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-teal-600 text-white rounded hover:bg-teal-700 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm">🤖 日勤一括配置</button>
                      <button onClick={() => { setStep(4); setMessage({text:'Step4: 早番・遅番を振り分けます。', type:'info'}); }} className="flex items-center gap-1 px-3 py-1.5 sm:px-4 sm:py-2 bg-blue-600 text-white rounded hover:bg-blue-700 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm">次へ ▶</button>
                    </>
                  )}

                  {step === 4 && (
                    <>
                      <button onClick={() => distributeEarlyLate(false)} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-purple-600 text-white rounded hover:bg-purple-700 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm">⚖️ 早遅</button>
                      <button onClick={() => { setStep(5); setMessage({text:'Step5: 早番・遅番の配置を再実行（均し）します。', type:'info'}); }} className="flex items-center gap-1 px-3 py-1.5 sm:px-4 sm:py-2 bg-blue-600 text-white rounded hover:bg-blue-700 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm">次へ ▶</button>
                    </>
                  )}

                  {step === 5 && (
                    <>
                      <button onClick={() => distributeEarlyLate(true)} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm">🔄 再早遅</button>
                    </>
                  )}
                </div>

                <div className="flex gap-1.5 sm:gap-2 items-center flex-nowrap shrink-0 ml-auto justify-end sm:flex-wrap sm:shrink sm:min-w-0">
                  <button onClick={handleLockAll} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-slate-600 text-white rounded hover:bg-slate-700 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm" title="入力済みのシフトをすべてロック">🔒 <span className="hidden sm:inline">一括ロック</span></button>
                  <button onClick={handleUnlockAll} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-slate-200 text-slate-700 rounded hover:bg-slate-300 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm" title="すべてのロックを解除">🔓 <span className="hidden sm:inline">全解除</span></button>
                  
                  <button onClick={downloadCSV} className="flex items-center gap-1 px-2 py-1.5 sm:px-3 sm:py-2 bg-gray-800 text-white rounded hover:bg-gray-900 shadow-sm font-bold whitespace-nowrap text-xs sm:text-sm">💾 <span className="hidden sm:inline">CSV</span></button>
                  <button onClick={undo} disabled={history.length === 0} className={`px-2 py-1.5 sm:px-3 sm:py-2 border rounded font-bold transition-colors text-xs sm:text-sm ${history.length === 0 ? 'bg-gray-100 text-gray-400 border-transparent cursor-not-allowed' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50 shadow-sm'}`}>↩️ 戻る</button>
                  {step > 0 && <button onClick={() => setStep(step - 1)} className="px-2 py-1.5 sm:px-3 sm:py-2 bg-white border border-gray-300 text-gray-500 rounded hover:bg-gray-50 font-bold shadow-sm text-xs sm:text-sm">◀</button>}
                  <button onClick={() => { if(confirm('リセットしますか？')) { initializeSchedule(); } }} className="px-2 py-1.5 sm:px-3 sm:py-2 text-gray-400 hover:text-red-500 border border-transparent hover:border-red-200 rounded text-base sm:text-lg">🗑️</button>
                </div>
              </div>
            </div>
            
            <div className="flex px-1 sm:px-2 pb-1.5 sm:pb-2 gap-1 overflow-x-auto sm:justify-center bg-gray-50 border-b hide-scrollbar">
              {['設定', '確保', '夜勤', '日勤', '早遅', '早遅均'].map((label, i) => (
                <div key={i} className={`flex-1 sm:flex-none text-center text-[9px] sm:text-xs py-1 px-1.5 sm:px-3 rounded-full whitespace-nowrap ${step === i ? 'bg-blue-600 text-white font-bold' : step > i ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-400'}`}>
                  {i}. {label}
                </div>
              ))}
            </div>
          </div>

          {/* Main Table */}
          <div className="flex-1 overflow-auto bg-white relative">
            <table className="w-full border-collapse text-xs sm:text-sm">
              <thead className="sticky top-0 z-20 shadow-sm bg-slate-50">
                <tr>
                  <th className="border p-1 sm:p-2 bg-slate-100 min-w-[64px] sm:min-w-[80px] sticky left-0 z-30 text-left">氏名</th>
                  <th className="border p-1 bg-slate-100 w-6 sm:w-8 text-[9px] sm:text-[10px]">夜</th>
                  <th className="border p-1 bg-slate-100 w-6 sm:w-8 text-[9px] sm:text-[10px]">休</th>
                  <th className="border p-1 bg-slate-100 w-6 sm:w-8 text-[9px] sm:text-[10px]">早</th>
                  <th className="border p-1 bg-slate-100 w-6 sm:w-8 text-[9px] sm:text-[10px]">日</th>
                  <th className="border p-1 bg-slate-100 w-6 sm:w-8 text-[9px] sm:text-[10px]">遅</th>
                  {calendar.map(c => (
                    <th key={c.date} className={`border min-w-[28px] sm:min-w-[32px] h-10 ${c.day === 0 ? 'bg-red-50 text-red-600' : c.day === 6 ? 'bg-blue-50 text-blue-600' : 'bg-white'}`}>
                      <div className="flex flex-col items-center justify-center">
                        <span className="font-bold text-xs sm:text-sm">{c.date}</span>
                        <span className="text-[8px] sm:text-[9px] opacity-70">{WEEKDAYS[c.day]}</span>
                      </div>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {staffData.map((staff, index) => {
                  const counts = calculateCounts(staff.id);
                  const target = nightTargets[staff.id];
                  const hasTarget = typeof target === 'number';
                  const isNightWarn = ['A', 'D'].includes(staff.group) && (counts.night < 5 || counts.night > 8);
                  const isTargetMismatch = hasTarget && counts.night !== target;
                  const targetOffDays = (staff.isCustomTime && staff.customOffDays !== '' && staff.customOffDays !== undefined) ? Number(staff.customOffDays) : requiredOffDays;
                  const isOffOk = counts.off === targetOffDays;

                  return (
                    <tr 
                      key={staff.id} 
                      className={`transition-colors cursor-move ${draggedIndex === index ? 'opacity-30 bg-gray-200' : 'hover:bg-slate-50'} ${dragOverIndex === index && draggedIndex !== index ? 'border-t-2 border-blue-500 bg-blue-50' : ''}`}
                      draggable
                      onDragStart={(e) => handleDragStart(e, index)}
                      onDragOver={(e) => e.preventDefault()}
                      onDragEnter={(e) => handleDragEnter(e, index)}
                      onDragEnd={handleDragEnd}
                      onDrop={(e) => handleDrop(e, index)}
                    >
                      <td className={`border p-0 font-medium sticky left-0 z-10 shadow-sm ${dragOverIndex === index && draggedIndex !== index ? 'bg-blue-50' : 'bg-white'}`}>
                        <div className="flex items-center h-full p-1 sm:p-2">
                          <div className="flex flex-col text-[10px] text-gray-400 mr-1 sm:hidden">
                            <button onClick={(e) => { e.stopPropagation(); moveStaff(index, -1); }} disabled={index === 0} className="hover:text-gray-700 disabled:opacity-20 p-0.5" title="上へ">▲</button>
                            <button onClick={(e) => { e.stopPropagation(); moveStaff(index, 1); }} disabled={index === staffData.length - 1} className="hover:text-gray-700 disabled:opacity-20 p-0.5" title="下へ">▼</button>
                          </div>
                          <div className="hidden sm:flex text-gray-300 hover:text-gray-500 mr-1 cursor-move" title="ドラッグで並び替え">
                            ⋮⋮
                          </div>
                          {['A', 'D'].includes(staff.group) && (
                            <button 
                              onClick={(e) => { e.stopPropagation(); handlePriorityNightShift(staff.id); }}
                              className="mr-1 text-[10px] sm:text-[11px] bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-1 py-0.5 rounded font-bold transition-colors border border-indigo-200"
                              title="この職員の夜勤を優先的に自動配置"
                            >
                              🌙先
                            </button>
                          )}
                          <div className="flex flex-col overflow-hidden">
                            <span className="text-gray-800 text-[10px] sm:text-sm truncate">{staff.name}</span>
                            <span className={`text-[8px] sm:text-[9px] inline-block px-1 rounded w-fit ${['A', 'D'].includes(staff.group) ? 'bg-indigo-100 text-indigo-700' : 'bg-teal-100 text-teal-700'}`}>
                              {staff.role} {hasTarget ? `(目標${target})` : ''}
                            </span>
                          </div>
                        </div>
                      </td>
                      <td className={`border text-center font-mono text-[10px] sm:text-xs ${['A', 'D'].includes(staff.group) && (isNightWarn || isTargetMismatch) ? 'text-red-600 font-bold bg-red-50' : 'text-gray-500'}`}>
                        {['A', 'D'].includes(staff.group) ? counts.night : '-'}
                      </td>
                      <td className={`border text-center font-mono text-[10px] sm:text-xs ${!isOffOk ? 'text-orange-600 font-bold bg-orange-50' : 'text-green-600'}`}>
                        <div className="flex flex-col items-center justify-center">
                          <span>{counts.off}</span>
                          {staff.isCustomTime && staff.customOffDays !== '' && staff.customOffDays !== undefined && (
                             <span className="text-[8px] text-gray-400 leading-none mt-[1px]">/{staff.customOffDays}</span>
                          )}
                        </div>
                      </td>
                      <td className="border text-center font-mono text-[10px] sm:text-xs text-yellow-600">{counts.early > 0 ? counts.early : '-'}</td>
                      <td className="border text-center font-mono text-[10px] sm:text-xs text-blue-600">{counts.day > 0 ? counts.day : '-'}</td>
                      <td className="border text-center font-mono text-[10px] sm:text-xs text-purple-600">{counts.late > 0 ? counts.late : '-'}</td>
                      {calendar.map(c => {
                        const shift = schedule[staff.id]?.[c.date] || '';
                        const rule = shiftRules[staff.id]?.[c.date];
                        const isLocked = lockedCells[staff.id]?.[c.date];
                        const isReq = rule?.requested && shift === rule.requested;
                        const hasNgs = rule?.ngs && rule.ngs.length > 0;
                        
                        const isConsecutiveWarn = getConsecutiveAlert(staff.id, c.date);
                        const isNightDenseWarn = getNightDenseAlert(staff.id, c.date);
                        const isNightEndDayWarn = getNightEndDayAlert(staff.id, c.date); 
                        const isWarn = isConsecutiveWarn || isNightDenseWarn || isNightEndDayWarn;
                        
                        return (
                          <td 
                            key={c.date} 
                            className={`border p-0 text-center select-none transition-transform relative ${getCellColor(shift, c)} ${isLocked || isReq ? '' : 'cursor-pointer active:scale-95'}`}
                            style={isWarn ? { boxShadow: 'inset 0 0 0 3px red', zIndex: 1 } : {}}
                            onClick={() => {
                                setSelectingShift({ staffId: staff.id, day: c.date });
                            }}
                          >
                            <div className="w-full h-10 sm:h-9 flex items-center justify-center relative text-[11px] sm:text-sm">
                              {shift}
                              
                              {/* 左上: 希望バッジ */}
                              <div className="absolute top-0 left-0 p-0.5 z-10 pointer-events-none">
                                {isReq && <span className="bg-blue-500 text-white text-[7px] sm:text-[8px] px-0.5 rounded shadow-sm font-bold">希</span>}
                              </div>

                              {/* 右上: ロックアイコン */}
                              <div className="absolute top-0 right-0 p-0.5 z-10 flex flex-col items-end">
                                {isLocked && (
                                  <span 
                                    className="text-red-600 text-[9px] sm:text-[10px] drop-shadow-md cursor-pointer leading-none" 
                                    onClick={(e) => { e.stopPropagation(); toggleLock(staff.id, c.date); }}
                                    title="ロックを解除"
                                  >🔒</span>
                                )}
                                {!isLocked && shift && (
                                  <span 
                                    className="text-gray-500 text-[9px] sm:text-[10px] opacity-20 hover:opacity-100 cursor-pointer leading-none" 
                                    onClick={(e) => { e.stopPropagation(); toggleLock(staff.id, c.date); }}
                                    title="このマスをロック"
                                  >🔓</span>
                                )}
                              </div>

                              {/* 右下: NGバッジ */}
                              <div className="absolute bottom-0 right-0 p-0.5 z-10 pointer-events-none flex flex-col items-end gap-0.5">
                                {hasNgs && <span className="bg-red-500 text-white text-[7px] sm:text-[8px] px-0.5 rounded shadow-sm font-bold">NG</span>}
                              </div>
                            </div>
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
                {/* Night Count */}
                <tr className="bg-slate-100 border-t-2 border-slate-300">
                  <td className="border p-1 sm:p-2 sticky left-0 z-10 bg-slate-100 text-right text-[10px] sm:text-xs font-bold text-slate-600">夜勤 ({nightShiftCount})</td>
                  <td colSpan={5} className="border bg-slate-200"></td>
                  {calendar.map(c => {
                    const cnt = staffData.filter(s => {
                      const sh = schedule[s.id]?.[c.date];
                      return sh === SHIFT_TYPES.NIGHT;
                    }).length;
                    return (
                      <td key={c.date} className={`border text-center text-[10px] sm:text-xs font-bold ${cnt !== nightShiftCount ? 'bg-red-200 text-red-700' : 'text-blue-700'}`}>
                        {cnt}
                      </td>
                    );
                  })}
                </tr>
                 {/* Early Shift Count */}
                 <tr className="bg-yellow-50 border-t border-slate-200">
                  <td className="border p-1 sm:p-2 sticky left-0 z-10 bg-yellow-50 text-right text-[10px] sm:text-xs font-bold text-yellow-700" title="早番＋早日（どちらも7:30出勤）">早番</td>
                  <td colSpan={5} className="border bg-slate-50"></td>
                  {calendar.map(c => {
                      // 早日(7:30出勤)も早番として数える
                      const cnt = staffData.reduce((sum, s) => sum + ([SHIFT_TYPES.EARLY, SHIFT_TYPES.EARLY_DAY].includes(schedule[s.id]?.[c.date]) ? (headWeight(s)) : 0), 0);
                      const req = getEarlyTargetForDay(c.day);
                      const cls = cnt < req ? 'bg-red-100 text-red-700' : 'text-yellow-700';
                      return <td key={c.date} className={`border text-center text-[10px] sm:text-xs font-bold ${cls}`} title={`必要${req} / 在籍${cnt}`}>{cnt}</td>
                  })}
                 </tr>

                {/* Late Shift Count */}
                 <tr className="bg-purple-50 border-t border-slate-200">
                  <td className="border p-1 sm:p-2 sticky left-0 z-10 bg-purple-50 text-right text-[10px] sm:text-xs font-bold text-purple-700" title="遅番の実数のみ。夕方の必要数は下の「夕方」行（遅番＋日遅）で判定するため、ここが0でも問題ありません">遅番</td>
                  <td colSpan={5} className="border bg-slate-50"></td>
                  {calendar.map(c => {
                      const cnt = staffData.reduce((sum, s) => sum + (schedule[s.id]?.[c.date] === SHIFT_TYPES.LATE ? (headWeight(s)) : 0), 0);
                      return <td key={c.date} className="border text-center text-[10px] sm:text-xs text-purple-700 font-bold" title="遅番の実数（夕方の充足判定は「夕方」行）">{cnt}</td>
                  })}
                 </tr>
                 
                {/* Day Count (日勤 only) */}
                <tr className="bg-white border-t border-slate-200">
                  <td className="border p-1 sm:p-2 sticky left-0 z-10 bg-white text-right text-[10px] sm:text-xs font-bold text-slate-500" title="「日」表記の人数のみ。早番・早日・日遅に回った人は含まないため、必要数の判定は下の「朝ピーク」行で行います">日勤</td>
                  <td colSpan={5} className="border bg-slate-50"></td>
                  {calendar.map(c => {
                    const cnt = staffData.reduce((sum, s) => sum + (schedule[s.id]?.[c.date] === SHIFT_TYPES.DAY ? (headWeight(s)) : 0), 0);
                    const target = getTargetForDay(c.date, c.day);
                    // 早番・早日・日遅もその日の戦力なので、この行だけを見て不足と判断しない。
                    // 充足判定は朝ピーク行（早+日+早日+日遅）に一本化する。
                    return (
                      <td key={c.date} className="border text-center text-[10px] sm:text-xs text-gray-600"
                          title={`「日」表記のみ ${cnt}（この日の必要数 ${target} は朝ピーク行で判定）`}>
                        {cnt}
                      </td>
                    );
                  })}
                </tr>

                {/* 朝ピーク帯（入浴帯）在籍: 早+日+早日+日遅（遅番除外）。必要数-2以下=hard違反で濃赤 */}
                <tr className="bg-amber-50 border-t border-slate-200">
                  <td className="border p-1 sm:p-2 sticky left-0 z-10 bg-amber-50 text-right text-[10px] sm:text-xs font-bold text-amber-700">朝ピーク</td>
                  <td colSpan={5} className="border bg-slate-50"></td>
                  {calendar.map(c => {
                    const cnt = getMorningSupply(c.date, schedule);
                    const target = getMorningTargetForDay(c.date, c.day);
                    let cellClass = 'text-amber-700';
                    if (cnt <= target - 2) {
                        cellClass = 'bg-red-500 text-white font-bold'; // 2以上不足＝hard違反
                    } else if (cnt < target) {
                        cellClass = 'bg-red-100 text-red-700 font-bold'; // 1不足＝許容
                    }
                    return (
                      <td key={c.date} className={`border text-center text-[10px] sm:text-xs ${cellClass}`} title={`必要${target} / 在籍${cnt}`}>
                        {cnt}
                      </td>
                    );
                  })}
                </tr>

                {/* 夕方(〜19:00)在籍: 遅+日遅。必要数(eveningTarget)を下回ると赤 */}
                <tr className="bg-purple-50 border-t border-slate-200">
                  <td className="border p-1 sm:p-2 sticky left-0 z-10 bg-purple-50 text-right text-[10px] sm:text-xs font-bold text-purple-700">夕方</td>
                  <td colSpan={5} className="border bg-slate-50"></td>
                  {calendar.map(c => {
                    const cnt = staffData.reduce((sum, s) => sum + ([SHIFT_TYPES.LATE, SHIFT_TYPES.DAY_LATE].includes(schedule[s.id]?.[c.date]) ? (headWeight(s)) : 0), 0);
                    const cellClass = cnt < eveningTarget ? 'bg-red-100 text-red-700 font-bold' : 'text-purple-700';
                    return (
                      <td key={c.date} className={`border text-center text-[10px] sm:text-xs ${cellClass}`} title={`必要${eveningTarget} / 在籍${cnt}`}>
                        {cnt}
                      </td>
                    );
                  })}
                </tr>

                {/* スナップショット機能: 在籍スナップショット行 */}
                {snapshotHours.map(hour => (
                  <tr key={`snapshot-${hour}`} className="bg-teal-50 border-t border-slate-200">
                    <td className="border p-1 sm:p-2 sticky left-0 z-10 bg-teal-50 text-right text-[10px] sm:text-xs font-bold text-teal-700">在籍 {hour}h</td>
                    <td colSpan={5} className="border bg-slate-50"></td>
                    {calendar.map(c => {
                      const count = getStaffCountAtHour(c.date, hour, schedule);
                      const isWarn = count < snapshotWarningThreshold;
                      return (
                        <td key={c.date} className={`border text-center text-[10px] sm:text-xs ${isWarn ? 'bg-red-100 text-red-700 font-bold' : 'text-teal-700 font-bold'}`}>
                          {count}
                        </td>
                      );
                    })}
                  </tr>
                ))}

                {/* タイムラインボタン行 */}
                <tr className="bg-slate-50 border-t border-slate-300">
                  <td className="border p-1 sm:p-2 sticky left-0 z-10 bg-slate-50 text-right text-[10px] sm:text-xs font-bold text-slate-600">詳細</td>
                  <td colSpan={5} className="border bg-slate-50"></td>
                  {calendar.map(c => (
                    <td key={c.date} className="border text-center p-0">
                      <button 
                        onClick={() => setSelectedTimelineDay(c.date)}
                        className="w-full h-full min-h-[32px] text-[10px] sm:text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-bold flex items-center justify-center transition-colors"
                      >
                        🔍詳細
                      </button>
                    </td>
                  ))}
                </tr>
              </tbody>
            </table>
            <div className="h-24 sm:h-12"></div>
          </div>

          {/* タイムラインモーダル */}
          {selectedTimelineDay !== null && timelineData && (() => {
            const d = selectedTimelineDay;
            const dayInfo = calendar.find(c => c.date === d) || { day: 1 };
            
            return (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[110]" onClick={() => setSelectedTimelineDay(null)}>
                <div className="bg-white rounded-lg p-4 shadow-xl w-11/12 max-w-5xl max-h-[90dvh] flex flex-col" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 border-b pb-2 shrink-0">
                    <h3 className="font-bold text-lg text-gray-700">
                      {month}月{d}日 ({WEEKDAYS[dayInfo.day]}) タイムライン
                    </h3>
                    <button onClick={() => setSelectedTimelineDay(null)} className="text-gray-400 hover:text-gray-600 font-bold text-2xl leading-none">×</button>
                  </div>
                  
                  <div className="flex-1 overflow-y-auto mb-4 border border-gray-200 rounded">
                     <div className="relative min-w-[600px]">
                        {/* Header (Hours) */}
                        <div className="flex sticky top-0 bg-gray-100 border-b border-gray-300 z-10">
                          <div className="w-24 sm:w-32 shrink-0 border-r border-gray-300 p-2 text-xs font-bold text-gray-600">氏名</div>
                          <div className="flex-1 flex relative">
                             {Array.from({length: 24}).map((_, i) => (
                               <div key={i} className="flex-1 border-r border-gray-300 text-[10px] text-gray-500 text-center py-1">
                                 {i}
                               </div>
                             ))}
                          </div>
                        </div>
                        
                        {/* Rows */}
                        {timelineData.rows.filter(r => r.bars.length > 0).map(row => (
                          <div key={row.staff.id} className="flex border-b border-gray-200 hover:bg-gray-50">
                            <div className="w-24 sm:w-32 shrink-0 border-r border-gray-300 p-1 sm:p-2 text-xs sm:text-sm font-medium truncate flex flex-col justify-center">
                              {row.staff.name}
                            </div>
                            <div className="flex-1 relative h-10 sm:h-12 bg-white">
                              {/* Grid lines */}
                              <div className="absolute inset-0 flex pointer-events-none">
                                {Array.from({length: 24}).map((_, i) => (
                                  <div key={i} className="flex-1 border-r border-gray-100"></div>
                                ))}
                              </div>
                              {/* Bars */}
                              {row.bars.map((bar, i) => (
                                <div 
                                  key={i} 
                                  className={`absolute top-2 bottom-2 rounded-md ${bar.color} flex items-center justify-center text-white text-[10px] sm:text-xs font-bold shadow-sm`}
                                  style={{
                                    left: `${(bar.start / 24) * 100}%`,
                                    width: `${((bar.end - bar.start) / 24) * 100}%`
                                  }}
                                >
                                  <span className="truncate px-1">{bar.label}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}
                        {timelineData.rows.filter(r => r.bars.length === 0).length === staffData.length && (
                           <div className="text-center py-8 text-gray-500 text-sm">出勤予定者はいません</div>
                        )}
                     </div>
                  </div>

                  {/* Count Graph */}
                  <div className="shrink-0 border border-gray-200 rounded p-2 bg-gray-50 overflow-x-auto">
                    <h4 className="text-xs font-bold text-gray-600 mb-2">時間帯別 合計人数</h4>
                    <div className="flex min-w-[600px] h-24 items-end pl-24 sm:pl-32 pr-[1px]">
                       {timelineData.hourCounts.map((count, i) => {
                         const isWarn = count <= 2;
                         return (
                           <div key={i} className="flex-1 flex flex-col items-center justify-end h-full relative group">
                              <div className="text-[10px] font-bold text-gray-600 mb-1">{count}</div>
                              <div 
                                className={`w-full mx-[2px] sm:mx-1 rounded-t-sm transition-all duration-300 ${isWarn ? 'bg-red-400' : 'bg-blue-400'}`}
                                style={{ height: `${Math.min(100, Math.max(5, count * 15))}%` }}
                              ></div>
                              <div className="absolute bottom-full mb-2 hidden group-hover:block bg-black text-white text-[10px] px-2 py-1 rounded whitespace-nowrap z-20">
                                {i}:00〜{i+1}:00 ({count}人)
                              </div>
                           </div>
                         );
                       })}
                    </div>
                  </div>

                  <div className="mt-4 flex justify-end shrink-0">
                      <button onClick={() => setSelectedTimelineDay(null)} className="bg-slate-600 text-white px-4 py-2 rounded font-bold text-sm">閉じる</button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* Modal (Shift Settings: Manual / Request / NG) */}
          {selectingShift && (
            <div className="fixed inset-0 bg-black bg-opacity-30 flex flex-col items-center justify-center z-[100]" onClick={() => setSelectingShift(null)}>
              <div className="bg-white rounded-lg p-4 shadow-xl max-w-[360px] w-11/12" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-3 border-b pb-2">
                  <h3 className="font-bold text-gray-700 text-sm sm:text-base">
                    {staffData.find(s => s.id === selectingShift.staffId)?.name} 
                    ({selectingShift.day}日) の設定
                  </h3>
                  <button onClick={() => setSelectingShift(null)} className="text-gray-400 hover:text-gray-600 font-bold text-xl leading-none">×</button>
                </div>

                {/* 手動入力 (確定) */}
                <div className="mb-4">
                  <h4 className="text-xs font-bold text-gray-500 mb-2">① シフトの直接入力 (確定)</h4>
                  <div className="grid grid-cols-5 gap-1.5">
                    {SHIFT_ORDER.map(type => {
                      const dayInfo = calendar.find(c => c.date === selectingShift.day) || { day: 1 };
                      const currentShift = schedule[selectingShift.staffId]?.[selectingShift.day];
                      return (
                        <button
                          key={type}
                          onClick={() => {
                            handleShiftChange(selectingShift.staffId, selectingShift.day, type);
                            setSelectingShift(null);
                          }}
                          className={`h-9 sm:h-10 rounded border shadow-sm font-bold flex items-center justify-center active:scale-95 transition-transform text-xs sm:text-sm ${getCellColor(type, dayInfo)} ${currentShift === type ? 'ring-2 ring-blue-500 ring-offset-1' : ''}`}
                        >
                          {type === SHIFT_TYPES.NONE ? '空' : type}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* 希望・NGルール設定 */}
                <div className="border-t pt-3 mb-4">
                  <h4 className="text-xs font-bold text-gray-500 mb-2">② 希望・NG設定 (自動配置用)</h4>
                  <div className="space-y-3">
                    <div>
                      <label className="block text-xs text-gray-700 mb-1">希望シフト (最優先で割り当て)</label>
                      <select 
                        value={tempRequested} 
                        onChange={e => setTempRequested(e.target.value)}
                        className="w-full border rounded p-1.5 text-sm"
                      >
                        <option value="">(指定なし)</option>
                        {SHIFT_ORDER.filter(s=>s!=='').map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-gray-700 mb-1">NGシフト (割り当て除外・複数選択可)</label>
                      <div className="flex flex-wrap gap-1.5">
                        {SHIFT_ORDER.filter(s=>s!=='').map(s => (
                          <label key={s} className={`flex items-center justify-center border rounded px-2 py-1 text-xs cursor-pointer transition-colors ${tempNgs.includes(s) ? 'bg-red-500 text-white border-red-600' : 'bg-gray-50 text-gray-600 border-gray-300 hover:bg-gray-100'}`}>
                            <input 
                              type="checkbox" 
                              className="hidden"
                              checked={tempNgs.includes(s)}
                              onChange={(e) => {
                                if(e.target.checked) setTempNgs([...tempNgs, s]);
                                else setTempNgs(tempNgs.filter(n => n !== s));
                              }}
                            />
                            {s}
                          </label>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 border-t pt-3">
                    <button onClick={() => setSelectingShift(null)} className="bg-gray-200 text-gray-700 px-3 py-1.5 rounded font-bold hover:bg-gray-300 text-sm">キャンセル</button>
                    <button onClick={handleSaveRules} className="bg-blue-600 text-white px-4 py-1.5 rounded font-bold hover:bg-blue-700 text-sm shadow-sm">条件を保存</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal (Shift Times Settings) */}
          {isShiftTimeModalOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[120]" onClick={() => setIsShiftTimeModalOpen(false)}>
              <div className="bg-white rounded-lg p-4 shadow-xl w-11/12 max-w-sm max-h-[90dvh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <h3 className="font-bold text-lg mb-4">⏰ シフト時間設定</h3>
                <div className="space-y-3">
                  {[
                    { key: 'EARLY', label: '早番 (早)' },
                    { key: 'DAY', label: '日勤' },
                    { key: 'LATE', label: '遅番 (遅)' },
                    { key: 'NIGHT', label: '夜勤 (当)' }
                  ].map(shift => (
                    <div key={shift.key} className="flex items-center justify-between border-b pb-2">
                      <span className="text-sm font-bold text-gray-700 w-24">{shift.label}</span>
                      <div className="flex items-center gap-1">
                        <input 
                          type="time" 
                          className="border rounded px-1 py-1 text-sm"
                          value={shiftTimes[shift.key].start}
                          onChange={e => setShiftTimes({...shiftTimes, [shift.key]: {...shiftTimes[shift.key], start: e.target.value}})}
                        />
                        <span className="text-gray-500">〜</span>
                        <input 
                          type="time" 
                          className="border rounded px-1 py-1 text-sm"
                          value={shiftTimes[shift.key].end}
                          onChange={e => setShiftTimes({...shiftTimes, [shift.key]: {...shiftTimes[shift.key], end: e.target.value}})}
                        />
                      </div>
                    </div>
                  ))}
                </div>
                <div className="text-[10px] text-gray-500 mt-2">※夜勤は終了時間が開始時間より小さい場合、翌日までの勤務として扱われます。</div>

                {/* スナップショット機能 */}
                <div className="mt-6 border-t pt-4">
                  <h4 className="font-bold text-gray-700 text-sm mb-1">在籍スナップショット時刻</h4>
                  <p className="text-xs text-gray-500 mb-2">シフト表に表示する時刻を設定します</p>
                  
                  <div className="flex flex-wrap gap-2 mb-3">
                    {snapshotHours.map(hour => (
                      <div key={hour} className="flex items-center bg-teal-100 text-teal-800 rounded px-2 py-1 text-xs font-bold">
                        {hour}h
                        <button 
                          onClick={() => {
                            setSnapshotHours(snapshotHours.filter(h => h !== hour));
                          }} 
                          disabled={snapshotHours.length <= 1}
                          className={`ml-1 leading-none ${snapshotHours.length <= 1 ? 'text-teal-300 cursor-not-allowed' : 'text-teal-600 hover:text-teal-900'}`}
                        >×</button>
                      </div>
                    ))}
                  </div>
                  
                  <div className="flex flex-col gap-3">
                    <div className="flex items-center gap-2">
                      <input 
                        type="number" 
                        min="0" max="23"
                        className="border rounded px-2 py-1 text-sm w-16"
                        value={newSnapshotHour}
                        onChange={e => setNewSnapshotHour(e.target.value)}
                        placeholder="時"
                      />
                      <button 
                        onClick={() => {
                          const val = parseInt(newSnapshotHour, 10);
                          if (!isNaN(val) && val >= 0 && val <= 23 && !snapshotHours.includes(val)) {
                            setSnapshotHours([...snapshotHours, val].sort((a, b) => a - b));
                            setNewSnapshotHour('');
                          }
                        }}
                        disabled={newSnapshotHour === '' || isNaN(parseInt(newSnapshotHour, 10)) || parseInt(newSnapshotHour, 10) < 0 || parseInt(newSnapshotHour, 10) > 23 || snapshotHours.includes(parseInt(newSnapshotHour, 10))}
                        className="bg-gray-200 hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed text-gray-700 px-3 py-1 rounded text-sm font-bold"
                      >追加</button>
                    </div>

                    <div className="flex items-center gap-2 mt-1">
                      <span className="text-sm text-gray-700 font-medium">警告ライン:</span>
                      <input 
                        type="number" 
                        min="0"
                        className="border rounded px-2 py-1 text-sm w-16 text-center"
                        value={snapshotWarningThreshold}
                        onChange={e => setSnapshotWarningThreshold(Math.max(0, parseInt(e.target.value) || 0))}
                      />
                      <span className="text-sm text-gray-700">人未満で赤色表示</span>
                    </div>
                  </div>
                </div>

                <div className="mt-6 flex justify-end">
                  <button onClick={() => setIsShiftTimeModalOpen(false)} className="bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm">完了</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal (Day Targets Settings) */}
          {isDayTargetModalOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onClick={() => setIsDayTargetModalOpen(false)}>
              <div className="bg-white rounded-lg p-4 w-11/12 max-w-sm shadow-xl max-h-[80dvh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <h3 className="font-bold text-lg mb-4">🎯 必要人数設定</h3>

                <h4 className="font-bold text-sm text-amber-700 mb-1 border-b pb-1">🛁 各曜日の朝ピーク必要数（入浴帯・下限hard）</h4>
                <p className="text-[10px] text-gray-500 mb-2">早番＋日勤＋早日＋日遅の朝在籍。この数より<b>2以上少ない</b>日は自動作成で禁止（連直で確保）。遅番は朝に数えません。月木=機械浴・火金=個浴・水=リネン等に合わせて設定。</p>
                <div className="grid grid-cols-7 gap-1 sm:gap-2 mb-4">
                  {WEEKDAYS.map((w, i) => (
                    <div key={i} className="flex flex-col items-center">
                      <span className="text-xs sm:text-sm text-gray-600 mb-1">{w}</span>
                      <input
                        type="number"
                        className="w-full border border-amber-300 rounded text-center py-1 text-sm font-bold bg-amber-50"
                        value={morningTargets[i]}
                        onChange={e => {
                           const val = parseInt(e.target.value) || 0;
                           const nt = [...morningTargets];
                           nt[i] = val;
                           setMorningTargets(nt);
                        }}
                        min="0"
                        max="20"
                      />
                    </div>
                  ))}
                </div>

                <h4 className="font-bold text-sm text-yellow-700 mb-1 border-b pb-1">🌅 各曜日の早番必要数（早朝7:30から）</h4>
                <p className="text-[10px] text-gray-500 mb-2">機械浴の月木などは厚めに。人手が足りない日は自動で日遅（夕方まで延長）も使います。</p>
                <div className="grid grid-cols-7 gap-1 sm:gap-2 mb-4">
                  {WEEKDAYS.map((w, i) => (
                    <div key={i} className="flex flex-col items-center">
                      <span className="text-xs sm:text-sm text-gray-600 mb-1">{w}</span>
                      <input
                        type="number"
                        className="w-full border border-yellow-300 rounded text-center py-1 text-sm font-bold bg-yellow-50"
                        value={earlyTargets[i]}
                        onChange={e => {
                           const val = Math.max(0, parseInt(e.target.value) || 0);
                           const nt = [...earlyTargets];
                           nt[i] = val;
                           setEarlyTargets(nt);
                        }}
                        min="0"
                        max="20"
                      />
                    </div>
                  ))}
                </div>

                <h4 className="font-bold text-sm text-purple-700 mb-1 border-b pb-1">🌆 夕方必要数（〜19:00・遅番/日遅）</h4>
                <div className="flex items-center gap-2 mb-4">
                  <input
                    type="number"
                    className="w-20 border border-purple-300 rounded text-center py-1 text-sm font-bold bg-purple-50"
                    value={eveningTarget}
                    onChange={e => setEveningTarget(Math.max(0, parseInt(e.target.value) || 0))}
                    min="0"
                    max="10"
                  />
                  <span className="text-sm text-gray-600">名（各日、遅番または日遅で19:00まで確保）</span>
                </div>
                <label className="flex items-start gap-2 mb-4 text-xs text-gray-700 cursor-pointer">
                  <input
                    type="checkbox"
                    className="w-4 h-4 accent-purple-600 cursor-pointer mt-0.5"
                    checked={eveningOverEarly}
                    onChange={e => setEveningOverEarly(e.target.checked)}
                  />
                  <span>
                    <b>夕方を早番より優先する</b><br />
                    <span className="text-gray-500">
                      その日に夕方へ出せるのが早番の1名しかいない場合、その人を日遅に回して夕方を確保します。
                      かわりにその日の早番はゼロになります。OFF のときは早番を残し、夕方を空けます。
                    </span>
                  </span>
                </label>

                <h4 className="font-bold text-sm text-gray-700 mb-2 border-b pb-1">各曜日の日勤必要数（目安・均し用）</h4>
                <div className="grid grid-cols-7 gap-1 sm:gap-2 mb-4">
                  {WEEKDAYS.map((w, i) => (
                    <div key={i} className="flex flex-col items-center">
                      <span className="text-xs sm:text-sm text-gray-600 mb-1">{w}</span>
                      <input
                        type="number"
                        className="w-full border rounded text-center py-1 text-sm font-bold"
                        value={dayTargets[i]}
                        onChange={e => {
                           const val = parseInt(e.target.value) || 0;
                           const newTargets = [...dayTargets];
                           newTargets[i] = val;
                           setDayTargets(newTargets);
                        }}
                        min="0"
                        max="20"
                      />
                    </div>
                  ))}
                </div>

                <h4 className="font-bold text-sm text-gray-700 mb-2 border-b pb-1 mt-4">特定日の日勤必要数（特別日）</h4>
                <div className="flex flex-col gap-2 mb-4">
                  <div className="flex items-center gap-2">
                    <select
                      className="border rounded px-2 py-1 text-sm"
                      value={newSpecificDay}
                      onChange={(e) => setNewSpecificDay(e.target.value)}
                    >
                      <option value="">日付を選択</option>
                      {calendar.map(c => (
                        <option key={c.date} value={c.date}>{c.date}日 ({WEEKDAYS[c.day]})</option>
                      ))}
                    </select>
                    <input
                      type="number"
                      className="border rounded w-16 px-2 py-1 text-sm text-center"
                      value={newSpecificTarget}
                      onChange={(e) => setNewSpecificTarget(Math.max(0, parseInt(e.target.value) || 0))}
                      min="0"
                    />
                    <span className="text-sm text-gray-600">名</span>
                    <button
                      onClick={() => {
                        if (newSpecificDay) {
                          setSpecificDayTargets({
                            ...specificDayTargets,
                            [newSpecificDay]: newSpecificTarget
                          });
                          setNewSpecificDay('');
                        }
                      }}
                      disabled={!newSpecificDay}
                      className="bg-gray-200 hover:bg-gray-300 disabled:opacity-50 text-gray-700 px-3 py-1 rounded text-sm font-bold ml-auto"
                    >追加</button>
                  </div>
                  <div className="flex flex-wrap gap-2 mt-2">
                    {Object.entries(specificDayTargets).sort((a, b) => Number(a[0]) - Number(b[0])).map(([dayStr, targetVal]) => (
                      <div key={dayStr} className="flex items-center bg-blue-100 text-blue-800 rounded px-2 py-1 text-xs font-bold">
                        {dayStr}日: {targetVal}名
                        <button 
                          onClick={() => {
                            const newTargets = { ...specificDayTargets };
                            delete newTargets[dayStr];
                            setSpecificDayTargets(newTargets);
                          }}
                          className="ml-1 text-blue-500 hover:text-blue-900 leading-none"
                        >×</button>
                      </div>
                    ))}
                    {Object.keys(specificDayTargets).length === 0 && (
                      <span className="text-xs text-gray-400">特定日の設定はありません</span>
                    )}
                  </div>
                </div>

                <h4 className="font-bold text-sm text-gray-700 mb-2 border-b pb-1 mt-4">1日あたりの夜勤必要数</h4>
                <div className="flex items-center gap-2 mb-4">
                  <input 
                    type="number" 
                    className="w-20 border rounded text-center py-1 text-sm font-bold"
                    value={nightShiftCount}
                    onChange={e => setNightShiftCount(Math.max(1, parseInt(e.target.value) || 1))}
                    min="1"
                    max="10"
                  />
                  <span className="text-sm text-gray-600">名</span>
                </div>

                <div className="text-xs text-gray-500 mb-4 bg-gray-50 p-2 rounded">
                  ※日勤設定は「均し処理」の移動基準や色分けに反映されます。<br/>
                  ※夜勤設定は夜勤の自動配置人数に反映されます。
                </div>
                <div className="flex justify-end">
                  <button onClick={() => setIsDayTargetModalOpen(false)} className="bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm">閉じる</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal (Staff Settings & Forbidden Pairs) */}
          {isStaffModalOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onClick={() => setIsStaffModalOpen(false)}>
              <div className="bg-white rounded-lg p-4 w-11/12 max-w-5xl shadow-xl" onClick={e => e.stopPropagation()}>
                <h3 className="font-bold text-lg mb-4">👥 職員設定</h3>
                <div className="max-h-[50dvh] overflow-auto mb-4 border rounded">
                  <table className="w-full text-sm min-w-[600px]">
                    <thead className="bg-gray-50 sticky top-0 z-10 shadow-sm">
                      <tr>
                        <th className="p-2 text-left min-w-[100px]">名前</th>
                        <th className="p-2 text-left min-w-[110px]">グループ</th>
                        <th className="p-2 text-center whitespace-nowrap min-w-[80px]">夜勤回数</th>
                        <th className="p-2 text-center whitespace-nowrap min-w-[70px]">ペア禁止</th>
                        <th className="p-2 text-center whitespace-nowrap min-w-[140px]">個別時間(非常勤等)</th>
                        <th className="p-2 w-10"></th>
                      </tr>
                    </thead>
                    <tbody>
