<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>シフト作成アプリ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  
  <style>
    body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .no-select { user-select: none; -webkit-user-select: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-[100dvh] overflow-hidden">
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel" data-type="module" data-presets="react,env">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- 初期データ定義 ---
    const INITIAL_STAFF_DATA = [
      { id: 'staff_a', name: '職員A', group: 'A', role: '夜勤', forbiddenPairs: [], isCustomTime: false, countWeight: 0.5, customStart: '09:00', customEnd: '15:00', customOffDays: '', maxConsecutive: '', useWeekdayPattern: false, weekdayPattern: ['','','','','','',''] },
      { id: 'staff_b', name: '職員B', group: 'A', role: '夜勤', forbiddenPairs: [], isCustomTime: false, countWeight: 0.5, customStart: '09:00', customEnd: '15:00', customOffDays: '', maxConsecutive: '', useWeekdayPattern: false, weekdayPattern: ['','','','','','',''] },
      { id: 'staff_c', name: '職員C', group: 'B', role: '日勤', forbiddenPairs: [], isCustomTime: false, countWeight: 0.5, customStart: '09:00', customEnd: '15:00', customOffDays: '', maxConsecutive: '', useWeekdayPattern: false, weekdayPattern: ['','','','','','',''] },
    ];

    const DEFAULT_SHIFT_TIMES = {
      EARLY: { start: '07:30', end: '16:00' },
      DAY: { start: '08:30', end: '17:00' },
      LATE: { start: '10:30', end: '19:00' },
      NIGHT: { start: '17:00', end: '09:00' },
    };

    const SHIFT_TYPES = {
      NONE: '',
      DAY: '日',
      EARLY: '早',
      EARLY_DAY: '早日',   // 早番出勤〜日勤退勤（7:30–17:00）指定残業・早出
      LATE: '遅',
      DAY_LATE: '日遅',    // 日勤出勤〜遅番退勤（8:30–19:00）指定残業
      NIGHT: '当',
      NIGHT_END: '明',
      OFF: '×',
      PAID: '有',
      REFRESH: 'リ',
      TRAINING: '研修',
    };

    const SHIFT_ORDER = [
      SHIFT_TYPES.NONE,
      SHIFT_TYPES.DAY,
      SHIFT_TYPES.EARLY,
      SHIFT_TYPES.EARLY_DAY,
      SHIFT_TYPES.LATE,
      SHIFT_TYPES.DAY_LATE,
      SHIFT_TYPES.NIGHT,
      SHIFT_TYPES.NIGHT_END,
      SHIFT_TYPES.OFF,
      SHIFT_TYPES.PAID,
      SHIFT_TYPES.REFRESH,
      SHIFT_TYPES.TRAINING
    ];

    const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
    const DEFAULT_DAY_TARGETS = [4, 7, 7, 4, 7, 7, 4];
    // 朝ピーク帯（入浴帯）の必要在籍数（曜日別）。既定は日勤必要数と同値から開始。
    // 供給に数えるのは「朝に在籍するシフト」= 早番/日勤/早日/日遅（遅番・明け・当は除外）。
    const DEFAULT_MORNING_TARGETS = [4, 7, 7, 4, 7, 7, 4];
    // 朝ピークに在籍するとみなすシフト種別（遅番は10:30出勤のため入浴帯には数えない）
    const MORNING_PRESENT_SHIFTS = ['日', '早', '早日', '日遅'];
    // 早番（7:30出勤）の必要数（曜日別）。機械浴日(月木)などは厚めに設定して早朝から人員確保。
    const DEFAULT_EARLY_TARGETS = [1, 1, 1, 1, 1, 1, 1];
    // 夕方(17:00以降〜19:00)の必要在籍数。遅番/日遅で確保。既定1（各日最低1名を19:00まで）。
    const DEFAULT_EVENING_TARGET = 1;
    // 夕方に在籍するとみなすシフト種別（17時退勤の日勤/早日は含まない）
    const EVENING_PRESENT_SHIFTS = ['遅', '日遅'];

    // 非常勤職員の人数換算。0.5（半人前）か1（1人前）を職員ごとに選べる。
    // 常勤は常に1。設定が無い非常勤は従来どおり0.5として扱う。
    const DEFAULT_PART_TIME_WEIGHT = 0.5;
    const headWeight = (staff) => {
      if (!staff || !staff.isCustomTime) return 1;
      return Number(staff.countWeight) === 1 ? 1 : DEFAULT_PART_TIME_WEIGHT;
    };

    // --- ユーティリティ ---
    const getDaysInMonth = (year, month) => new Date(year, month, 0).getDate();

    const createCalendar = (year, month) => {
      const daysInMonth = getDaysInMonth(year, month);
      return Array.from({ length: daysInMonth }, (_, i) => {
        const date = new Date(year, month - 1, i + 1);
        const day = date.getDay();
        return {
          date: i + 1,
          day: day,
          isHoliday: day === 0 || day === 6,
        };
      });
    };

    const calcDefaultOffDays = (year, month) => {
      const days = new Date(year, month, 0).getDate();
      return days >= 31 ? 9 : 8;
    };

    const timeToDecimal = (timeStr) => {
      if(!timeStr) return 0;
      const [h, m] = timeStr.split(':').map(Number);
      return h + (m / 60);
    };

    // --- メインコンポーネント ---
    function App() {
      const [year, setYear] = useState(new Date().getFullYear());
      const [month, setMonth] = useState(new Date().getMonth() + 2);
      const [step, setStep] = useState(0);
      const [scheduleStep, setScheduleStep] = useState(0); 
      
      const [requiredOffDays, setRequiredOffDays] = useState(8);

      const [staffData, setStaffData] = useState(() => {
        const saved = localStorage.getItem('staff_master_v1');
        if (saved) {
            const parsed = JSON.parse(saved);
            return parsed.map(s => ({ 
                ...s, 
                forbiddenPairs: s.forbiddenPairs || [],
                isCustomTime: s.isCustomTime || false,
                countWeight: Number(s.countWeight) === 1 ? 1 : 0.5,
                customStart: s.customStart || '09:00',
                customEnd: s.customEnd || '15:00',
                customOffDays: s.customOffDays !== undefined ? s.customOffDays : '',
                maxConsecutive: s.maxConsecutive !== undefined ? s.maxConsecutive : '',
                useWeekdayPattern: !!s.useWeekdayPattern,
                weekdayPattern: Array.isArray(s.weekdayPattern) && s.weekdayPattern.length === 7 ? s.weekdayPattern : ['','','','','','',''],
                useWeekdayPattern: !!s.useWeekdayPattern,
                weekdayPattern: Array.isArray(s.weekdayPattern) && s.weekdayPattern.length === 7 ? s.weekdayPattern : ['','','','','','','']
            }));
        }
        return INITIAL_STAFF_DATA;
      });

      const [shiftTimes, setShiftTimes] = useState(() => {
        const saved = localStorage.getItem('shift_times_v1');
        return saved ? JSON.parse(saved) : DEFAULT_SHIFT_TIMES;
      });

      const [newSnapshotHour, setNewSnapshotHour] = useState('');
      const [snapshotHours, setSnapshotHours] = useState(() => {
        const saved = localStorage.getItem('snapshot_hours_v1');
        return saved ? JSON.parse(saved) : [9, 16];
      });
      const [snapshotWarningThreshold, setSnapshotWarningThreshold] = useState(() => {
        const saved = localStorage.getItem('snapshot_warning_threshold_v1');
        return saved ? parseInt(saved, 10) : 3;
      });

      const [schedule, setSchedule] = useState({});
      const [prevMonthSchedule, setPrevMonthSchedule] = useState({}); 
      const [lockedCells, setLockedCells] = useState({});
      const [shiftRules, setShiftRules] = useState({});
      const [history, setHistory] = useState([]);
      const [prevMonthNightStaff, setPrevMonthNightStaff] = useState([]);
      const [nightTargets, setNightTargets] = useState({});
      const [specificDayTargets, setSpecificDayTargets] = useState({});
      
      const [dayTargets, setDayTargets] = useState(() => {
        const saved = localStorage.getItem('day_targets_v1');
        return saved ? JSON.parse(saved) : DEFAULT_DAY_TARGETS;
      });

      // 朝ピーク帯の必要在籍数（曜日別・hard下限の基準）
      const [morningTargets, setMorningTargets] = useState(() => {
        const saved = localStorage.getItem('morning_targets_v1');
        return saved ? JSON.parse(saved) : DEFAULT_MORNING_TARGETS;
      });
      // 特定日の朝ピーク必要数（上書き）
      const [specificMorningTargets, setSpecificMorningTargets] = useState({});

      // 早番必要数（曜日別）。機械浴の月木などを厚めに。
      const [earlyTargets, setEarlyTargets] = useState(() => {
        const saved = localStorage.getItem('early_targets_v1');
        return saved ? JSON.parse(saved) : DEFAULT_EARLY_TARGETS;
      });
      // 夕方(〜19:00)の必要在籍数（遅番/日遅で確保）
      const [eveningTarget, setEveningTarget] = useState(() => {
        const saved = localStorage.getItem('evening_target_v1');
        return saved ? parseInt(saved, 10) : DEFAULT_EVENING_TARGET;
      });

      // 夕方の確保を早番より優先するか。ON にすると、その日の唯一の早番を日遅に回してでも
      // 夕方(〜19:00)を確保する（その日の早番はゼロになる）。既定 OFF。
      const [eveningOverEarly, setEveningOverEarly] = useState(() => {
        return localStorage.getItem('evening_over_early_v1') === '1';
      });

      const [nightShiftCount, setNightShiftCount] = useState(() => {
        const saved = localStorage.getItem('night_shift_count_v1');
        return saved ? parseInt(saved, 10) : 2;
      });

      const [message, setMessage] = useState({ text: '初期設定：年月を指定し、前月夜勤者などを入力してください。', type: 'info' });
      // 夜勤生成の違反内訳 { unfilled, items:[{label,count}] }
      const [nightViolations, setNightViolations] = useState(null);
      // 希望休インポートの結果レポート { applied, unknown, missing, conflicts, warnings, staffCount }
      const [requestReport, setRequestReport] = useState(null);

      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [isPrevNightModalOpen, setIsPrevNightModalOpen] = useState(false);
      const [isStaffModalOpen, setIsStaffModalOpen] = useState(false); 
      const [isDayTargetModalOpen, setIsDayTargetModalOpen] = useState(false); 
      const [isShiftTimeModalOpen, setIsShiftTimeModalOpen] = useState(false); 
      const [selectingShift, setSelectingShift] = useState(null); 
      const [settingForbiddenPairsFor, setSettingForbiddenPairsFor] = useState(null); 
      const [selectedTimelineDay, setSelectedTimelineDay] = useState(null); 

      const [tempRequested, setTempRequested] = useState('');
      const [tempNgs, setTempNgs] = useState([]);
      const [newSpecificDay, setNewSpecificDay] = useState('');
      const [newSpecificTarget, setNewSpecificTarget] = useState(4);

      const [draggedIndex, setDraggedIndex] = useState(null);
      const [dragOverIndex, setDragOverIndex] = useState(null);

      const fileInputRef = useRef(null);
      const prevMonthFileInputRef = useRef(null);
      const settingsFileInputRef = useRef(null);
      const requestsFileInputRef = useRef(null);
      // Step2「再配置」で別パターンを出すための変異シード。
      // 「自動」= 0 にリセット（毎回同じ基準解）／「再配置」= +1 して別解を探索する。
      const nightVariantRef = useRef(0);
      // 「自動」で得られた品質の基準（目標未達数・soft違反合計）。
      // 再配置がこれより悪い解しか出せなかった場合は適用せず、現状を維持する。
      const nightBaselineRef = useRef(null);

      useEffect(() => {
        if (month > 12) { setYear(y => y + 1); setMonth(1); }
        else if (month < 1) { setYear(y => y - 1); setMonth(12); }
      }, [month]);

      useEffect(() => {
        if (month >= 1 && month <= 12) {
          setRequiredOffDays(calcDefaultOffDays(year, month));
          setHistory([]); 
        }
      }, [year, month]);

      useEffect(() => {
        localStorage.setItem('staff_master_v1', JSON.stringify(staffData));
      }, [staffData]);

      useEffect(() => {
        localStorage.setItem('day_targets_v1', JSON.stringify(dayTargets));
      }, [dayTargets]);

      useEffect(() => {
        localStorage.setItem('morning_targets_v1', JSON.stringify(morningTargets));
      }, [morningTargets]);

      useEffect(() => {
        localStorage.setItem('early_targets_v1', JSON.stringify(earlyTargets));
      }, [earlyTargets]);

      useEffect(() => {
        localStorage.setItem('evening_target_v1', eveningTarget.toString());
      }, [eveningTarget]);

      useEffect(() => {
        localStorage.setItem('evening_over_early_v1', eveningOverEarly ? '1' : '0');
      }, [eveningOverEarly]);

      useEffect(() => {
        localStorage.setItem('night_shift_count_v1', nightShiftCount.toString());
      }, [nightShiftCount]);

      useEffect(() => {
        localStorage.setItem('shift_times_v1', JSON.stringify(shiftTimes));
      }, [shiftTimes]);

      useEffect(() => {
        localStorage.setItem('snapshot_hours_v1', JSON.stringify(snapshotHours));
      }, [snapshotHours]);
      
      useEffect(() => {
        localStorage.setItem('snapshot_warning_threshold_v1', snapshotWarningThreshold.toString());
      }, [snapshotWarningThreshold]);

      useEffect(() => {
        if (selectingShift) {
          const rule = shiftRules[selectingShift.staffId]?.[selectingShift.day] || {};
          setTempRequested(rule.requested || '');
          setTempNgs(rule.ngs || []);
        }
      }, [selectingShift, shiftRules]);

      const calendar = useMemo(() => createCalendar(year, month), [year, month]);
      const daysInMonth = calendar.length;
      const totalNightSlots = daysInMonth * nightShiftCount;

      const getShiftSafe = (staffId, day, currentSched) => {
         if (day >= 1) return currentSched[staffId]?.[day] || SHIFT_TYPES.NONE;
         if (prevMonthSchedule[staffId]) {
             const prevDays = Object.keys(prevMonthSchedule[staffId]).length;
             const targetDay = prevDays + day; 
             if (targetDay >= 1) return prevMonthSchedule[staffId][targetDay];
         }
         if (day === 0 && prevMonthNightStaff.includes(staffId)) return SHIFT_TYPES.NIGHT; 
         return SHIFT_TYPES.NONE;
      };

      const saveHistory = () => {
        setHistory(prev => {
          const newHistory = [...prev, {
            schedule: JSON.parse(JSON.stringify(schedule)),
            lockedCells: JSON.parse(JSON.stringify(lockedCells)),
            shiftRules: JSON.parse(JSON.stringify(shiftRules)),
            scheduleStep: scheduleStep 
          }];
          if (newHistory.length > 20) newHistory.shift();
          return newHistory;
        });
      };

      const undo = () => {
        if (history.length === 0) return;
        const previousState = history[history.length - 1];
        setSchedule(previousState.schedule);
        setLockedCells(previousState.lockedCells);
        if (previousState.shiftRules) setShiftRules(previousState.shiftRules);
        if (previousState.scheduleStep !== undefined) {
          setScheduleStep(previousState.scheduleStep);
          setStep(previousState.scheduleStep); 
        }
        setHistory(prev => prev.slice(0, -1));
        setMessage({ text: '直前の状態に戻しました。', type: 'info' });
      };

      const initializeSchedule = () => {
        const initialSchedule = {};
        staffData.forEach(staff => {
          initialSchedule[staff.id] = {};
          calendar.forEach(day => {
            initialSchedule[staff.id][day.date] = SHIFT_TYPES.NONE;
          });
        });
        setSchedule(initialSchedule);
        setPrevMonthSchedule({});
        setLockedCells({});
        setShiftRules({});
        setStep(0);
        setScheduleStep(0);
        setPrevMonthNightStaff([]);
        setNightTargets({});
        setSpecificDayTargets({});
        setSpecificMorningTargets({});
        setHistory([]);
        setMessage({ text: '初期設定：年月を指定し、前月夜勤者などを入力してください。', type: 'info' });
      };

      useEffect(() => {
        setSchedule(prev => {
          const newSchedule = { ...prev };
          let changed = false;
          staffData.forEach(staff => {
            if (!newSchedule[staff.id]) {
              newSchedule[staff.id] = {};
              calendar.forEach(day => {
                newSchedule[staff.id][day.date] = SHIFT_TYPES.NONE;
              });
              changed = true;
            }
          });
          return changed ? newSchedule : prev;
        });
      }, [staffData, calendar]);

      useEffect(() => {
        try {
          const savedData = localStorage.getItem(`shift_data_v17_${year}_${month}`);
          if (savedData) {
            const parsed = JSON.parse(savedData);
            const loadedSchedule = parsed.schedule || {};
            staffData.forEach(staff => {
                if (!loadedSchedule[staff.id]) {
                    loadedSchedule[staff.id] = {};
                    calendar.forEach(day => {
                        loadedSchedule[staff.id][day.date] = SHIFT_TYPES.NONE;
                    });
                }
            });

            setSchedule(loadedSchedule);
            setPrevMonthSchedule(parsed.prevMonthSchedule || {});
            setLockedCells(parsed.lockedCells || {});
            setShiftRules(parsed.shiftRules || {});
            setStep(parsed.step || 0);
            setScheduleStep(parsed.scheduleStep !== undefined ? parsed.scheduleStep : (parsed.step || 0));
            setPrevMonthNightStaff(parsed.prevMonthNightStaff || []);
            setNightTargets(parsed.nightTargets || {});
            setSpecificDayTargets(parsed.specificDayTargets || {});
            setSpecificMorningTargets(parsed.specificMorningTargets || {});
            if (parsed.requiredOffDays) setRequiredOffDays(parsed.requiredOffDays);
            if (parsed.nightShiftCount !== undefined) setNightShiftCount(parsed.nightShiftCount);
            
            setHistory([]); 
            setMessage({ text: '保存されたデータを読み込みました。', type: 'success' });
          } else {
            initializeSchedule();
          }
        } catch (e) {
          console.error(e);
          initializeSchedule();
        }
      }, [year, month]);

      useEffect(() => {
        if (Object.keys(schedule).length > 0) {
          const dataToSave = { schedule, prevMonthSchedule, lockedCells, shiftRules, step, scheduleStep, prevMonthNightStaff, nightTargets, requiredOffDays, nightShiftCount, specificDayTargets, specificMorningTargets };
          localStorage.setItem(`shift_data_v17_${year}_${month}`, JSON.stringify(dataToSave));
        }
      }, [schedule, prevMonthSchedule, lockedCells, shiftRules, step, scheduleStep, prevMonthNightStaff, nightTargets, year, month, requiredOffDays, nightShiftCount, specificDayTargets, specificMorningTargets]);

      const getTargetForDay = (date, dayOfWeek) => {
        return specificDayTargets[date] !== undefined ? specificDayTargets[date] : dayTargets[dayOfWeek];
      };

      // 朝ピーク帯の必要在籍数（特定日 > 曜日別）
      const getMorningTargetForDay = (date, dayOfWeek) => {
        return specificMorningTargets[date] !== undefined ? specificMorningTargets[date] : morningTargets[dayOfWeek];
      };

      // 早番必要数（曜日別）
      const getEarlyTargetForDay = (dayOfWeek) => {
        const v = earlyTargets[dayOfWeek];
        return (typeof v === 'number' && v >= 0) ? v : 1;
      };

      // 朝ピーク帯の在籍供給数（早番/日勤/早日/日遅。遅番・明け・当は数えない）
      const getMorningSupply = (day, currentSchedule) => {
        let count = 0;
        staffData.forEach(s => {
          const shift = currentSchedule[s.id]?.[day];
          if (MORNING_PRESENT_SHIFTS.includes(shift)) {
            count += headWeight(s);
          }
        });
        return count;
      };

      const handleImportCSV = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            let text = e.target.result;
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            
            const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
            if (lines.length < 2) throw new Error("データが空です");

            const header = lines[0].split(',');
            const dateIndices = {}; 
            for (let i = 2; i < header.length; i++) {
              const match = header[i].match(/^(\d+)/);
              if (match) dateIndices[match[1]] = i;
            }

            const newStaffData = [];
            const newSchedule = {};
            // 読み込んだシフトは「手入力で確定済み」とみなし、自動でロックをかける
            const newLockedCells = {};
            let lockedCount = 0;

            for (let i = 1; i < lines.length; i++) {
              const row = lines[i].split(',');
              const name = row[0];
              const group = row[1] || 'B';
              let role = '日勤';
              if (group === 'A' || group === 'D') role = '夜勤';

              const existingStaff = staffData.find(s => s.name === name);
              const staffId = existingStaff ? existingStaff.id : `staff_${Date.now()}_${i}`;
              const forbiddenPairs = existingStaff ? (existingStaff.forbiddenPairs || []) : [];
              const isCustomTime = existingStaff ? (existingStaff.isCustomTime || false) : false;
              const countWeight = (existingStaff && Number(existingStaff.countWeight) === 1) ? 1 : 0.5;
              const customStart = existingStaff ? (existingStaff.customStart || '09:00') : '09:00';
              const customEnd = existingStaff ? (existingStaff.customEnd || '15:00') : '15:00';
              const customOffDays = existingStaff ? (existingStaff.customOffDays !== undefined ? existingStaff.customOffDays : '') : '';
              const maxConsecutive = existingStaff ? (existingStaff.maxConsecutive !== undefined ? existingStaff.maxConsecutive : '') : '';
              const useWeekdayPattern = existingStaff ? !!existingStaff.useWeekdayPattern : false;
              const weekdayPattern = (existingStaff && Array.isArray(existingStaff.weekdayPattern) && existingStaff.weekdayPattern.length === 7) ? existingStaff.weekdayPattern : ['','','','','','',''];

              newStaffData.push({ id: staffId, name, group, role, forbiddenPairs, isCustomTime, countWeight, customStart, customEnd, customOffDays, maxConsecutive, useWeekdayPattern, weekdayPattern });
              newSchedule[staffId] = {};
              newLockedCells[staffId] = {};

              for (let d = 1; d <= daysInMonth; d++) {
                const colIdx = dateIndices[d];
                const shiftVal = colIdx !== undefined ? (row[colIdx] || '').trim() : '';
                newSchedule[staffId][d] = shiftVal;
                // 空欄以外のマスは読み込み時点でロック（自動作成で動かさない）
                if (shiftVal && shiftVal !== SHIFT_TYPES.NONE) {
                  newLockedCells[staffId][d] = true;
                  lockedCount++;
                }
              }
            }

            saveHistory();
            setStaffData(newStaffData);
            setSchedule(newSchedule);
            setLockedCells(newLockedCells);
            setScheduleStep(step);
            setMessage({ text: 'CSVからデータを読み込み、入力済みの' + lockedCount + 'マスに自動でロックをかけました（🔓全解除で外せます）。', type: 'success' });
          } catch (err) {
            console.error(err);
            setMessage({ text: 'CSVの読み込みに失敗しました。', type: 'error' });
          }
          event.target.value = ''; 
        };
        reader.readAsText(file);
      };

      const handleImportPrevMonthCSV = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            let text = e.target.result;
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            
            const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
            if (lines.length < 2) throw new Error("データが空です");

            const header = lines[0].split(',');
            const dateIndices = {}; 
            for (let i = 2; i < header.length; i++) {
              const match = header[i].match(/^(\d+)/);
              if (match) dateIndices[match[1]] = i;
            }

            const newPrevSchedule = {};
            let maxDate = 0;
            Object.keys(dateIndices).forEach(d => {
                maxDate = Math.max(maxDate, parseInt(d, 10));
            });

            const nightStaffs = [];

            for (let i = 1; i < lines.length; i++) {
              const row = lines[i].split(',');
              const name = row[0];
              
              const existingStaff = staffData.find(s => s.name === name);
              if (existingStaff) {
                newPrevSchedule[existingStaff.id] = {};
                for (let d = 1; d <= maxDate; d++) {
                  const colIdx = dateIndices[d];
                  const shiftVal = colIdx !== undefined ? (row[colIdx] || '') : '';
                  newPrevSchedule[existingStaff.id][d] = shiftVal;
                }
                if (newPrevSchedule[existingStaff.id][maxDate] === SHIFT_TYPES.NIGHT) {
                    nightStaffs.push(existingStaff.id);
                }
              }
            }

            saveHistory();
            setPrevMonthSchedule(newPrevSchedule);
            setScheduleStep(step);
            
            if (nightStaffs.length > 0) {
                handlePrevMonthNightSet(nightStaffs);
            }
            
            setMessage({ text: '先月のシフトを読み込み、月またぎの連勤チェックの基準に反映しました。', type: 'success' });
          } catch (err) {
            console.error(err);
            setMessage({ text: '先月CSVの読み込みに失敗しました。', type: 'error' });
          }
          event.target.value = ''; 
        };
        reader.readAsText(file);
      };

      // === 設定の一括保存 / 読込 ===
      // 「職員設定」「人数設定」「時間設定」をまとめて1つのJSONファイルに保存し、
      // 別のPC・ブラウザでも同じ設定を復元できるようにする（シフト表そのものは含まない）。
      const SETTINGS_FORMAT = 'shift-app-settings';
      const SETTINGS_VERSION = 1;

      const handleExportSettings = () => {
        const data = {
          format: SETTINGS_FORMAT,
          version: SETTINGS_VERSION,
          exportedAt: new Date().toISOString(),
          // 職員設定
          staffData,
          nightTargets,
          // 人数設定
          dayTargets,
          morningTargets,
          earlyTargets,
          eveningTarget,
          eveningOverEarly,
          nightShiftCount,
          specificDayTargets,
          specificMorningTargets,
          // 時間設定
          shiftTimes,
          snapshotHours,
          snapshotWarningThreshold,
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const stamp = `${year}${String(month).padStart(2, '0')}`;
        link.href = url;
        link.setAttribute('download', `シフト設定_${stamp}.json`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setMessage({ text: '職員・人数・時間の設定をファイルに保存しました。', type: 'success' });
      };

      const handleImportSettings = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            let text = e.target.result;
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            const parsed = JSON.parse(text);
            if (!parsed || parsed.format !== SETTINGS_FORMAT) {
              throw new Error('形式が違います');
            }
            if (!confirm('職員設定・人数設定・時間設定を読み込んだ内容で上書きします。よろしいですか？\n（作成中のシフト表は保持されます。同じ氏名の職員は引き継がれます）')) {
              event.target.value = '';
              return;
            }

            const applied = [];

            // --- 職員設定 ---
            if (Array.isArray(parsed.staffData)) {
              // 同じ氏名の職員は「現在のID」を引き継ぐ。これにより作成中のシフト表が保持される。
              const idMap = {};
              parsed.staffData.forEach(s => {
                const existing = staffData.find(x => x.name === s.name);
                idMap[s.id] = existing ? existing.id : (s.id || 'staff_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7));
              });
              const newStaff = parsed.staffData.map(s => ({
                id: idMap[s.id],
                name: s.name || '職員',
                group: s.group || 'B',
                role: s.role || (['A', 'D'].includes(s.group) ? '夜勤' : '日勤'),
                forbiddenPairs: (s.forbiddenPairs || []).map(pid => idMap[pid] || pid),
                isCustomTime: !!s.isCustomTime,
                countWeight: Number(s.countWeight) === 1 ? 1 : 0.5,
                customStart: s.customStart || '09:00',
                customEnd: s.customEnd || '15:00',
                customOffDays: s.customOffDays !== undefined ? s.customOffDays : '',
                maxConsecutive: s.maxConsecutive !== undefined ? s.maxConsecutive : '',
                useWeekdayPattern: !!s.useWeekdayPattern,
                weekdayPattern: Array.isArray(s.weekdayPattern) && s.weekdayPattern.length === 7 ? s.weekdayPattern : ['','','','','','',''],
              }));
              setStaffData(newStaff);
              applied.push('職員設定');

              if (parsed.nightTargets && typeof parsed.nightTargets === 'object') {
                const nt = {};
                Object.keys(parsed.nightTargets).forEach(k => {
                  const mapped = idMap[k];
                  if (mapped) nt[mapped] = parsed.nightTargets[k];
                });
                setNightTargets(nt);
              }
            }

            // --- 人数設定 ---
            let countApplied = false;
            if (Array.isArray(parsed.dayTargets) && parsed.dayTargets.length === 7) { setDayTargets(parsed.dayTargets); countApplied = true; }
            if (Array.isArray(parsed.morningTargets) && parsed.morningTargets.length === 7) { setMorningTargets(parsed.morningTargets); countApplied = true; }
            if (Array.isArray(parsed.earlyTargets) && parsed.earlyTargets.length === 7) { setEarlyTargets(parsed.earlyTargets); countApplied = true; }
            if (typeof parsed.eveningTarget === 'number') { setEveningTarget(parsed.eveningTarget); countApplied = true; }
            if (typeof parsed.eveningOverEarly === 'boolean') { setEveningOverEarly(parsed.eveningOverEarly); countApplied = true; }
            if (typeof parsed.nightShiftCount === 'number') { setNightShiftCount(parsed.nightShiftCount); countApplied = true; }
            if (parsed.specificDayTargets && typeof parsed.specificDayTargets === 'object') { setSpecificDayTargets(parsed.specificDayTargets); countApplied = true; }
            if (parsed.specificMorningTargets && typeof parsed.specificMorningTargets === 'object') { setSpecificMorningTargets(parsed.specificMorningTargets); countApplied = true; }
            if (countApplied) applied.push('人数設定');

            // --- 時間設定 ---
            let timeApplied = false;
            if (parsed.shiftTimes && parsed.shiftTimes.DAY && parsed.shiftTimes.NIGHT) { setShiftTimes(parsed.shiftTimes); timeApplied = true; }
            if (Array.isArray(parsed.snapshotHours) && parsed.snapshotHours.length > 0) { setSnapshotHours(parsed.snapshotHours); timeApplied = true; }
            if (typeof parsed.snapshotWarningThreshold === 'number') { setSnapshotWarningThreshold(parsed.snapshotWarningThreshold); timeApplied = true; }
            if (timeApplied) applied.push('時間設定');

            setMessage({
              text: applied.length > 0
                ? `設定を読み込みました（${applied.join('・')}）。`
                : '読み込めた設定がありませんでした。ファイルの内容をご確認ください。',
              type: applied.length > 0 ? 'success' : 'error',
            });
          } catch (err) {
            console.error(err);
            setMessage({ text: '設定ファイルの読み込みに失敗しました。このアプリで保存したJSONファイルを選んでください。', type: 'error' });
          }
          event.target.value = '';
        };
        reader.readAsText(file);
      };

      // === 希望休インポート ===
      // Googleフォームで集めた希望休・希望勤務・NG勤務を、専用JSONから一括で取り込む。
      // 想定フォーマット（Apps Script が書き出す）:
      //   { format:'shift-app-requests', version:1, year:2026, month:10,
      //     requests:[ { name:'山田 太郎',
      //                  days:{ '3':{requested:'×'}, '10':{requested:'有'}, '15':{ngs:['当']} },
      //                  note:'' } ],
      //     warnings:[ '…' ] }
      // 氏名で職員マスタと照合するため、職員マスタ（staffData）には一切手を触れない。
      // これにより「CSV読込のように職員設定ごと上書きされる」事故が起きない。
      const REQUESTS_FORMAT = 'shift-app-requests';

      // 氏名照合用の正規化：全角/半角スペースを除去して比較する（「山田太郎」と「山田 太郎」を同一視）
      // 「田中,A,○」のように名簿CSVの1行がそのまま氏名になっている場合は、最初のカンマ／タブより前だけを使う
      const normalizeName = (s) => String(s == null ? '' : s).replace(/^﻿/, '').split(/[,，\t]/)[0].replace(/[\s　]/g, '');

      const handleImportRequests = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            let text = e.target.result;
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            const parsed = JSON.parse(text);
            if (!parsed || parsed.format !== REQUESTS_FORMAT) throw new Error('形式が違います');
            if (!Array.isArray(parsed.requests)) throw new Error('requests がありません');

            // --- 年月の食い違いチェック ---
            if (parsed.year && parsed.month && (parsed.year !== year || parsed.month !== month)) {
              if (!confirm(`このファイルは ${parsed.year}年${parsed.month}月 分です。\n現在アプリで開いているのは ${year}年${month}月 です。\n\nこのまま取り込みますか？`)) {
                event.target.value = '';
                return;
              }
            }

            if (!confirm('希望休を取り込みます。\n\nファイルに含まれる職員については、既存の「希望シフト・NG設定」がこの内容で置き換わります（該当セルのロックも解除→再設定されます）。\n職員設定・人数設定・時間設定には影響しません。\n\nよろしいですか？')) {
              event.target.value = '';
              return;
            }

            const byName = {};
            staffData.forEach(s => { byName[normalizeName(s.name)] = s; });

            const nextRules = JSON.parse(JSON.stringify(shiftRules));
            const nextSchedule = JSON.parse(JSON.stringify(schedule));
            const nextLocked = JSON.parse(JSON.stringify(lockedCells));

            const unknown = [];      // 職員マスタに無い氏名
            const conflicts = [];    // 既に別のシフトが入っていたセル
            const outOfRange = [];   // 当月の範囲外の日付
            const submitted = {};    // 回答があった職員ID
            let applied = 0;

            parsed.requests.forEach(r => {
              const staff = byName[normalizeName(r && r.name)];
              if (!staff) { if (r && r.name) unknown.push(String(r.name)); return; }
              submitted[staff.id] = true;

              // --- この職員の既存の希望・NGを一度クリア ---
              // 再取込したときに、前回の希望が残って二重にロックされるのを防ぐ。
              if (nextRules[staff.id]) {
                Object.keys(nextRules[staff.id]).forEach(dKey => {
                  const rule = nextRules[staff.id][dKey] || {};
                  if (rule.requested && nextSchedule[staff.id] && nextSchedule[staff.id][dKey] === rule.requested) {
                    nextSchedule[staff.id][dKey] = SHIFT_TYPES.NONE;
                  }
                  if (nextLocked[staff.id]) nextLocked[staff.id][dKey] = false;
                });
                delete nextRules[staff.id];
              }

              const days = (r && r.days) || {};
              Object.keys(days).forEach(dKey => {
                const d = parseInt(dKey, 10);
                if (!(d >= 1 && d <= daysInMonth)) { outOfRange.push(`${staff.name} ${dKey}`); return; }

                const entry = days[dKey] || {};
                const requested = (entry.requested && SHIFT_ORDER.includes(entry.requested)) ? entry.requested : '';
                const ngs = Array.isArray(entry.ngs) ? entry.ngs.filter(v => v && SHIFT_ORDER.includes(v)) : [];
                if (!requested && ngs.length === 0) return;

                if (!nextRules[staff.id]) nextRules[staff.id] = {};
                // 希望が休み系のときは NG を持たせない（意味が重複するため）
                nextRules[staff.id][d] = { requested, ngs: requested ? [] : ngs };

                if (requested) {
                  if (!nextSchedule[staff.id]) nextSchedule[staff.id] = {};
                  const cur = nextSchedule[staff.id][d];
                  if (cur && cur !== SHIFT_TYPES.NONE && cur !== requested) {
                    conflicts.push(`${staff.name} ${d}日（${cur} → ${requested}）`);
                  }
                  nextSchedule[staff.id][d] = requested;
                  if (!nextLocked[staff.id]) nextLocked[staff.id] = {};
                  nextLocked[staff.id][d] = true;
                }
                applied++;
              });
            });

            const missing = staffData.filter(s => !submitted[s.id]).map(s => s.name);

            saveHistory();
            setShiftRules(nextRules);
            setSchedule(nextSchedule);
            setLockedCells(nextLocked);
            setScheduleStep(step);
            setRequestReport({
              applied,
              staffCount: Object.keys(submitted).length,
              unknown,
              missing,
              conflicts,
              outOfRange,
              warnings: Array.isArray(parsed.warnings) ? parsed.warnings : [],
              ym: (parsed.year && parsed.month) ? `${parsed.year}年${parsed.month}月` : '',
            });
            setMessage({
              text: `希望休を取り込みました（${Object.keys(submitted).length}名 / ${applied}件）。内容は下の一覧で確認してください。`,
              type: 'success',
            });
          } catch (err) {
            console.error(err);
            setMessage({ text: '希望休ファイルの読み込みに失敗しました。集計スクリプトが書き出したJSONファイルを選んでください。', type: 'error' });
          }
          event.target.value = '';
        };
        reader.readAsText(file);
      };

      // 職員マスタの氏名一覧をコピー用に書き出す（Googleフォームの氏名プルダウン／職員マスタシート用）
      const handleExportStaffNames = () => {
        let csv = '﻿氏名,グループ,夜勤\n';
        staffData.forEach(s => {
          csv += `${s.name},${s.group},${['A', 'D'].includes(s.group) ? '○' : ''}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', '職員名簿.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setMessage({ text: '職員名簿CSVを書き出しました。Googleスプレッドシートの「職員マスタ」シートに貼り付けてください。', type: 'success' });
      };

      const handleAddStaff = () => {
        const id = 'staff_' + Date.now();
        setStaffData([...staffData, { id, name: '新規職員', group: 'B', role: '日勤', forbiddenPairs: [], isCustomTime: false, countWeight: 0.5, customStart: '09:00', customEnd: '15:00', customOffDays: '', maxConsecutive: '', useWeekdayPattern: false, weekdayPattern: ['','','','','','',''] }]);
      };

      const handleRemoveStaff = (id) => {
        if (confirm('この職員をリストから削除しますか？')) {
          setStaffData(staffData.filter(s => s.id !== id).map(s => {
             if (s.forbiddenPairs?.includes(id)) {
                 return { ...s, forbiddenPairs: s.forbiddenPairs.filter(pId => pId !== id) };
             }
             return s;
          }));
        }
      };

      const handleUpdateStaff = (id, field, value) => {
        const nextStaff = staffData.map(s => {
          if (s.id === id) {
            const updates = { [field]: value };
            if (field === 'group') {
              if (value === 'A' || value === 'D') updates.role = '夜勤';
              else if (value === 'B') updates.role = '日勤';
              else if (value === 'C') updates.role = '日勤';
            }
            if (field === 'isCustomTime' && value === true) {
              updates.group = 'C';
              updates.role = '日勤';
            }
            return { ...s, ...updates };
          }
          return s;
        });
        setStaffData(nextStaff);

        // 曜日固定に関わる変更は、その場でシフト表へ反映して結果が見えるようにする
        if (['useWeekdayPattern', 'weekdayPattern', 'isCustomTime'].includes(field)) {
          const target = nextStaff.find(s => s.id === id);
          const active = target && target.isCustomTime && target.useWeekdayPattern && Array.isArray(target.weekdayPattern);
          setSchedule(prev => {
            const next = JSON.parse(JSON.stringify(prev));
            if (!next[id]) next[id] = {};
            calendar.forEach(c => {
              if (lockedCells[id]?.[c.date]) return;               // 手動ロックは触らない
              if (shiftRules[id]?.[c.date]?.requested) return;     // 希望シフトも触らない
              // 固定した曜日だけを書き込む。指定を外した／OFFにした曜日は、
              // 既存のシフトを消さずに「自動作成で動かせる状態」に戻すだけにする。
              const fix = active ? (target.weekdayPattern[c.day] || '') : '';
              if (fix) next[id][c.date] = (fix === 'off') ? SHIFT_TYPES.OFF : SHIFT_TYPES.DAY;
            });
            return next;
          });
        }
      };

      const handleToggleForbiddenPair = (id1, id2) => {
        setStaffData(prev => prev.map(s => {
          if (s.id === id1) {
            const pairs = s.forbiddenPairs || [];
            return { ...s, forbiddenPairs: pairs.includes(id2) ? pairs.filter(id => id !== id2) : [...pairs, id2] };
          }
          if (s.id === id2) {
            const pairs = s.forbiddenPairs || [];
            return { ...s, forbiddenPairs: pairs.includes(id1) ? pairs.filter(id => id !== id1) : [...pairs, id1] };
          }
          return s;
        }));
      };

      const handleShiftChange = (staffId, day, value) => {
        saveHistory(); 
        setSchedule(prev => ({
          ...prev,
          [staffId]: { ...prev[staffId], [day]: value }
        }));
        setScheduleStep(step);
      };

      const handleSaveRules = () => {
        const { staffId, day } = selectingShift;
        saveHistory();
        
        setShiftRules(prev => ({
          ...prev,
          [staffId]: {
            ...(prev[staffId] || {}),
            [day]: { requested: tempRequested, ngs: tempNgs }
          }
        }));

        if (tempRequested) {
          setSchedule(prev => ({
            ...prev,
            [staffId]: { ...prev[staffId], [day]: tempRequested }
          }));
        }

        setSelectingShift(null);
      };

      const toggleLock = (staffId, day) => {
        saveHistory(); 
        setLockedCells(prev => {
          const next = JSON.parse(JSON.stringify(prev)); 
          if (!next[staffId]) next[staffId] = {};
          next[staffId][day] = !next[staffId][day];
          return next;
        });
        setScheduleStep(step);
      };

      const handleLockAll = () => {
        saveHistory();
        setLockedCells(prev => {
          const next = JSON.parse(JSON.stringify(prev)); 
          staffData.forEach(staff => {
            if (!next[staff.id]) next[staff.id] = {};
            calendar.forEach(c => {
              const shift = schedule[staff.id]?.[c.date];
              if (shift && shift !== SHIFT_TYPES.NONE) {
                next[staff.id][c.date] = true;
              }
            });
          });
          return next;
        });
        setScheduleStep(step);
        setMessage({ text: '入力されているシフトをすべてロックしました。', type: 'success' });
      };

      const handleUnlockAll = () => {
        if (confirm('すべてのロックを解除しますか？')) {
          saveHistory();
          setLockedCells({});
          setScheduleStep(step);
          setMessage({ text: 'すべてのロックを解除しました。', type: 'info' });
        }
      };

      const handlePrevMonthNightSet = (staffIds) => {
        saveHistory();
        setPrevMonthNightStaff(staffIds);
        const newSchedule = { ...schedule };
        staffData.forEach(s => {
          if (newSchedule[s.id] && newSchedule[s.id][1] === SHIFT_TYPES.NIGHT_END && !lockedCells[s.id]?.[1]) {
            newSchedule[s.id][1] = SHIFT_TYPES.NONE;
          }
        });
        staffIds.forEach(id => {
          if (newSchedule[id]) {
            if (!lockedCells[id]?.[1]) newSchedule[id][1] = SHIFT_TYPES.NIGHT_END;
            if (!lockedCells[id]?.[2]) newSchedule[id][2] = SHIFT_TYPES.OFF;
          }
        });
        setSchedule(newSchedule);
        setScheduleStep(step);
      };
      
      const togglePrevNightStaff = (staffId) => {
        const current = prevMonthNightStaff.includes(staffId);
        let newIds;
        if (current) {
          newIds = prevMonthNightStaff.filter(id => id !== staffId);
        } else {
          newIds = [...prevMonthNightStaff, staffId];
        }
        handlePrevMonthNightSet(newIds);
      };

      const handleTargetChange = (staffId, value) => {
        setNightTargets(prev => ({
          ...prev,
          [staffId]: value === '' ? '' : Number(value)
        }));
      };

      // --- ドラッグ＆ドロップ並び替え用ハンドラ ---
      const handleDragStart = (e, index) => {
        setDraggedIndex(index);
        e.dataTransfer.effectAllowed = "move";
      };

      const handleDragEnter = (e, index) => {
        e.preventDefault();
        if (index !== dragOverIndex) {
            setDragOverIndex(index);
        }
      };

      const handleDragEnd = () => {
        setDraggedIndex(null);
        setDragOverIndex(null);
      };

      const handleDrop = (e, index) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === index) return;
        
        saveHistory();
        const newStaffData = [...staffData];
        const draggedItem = newStaffData[draggedIndex];
        newStaffData.splice(draggedIndex, 1);
        newStaffData.splice(index, 0, draggedItem);
        
        setStaffData(newStaffData);
        setDraggedIndex(null);
        setDragOverIndex(null);
      };

      const moveStaff = (index, direction) => {
        if (direction === -1 && index === 0) return;
        if (direction === 1 && index === staffData.length - 1) return;
        
        saveHistory();
        const newStaffData = [...staffData];
        const targetIndex = index + direction;
        const item = newStaffData[index];
        newStaffData.splice(index, 1);
        newStaffData.splice(targetIndex, 0, item);
        setStaffData(newStaffData);
      };

      // --- 曜日固定（非常勤のみ）---
      // 非常勤で「曜日固定」をONにすると、曜日ごとに 出勤(work) / 休み(off) / 指定なし('') を設定できる。
      // 設定された曜日は自動作成で動かさない（ロック扱い）ので、必ずその通りに組まれる。
      const weekdayFixMap = useMemo(() => {
        const m = {};
        staffData.forEach(s => {
          if (s.isCustomTime && s.useWeekdayPattern && Array.isArray(s.weekdayPattern)) {
            m[s.id] = s.weekdayPattern;
          }
        });
        return m;
      }, [staffData]);

      // その職員・その日の曜日固定の指定を返す（'work' / 'off' / ''）
      const getWeekdayFix = (staffId, day) => {
        const pat = weekdayFixMap[staffId];
        if (!pat) return '';
        const info = calendar[day - 1];
        if (!info) return '';
        return pat[info.day] || '';
      };

      // 曜日固定をスケジュールに反映する（手動ロックが優先）。生成前に必ず呼ぶ。
      const applyWeekdayPattern = (sched) => {
        staffData.forEach(s => {
          const pat = weekdayFixMap[s.id];
          if (!pat) return;
          if (!sched[s.id]) sched[s.id] = {};
          calendar.forEach(c => {
            const fix = pat[c.day] || '';
            if (!fix) return;
            if (lockedCells[s.id]?.[c.date]) return;            // 手動ロックが優先
            const req = shiftRules[s.id]?.[c.date]?.requested;  // 希望シフトも優先
            if (req) return;
            sched[s.id][c.date] = (fix === 'off') ? SHIFT_TYPES.OFF : SHIFT_TYPES.DAY;
          });
        });
        return sched;
      };

      // --- アルゴリズム補助 ---

      const isNg = (staffId, day, shiftType) => {
        return (shiftRules[staffId]?.[day]?.ngs || []).includes(shiftType);
      };

      const isCellLocked = (staffId, day, currentSched) => {
        if (lockedCells[staffId]?.[day]) return true;
        const requested = shiftRules[staffId]?.[day]?.requested;
        if (requested && currentSched[staffId]?.[day] === requested) return true;
        // 曜日固定のセルは自動作成で動かさない
        if (getWeekdayFix(staffId, day)) return true;
        return false;
      };

      const isWorkDay = (shift) => {
        return shift && ![SHIFT_TYPES.OFF, SHIFT_TYPES.PAID, SHIFT_TYPES.REFRESH].includes(shift);
      };
      
      const isPotentialWorkDay = (shift) => {
        return shift === SHIFT_TYPES.NONE || isWorkDay(shift);
      };

      // --- 勤務間隔（インターバル）---
      // 「退勤が遅い日の翌日に、出勤が早い勤務」を禁止するための判定。
      // 既定15時間。設定時刻(早7:30-16:00 / 日8:30-17:00 / 遅10:30-19:00)では次のようになる：
      //   日勤(17:00)→早番(7:30)=14.5h ✗ / 遅番(19:00)→日勤(8:30)=13.5h ✗ / 遅番(19:00)→早番(7:30)=12.5h ✗
      //   日勤→日勤(15.5h) ○ / 早番→早番(15.5h) ○ / 遅番→遅番(15.5h) ○ / 日勤→遅番(17.5h) ○
      const MIN_REST_HOURS = 15;
      const shiftEndHour = (v) => {
        if (v === SHIFT_TYPES.EARLY) return timeToDecimal(shiftTimes.EARLY.end);
        if (v === SHIFT_TYPES.DAY || v === SHIFT_TYPES.TRAINING) return timeToDecimal(shiftTimes.DAY.end);
        if (v === SHIFT_TYPES.EARLY_DAY) return timeToDecimal(shiftTimes.DAY.end);
        if (v === SHIFT_TYPES.LATE) return timeToDecimal(shiftTimes.LATE.end);
        if (v === SHIFT_TYPES.DAY_LATE) return timeToDecimal(shiftTimes.LATE.end);
        if (v === SHIFT_TYPES.NIGHT_END) return timeToDecimal(shiftTimes.NIGHT.end);
        return null; // 休み・有休・リフレッシュ・空欄は制約なし
      };
      const shiftStartHour = (v) => {
        if (v === SHIFT_TYPES.EARLY || v === SHIFT_TYPES.EARLY_DAY) return timeToDecimal(shiftTimes.EARLY.start);
        if (v === SHIFT_TYPES.DAY || v === SHIFT_TYPES.DAY_LATE || v === SHIFT_TYPES.TRAINING) return timeToDecimal(shiftTimes.DAY.start);
        if (v === SHIFT_TYPES.LATE) return timeToDecimal(shiftTimes.LATE.start);
        if (v === SHIFT_TYPES.NIGHT) return timeToDecimal(shiftTimes.NIGHT.start);
        return null;
      };
      // 前日 prevShift の翌日に nextShift を組めるか（休息時間が足りるか）
      const restOk = (prevShift, nextShift) => {
        const e = shiftEndHour(prevShift);
        const s = shiftStartHour(nextShift);
        if (e === null || s === null) return true;
        return (24 - e + s) >= MIN_REST_HOURS - 1e-9;
      };

      // --- 連勤上限 ---
      // 非常勤(個別時間ON)のみ「連勤可能日数」を1〜4で指定できる。
      // 指定が無い職員は従来どおり「5連勤以上は避ける」＝上限4連勤。
      const getMaxRun = (staff) => {
        if (staff && staff.isCustomTime) {
          const v = parseInt(staff.maxConsecutive, 10);
          if (v >= 1 && v <= 4) return v;
        }
        return 4;
      };
      const getMaxRunById = (staffId) => getMaxRun(staffData.find(s => s.id === staffId));

      // 連勤上限 m のとき、その月に取らざるを得ない最少の休み日数。
      // (m 日勤務 + 1 日休み) の繰り返しが最大稼働なので、休みは floor(N/(m+1)) 以上必要。
      const minOffDaysForRun = (m, days) => {
        if (!(m >= 1)) return 0;
        const blocks = Math.floor(days / (m + 1));
        const rem = days % (m + 1);
        const maxWork = blocks * m + Math.min(rem, m);
        return days - maxWork;
      };

      const getDayShiftCount = (day, currentSchedule) => {
        let count = 0;
        staffData.forEach(s => {
          if (currentSchedule[s.id] && currentSchedule[s.id][day] === SHIFT_TYPES.DAY) {
            count += headWeight(s);
          }
        });
        return count;
      };

      const getStaffCountAtHour = (day, hour, currentSchedule) => {
        let count = 0;
        staffData.forEach(staff => {
          const shift = currentSchedule[staff.id]?.[day];
          if (!shift || [SHIFT_TYPES.NONE, SHIFT_TYPES.OFF, SHIFT_TYPES.PAID, SHIFT_TYPES.REFRESH].includes(shift)) return;

          let start = 0;
          let end = 0;

          if (shift === SHIFT_TYPES.NIGHT_END) {
            start = 0;
            end = timeToDecimal(shiftTimes.NIGHT.end);
          } else if (staff.isCustomTime && shift !== SHIFT_TYPES.NIGHT) {
            start = timeToDecimal(staff.customStart);
            end = timeToDecimal(staff.customEnd);
          } else if (shift === SHIFT_TYPES.DAY || shift === SHIFT_TYPES.TRAINING) {
            start = timeToDecimal(shiftTimes.DAY.start);
            end = timeToDecimal(shiftTimes.DAY.end);
          } else if (shift === SHIFT_TYPES.EARLY) {
            start = timeToDecimal(shiftTimes.EARLY.start);
            end = timeToDecimal(shiftTimes.EARLY.end);
          } else if (shift === SHIFT_TYPES.EARLY_DAY) {
            start = timeToDecimal(shiftTimes.EARLY.start); // 早番出勤
            end = timeToDecimal(shiftTimes.DAY.end);       // 日勤退勤
          } else if (shift === SHIFT_TYPES.LATE) {
            start = timeToDecimal(shiftTimes.LATE.start);
            end = timeToDecimal(shiftTimes.LATE.end);
          } else if (shift === SHIFT_TYPES.DAY_LATE) {
            start = timeToDecimal(shiftTimes.DAY.start);   // 日勤出勤
            end = timeToDecimal(shiftTimes.LATE.end);      // 遅番退勤
          } else if (shift === SHIFT_TYPES.NIGHT) {
            start = timeToDecimal(shiftTimes.NIGHT.start);
            end = 24;
          } else {
            return;
          }

          if (Math.max(hour, start) < Math.min(hour + 1, end)) {
            count++;
          }
        });
        return count;
      };

      // 優先夜勤配置（リセット機能付き）
      const handlePriorityNightShift = (staffId) => {
        saveHistory();
        const staff = staffData.find(s => s.id === staffId);
        if (!['A', 'D'].includes(staff?.group)) return;

        const newSchedule = JSON.parse(JSON.stringify(schedule));
        const newLockedCells = JSON.parse(JSON.stringify(lockedCells));
        
        // 既存の夜勤（手動設定の希望シフト以外）をリセットして再配置可能にする
        let resetCount = 0;
        for (let d = 1; d <= daysInMonth; d++) {
            if (newSchedule[staffId][d] === SHIFT_TYPES.NIGHT) {
                const requested = shiftRules[staffId]?.[d]?.requested;
                if (requested !== SHIFT_TYPES.NIGHT) {
                    newSchedule[staffId][d] = SHIFT_TYPES.NONE;
                    if (newLockedCells[staffId]) {
                        newLockedCells[staffId][d] = false;
                    }
                    resetCount++;
                }
            }
        }

        const groupNight = staffData.filter(s => ['A', 'D'].includes(s.group));
        const averageTarget = totalNightSlots / (groupNight.length || 1); 
        const target = (typeof nightTargets[staffId] === 'number' && nightTargets[staffId] > 0) ? nightTargets[staffId] : averageTarget;

        let currentCount = 0;
        for (let d = 1; d <= daysInMonth; d++) {
            if (newSchedule[staffId][d] === SHIFT_TYPES.NIGHT) {
                currentCount++;
            }
        }

        let needed = Math.round(target) - currentCount;
        if (needed <= 0) {
            setMessage({ text: `${staff.name}の夜勤は希望などで既に目標回数（${Math.round(target)}回）に達しています。`, type: 'info' });
            setSchedule(newSchedule);
            setLockedCells(newLockedCells);
            return;
        }

        const nightSlotsAvail = {};
        for (let d = 1; d <= daysInMonth; d++) {
            let count = 0;
            staffData.forEach(s => {
                if (newSchedule[s.id][d] === SHIFT_TYPES.NIGHT) count++;
            });
            nightSlotsAvail[d] = nightShiftCount - count;
        }

        let candidates = [];
        for (let d = 1; d <= daysInMonth; d++) {
            if (nightSlotsAvail[d] <= 0) continue; 
            if (newSchedule[staffId][d] !== SHIFT_TYPES.NONE && newSchedule[staffId][d] !== SHIFT_TYPES.NIGHT) {
                 if (isCellLocked(staffId, d, newSchedule)) continue; 
            }
            if (newSchedule[staffId][d] === SHIFT_TYPES.NIGHT) continue; 
            if (isCellLocked(staffId, d, newSchedule)) continue; 
            if (isNg(staffId, d, SHIFT_TYPES.NIGHT)) continue; 

            let forbidden = false;
            staffData.forEach(s => {
                if (newSchedule[s.id][d] === SHIFT_TYPES.NIGHT) {
                    if (staff.forbiddenPairs?.includes(s.id) || s.forbiddenPairs?.includes(staffId)) {
                        forbidden = true;
                    }
                }
            });
            if (forbidden) continue;

            const prevShift = getShiftSafe(staffId, d - 1, newSchedule);
            if (prevShift === SHIFT_TYPES.NIGHT || prevShift === SHIFT_TYPES.NIGHT_END) continue;

            const prevPrevShift = getShiftSafe(staffId, d - 2, newSchedule);
            if (prevPrevShift === SHIFT_TYPES.NIGHT) continue;

            let recentNightCount = 0;
            for (let k = 1; k <= 5; k++) {
                if (getShiftSafe(staffId, d - k, newSchedule) === SHIFT_TYPES.NIGHT) recentNightCount++;
            }
            if (recentNightCount >= 2) continue;

            const nextDay = d + 1;
            if (nextDay <= daysInMonth) {
                 const nextShift = newSchedule[staffId][nextDay];
                 if (nextShift !== SHIFT_TYPES.NONE && nextShift !== SHIFT_TYPES.NIGHT_END && isCellLocked(staffId, nextDay, newSchedule)) continue;
            }

            const nextNextDay = d + 2;
            if (nextNextDay <= daysInMonth) {
                 const nextNextShift = newSchedule[staffId][nextNextDay];
                 const forbiddenNextNext = [SHIFT_TYPES.DAY, SHIFT_TYPES.EARLY, SHIFT_TYPES.EARLY_DAY,
                                            SHIFT_TYPES.LATE, SHIFT_TYPES.DAY_LATE, SHIFT_TYPES.TRAINING];
                 if (staff.group === 'D') forbiddenNextNext.push(SHIFT_TYPES.NIGHT); 
                 if (forbiddenNextNext.includes(nextNextShift) && isCellLocked(staffId, nextNextDay, newSchedule)) continue;
            }

            candidates.push(d);
        }

        candidates.sort(() => Math.random() - 0.5);

        let assignedCount = 0;
        for (const d of candidates) {
            if (needed <= 0) break;
            
            const p1 = getShiftSafe(staffId, d-1, newSchedule);
            if (p1 === SHIFT_TYPES.NIGHT || p1 === SHIFT_TYPES.NIGHT_END) continue;
            const p2 = getShiftSafe(staffId, d-2, newSchedule);
            if (p2 === SHIFT_TYPES.NIGHT) continue;

            let rCount = 0;
            for (let k=1; k<=5; k++) {
               if (getShiftSafe(staffId, d-k, newSchedule) === SHIFT_TYPES.NIGHT) rCount++;
            }
            if (rCount >= 2) continue;

            const n1 = (d+1 <= daysInMonth) ? newSchedule[staffId][d+1] : null;
            if (n1 === SHIFT_TYPES.NIGHT || n1 === SHIFT_TYPES.NIGHT_END) continue;
            const n2 = (d+2 <= daysInMonth) ? newSchedule[staffId][d+2] : null;
            if (n2 === SHIFT_TYPES.NIGHT) continue; 
            
            let fCount = 0;
            for (let k=1; k<=5; k++) {
               if (d+k <= daysInMonth && newSchedule[staffId][d+k] === SHIFT_TYPES.NIGHT) fCount++;
            }
            if (fCount >= 2) continue;

            newSchedule[staffId][d] = SHIFT_TYPES.NIGHT;
            if (!newLockedCells[staffId]) newLockedCells[staffId] = {};
            newLockedCells[staffId][d] = true;
            
            nightSlotsAvail[d]--;
            needed--;
            assignedCount++;
        }

        setSchedule(newSchedule);
        setLockedCells(newLockedCells);
        setScheduleStep(step);
        
        if (assignedCount > 0) {
            setMessage({ text: `${staff.name}に夜勤を ${assignedCount} 回優先配置し、ロックしました。${resetCount > 0 ? '（別パターンを生成しました）' : ''}`, type: 'success' });
        } else {
            setMessage({ text: `${staff.name}に夜勤を配置できる日がありませんでした。休みの調整が必要です。`, type: 'error' });
        }
      };

      const preFillDayShiftsForCriticalDays = (isRetry = false) => {
        saveHistory();
        const newSchedule = applyWeekdayPattern(JSON.parse(JSON.stringify(schedule)));
        
        if (isRetry) {
            staffData.forEach(s => {
                for (let d = 1; d <= daysInMonth; d++) {
                    if (newSchedule[s.id][d] === SHIFT_TYPES.DAY && !isCellLocked(s.id, d, newSchedule)) {
                        newSchedule[s.id][d] = SHIFT_TYPES.NONE;
                    }
                }
            });
        }

        let blockedDaysCount = 0;

        for (let d = 1; d <= daysInMonth; d++) {
          const dayInfo = calendar[d - 1];
          const targetDayCount = getTargetForDay(d, dayInfo.day);
          
          let availableForDayCount = 0; 
          let assignedDayStaff = 0;     
          
          let dayCandidates = [];       

          staffData.forEach(staff => {
            const shift = newSchedule[staff.id][d];
            const locked = isCellLocked(staff.id, d, newSchedule);
            const prevShift = getShiftSafe(staff.id, d - 1, newSchedule);
            
            const isDayType = [SHIFT_TYPES.DAY, SHIFT_TYPES.EARLY, SHIFT_TYPES.EARLY_DAY,
                               SHIFT_TYPES.LATE, SHIFT_TYPES.DAY_LATE].includes(shift);

            if (isDayType) {
                assignedDayStaff += headWeight(staff);
            } else if (shift === SHIFT_TYPES.NONE && !locked) {
                let canWorkDay = true;

                if (prevShift === SHIFT_TYPES.NIGHT || prevShift === SHIFT_TYPES.NIGHT_END) {
                    canWorkDay = false;
                }
                if (isNg(staff.id, d, SHIFT_TYPES.DAY)) canWorkDay = false;
                
                if (canWorkDay) {
                    availableForDayCount += headWeight(staff);
                    dayCandidates.push(staff);
                }
            }
          });

          const nightNeed = nightShiftCount;
          const nightEndNeed = (d === 1) ? prevMonthNightStaff.length : nightShiftCount;

          const A = availableForDayCount - (nightNeed + nightEndNeed);
          const B = targetDayCount - assignedDayStaff;

          if (A - B <= 1 && B > 0) {
            blockedDaysCount++;
            
            dayCandidates.sort((a, b) => {
               const groupScore = (g) => {
                   if (g === 'C') return 3;
                   if (g === 'B') return 2;
                   return 1;
               };
               return groupScore(b.group) - groupScore(a.group) + (Math.random() * 1.0 - 0.5);
            });

            let currentNeededDay = B;
            for (const staff of dayCandidates) {
                if (currentNeededDay <= 0) break;
                if (newSchedule[staff.id][d] === SHIFT_TYPES.NONE) {
                    newSchedule[staff.id][d] = SHIFT_TYPES.DAY;
                    currentNeededDay -= headWeight(staff);
                }
            }
          }
        }

        setSchedule(newSchedule);
        setScheduleStep(step);
        if (blockedDaysCount > 0) {
            setMessage({ text: `Step 1: ${isRetry ? '別パターンで' : ''}${blockedDaysCount}日分の日勤を優先確保しました（確保条件 A-B<=1）。`, type: 'success' });
        } else {
            setMessage({ text: `Step 1: 確保条件(A-B<=1)に該当する日はありませんでした。そのまま次へ進めます。`, type: 'info' });
        }
      };

      // === 夜勤生成（バックトラッキング方式） ===
      // 解が存在する限り必ず全枠を充足する完全探索。各日に必要な夜勤枠を埋め、
      // 行き詰まったら直前の選択を取り消して別の組合せを試す。
      // 計算量爆発を防ぐためノード数/時間の予算を設ける（予算内で解が出なければ
      // それまでに得た最良の部分解を採用）。
      const generateNightShifts = (isRetry = false) => {
        saveHistory();

        const cleanSchedule = applyWeekdayPattern(JSON.parse(JSON.stringify(schedule)));
        const groupNight = staffData.filter(s => ['A', 'D'].includes(s.group));

        // --- 別パターン生成用の変異シード ---
        // 探索は完全に決定論的（乱数は全て seed 由来）なので、同じ入力なら毎回同じ解になる。
        // 「再配置」で別解を出すには、探索の seed 自体を変える必要がある。
        // 「自動」= 0 にリセット（基準解へ戻る）／「再配置」= +1（別解を探す）。
        const variant = isRetry ? (nightVariantRef.current + 1) : 0;
        nightVariantRef.current = variant;

        // 現在の夜勤配置のシグネチャ（再配置時に「前と違う解」を選ぶための比較用）
        const nightSignature = (sched) => groupNight.map(s => {
            let r = '';
            for (let d = 1; d <= daysInMonth; d++) r += (sched[s.id][d] === SHIFT_TYPES.NIGHT ? '1' : '0');
            return r;
        }).join('|');
        const currentSig = nightSignature(cleanSchedule);

        // ロックされていない自動配置分（日勤・夜勤・明け）をリセット
        // ※ 明け(NIGHT_END)もリセットしないと、再度「自動」を押した際に前回の明けが残り、
        //   当→明→明 のような不正配置や孤立した明けが発生する。
        //   ロック済み（前月夜勤の明け等）は残す。
        staffData.forEach(s => {
            for (let d = 1; d <= daysInMonth; d++) {
                const cur = cleanSchedule[s.id][d];
                const isDayType = [SHIFT_TYPES.DAY, SHIFT_TYPES.EARLY, SHIFT_TYPES.EARLY_DAY,
                                   SHIFT_TYPES.LATE, SHIFT_TYPES.DAY_LATE].includes(cur);
                const isNightType = cur === SHIFT_TYPES.NIGHT;
                const isNightEndType = cur === SHIFT_TYPES.NIGHT_END;

                if ((isDayType || isNightType || isNightEndType) && !isCellLocked(s.id, d, cleanSchedule)) {
                    cleanSchedule[s.id][d] = SHIFT_TYPES.NONE;
                }
            }
        });

        // ロックされた夜勤の翌日に明けを補完（リセットで明けが消えた場合に備える）。
        // ロック夜勤は buildAssignment で再配置されないため、ここで明けを保証する。
        staffData.forEach(s => {
            for (let d = 1; d <= daysInMonth; d++) {
                if (cleanSchedule[s.id][d] === SHIFT_TYPES.NIGHT && isCellLocked(s.id, d, cleanSchedule)) {
                    const nd = d + 1;
                    if (nd <= daysInMonth
                        && cleanSchedule[s.id][nd] === SHIFT_TYPES.NONE
                        && !isCellLocked(s.id, nd, cleanSchedule)) {
                        cleanSchedule[s.id][nd] = SHIFT_TYPES.NIGHT_END;
                    }
                }
            }
        });

        const averageTarget = totalNightSlots / (groupNight.length || 1);

        // --- 日勤充足可能性チェック（夜勤・明け配置後も日勤目標を満たせるか） ---
        const canFillDayShifts = (dayToCheck, currentSched) => {
            if (dayToCheck < 1 || dayToCheck > daysInMonth) return true;
            const target = getTargetForDay(dayToCheck, calendar[dayToCheck - 1].day);
            let available = 0;

            staffData.forEach(st => {
                const shift = currentSched[st.id][dayToCheck];
                const locked = isCellLocked(st.id, dayToCheck, currentSched);
                const prevShift = getShiftSafe(st.id, dayToCheck - 1, currentSched);

                if ([SHIFT_TYPES.DAY, SHIFT_TYPES.EARLY, SHIFT_TYPES.EARLY_DAY,
                     SHIFT_TYPES.LATE, SHIFT_TYPES.DAY_LATE].includes(shift)) {
                    available += headWeight(st);
                } else if (shift === SHIFT_TYPES.NONE && !locked) {
                    if (prevShift !== SHIFT_TYPES.NIGHT && prevShift !== SHIFT_TYPES.NIGHT_END && !isNg(st.id, dayToCheck, SHIFT_TYPES.DAY)) {
                        available += headWeight(st);
                    }
                }
            });
            return available >= target;
        };

        // 朝ピーク帯(入浴帯)に出せる人数の見積り。
        // 「もう朝在籍が確定している人」＋「まだ空いていて日勤に回せる人」を数える。
        // 当(夜勤中)・明け・明けの翌日(自動公休)・ロック済みの非朝シフト(×/有/リ/研修)は数えない。
        const morningAvailOn = (day, sched) => {
            if (day < 1 || day > daysInMonth) return Infinity;
            let avail = 0;
            staffData.forEach(st => {
                const v = sched[st.id][day];
                if (MORNING_PRESENT_SHIFTS.includes(v)) { avail += headWeight(st); return; }
                if (v !== SHIFT_TYPES.NONE) return;                       // ×/有/リ/研修/当/明 など
                if (isCellLocked(st.id, day, sched)) return;
                const p1 = getShiftSafe(st.id, day - 1, sched);
                if (p1 === SHIFT_TYPES.NIGHT) return;                     // 夜勤中（翌日は明け）
                if (p1 === SHIFT_TYPES.NIGHT_END) return;                 // 明けの翌日は休養
                if (isNg(st.id, day, SHIFT_TYPES.DAY)) return;
                avail += headWeight(st);
            });
            return avail;
        };

        // s に d の夜勤を入れた場合、当(d)・明(d+1)・休養(d+2) の3日で
        // 朝ピークが下限（必要数-1）をどれだけ割り込むかの合計。小さいほど良い。
        // 「割るか否か」の0/1ではなく不足量で見ることで、すでに苦しい日をさらに削る人を確実に避けられる。
        const floorDeficitAfterNight = (s, d, sched) => {
            const keep = {};
            for (let k = 0; k <= 2; k++) { const x = d + k; if (x <= daysInMonth) keep[x] = sched[s.id][x]; }
            sched[s.id][d] = SHIFT_TYPES.NIGHT;
            if (d + 1 <= daysInMonth && keep[d + 1] === SHIFT_TYPES.NONE && !isCellLocked(s.id, d + 1, sched)) {
                sched[s.id][d + 1] = SHIFT_TYPES.NIGHT_END;
            }
            let deficit = 0;
            for (let k = 0; k <= 2; k++) {
                const x = d + k;
                if (x < 1 || x > daysInMonth) continue;
                const req = getMorningTargetForDay(x, calendar[x - 1].day);
                deficit += Math.max(0, (req - 1) - morningAvailOn(x, sched));
            }
            Object.keys(keep).forEach(x => { sched[s.id][x] = keep[x]; });
            return deficit;
        };

        // === 夜勤充足を hard 制約とする最小違反探索 ===
        // 方針:
        //  - 夜勤人数の充足は絶対 hard（不足を許可しない）。全枠埋まらなければ失敗とし、日別不足を明示。
        //  - Step0 のロック枠は絶対変更禁止（isCellLocked を厳守、上書きしない）。
        //  - soft 緩和の対象は「夜勤目標回数」「均等性」のみ。
        //  - 連直（連続夜勤）は通常禁止だが、ロックで明示的に連直が組まれている状況（前月末→月初の
        //    連直を含む）は優先的に許容して到達可能にする。
        // target(夜勤回数の目標未達)の重みは、ng/pair など他の soft 違反より必ず小さくする。
        // これにより「目標回数を合わせるために NG日やペア禁止に夜勤を入れる」ような
        // 本末転倒な配置を防ぐ（＝目標は“他制約を壊さない範囲で”近づける）。
        const VIO = { ng: 1000, pair: 800, dayfill: 300, prev2: 200, recent6: 200, nextnext: 150, target: 120 };
        const VIO_LABELS = {
            ng: 'NG指定の夜勤',
            pair: '禁止ペアの同日夜勤',
            prev2: '前々日が夜勤',
            recent6: '直近6日で夜勤2回以上',
            nextnext: '翌々日の制約違反',
            dayfill: '日勤人数の充足不足',
            target: '夜勤回数の目標未達',
        };

        // --- 絶対 hard 制約: 緩和不可。ロック変更禁止・明け枠の物理整合性 ---
        // 物理的に絶対不可な配置を弾く（ロック・明け枠が作れない等）
        const isAbsoluteHard = (s, d, sched) => {
            if (sched[s.id][d] !== SHIFT_TYPES.NONE) return false; // 既に入っている/ロックは上書き不可
            if (isCellLocked(s.id, d, sched)) return false;
            // 翌日(d+1)に明け枠を作れること（NONE か 既に明け、かつ非ロック）
            const nextDay = d + 1;
            if (nextDay <= daysInMonth) {
                const nextShift = sched[s.id][nextDay];
                if (nextShift === SHIFT_TYPES.NIGHT) return false; // 翌日が夜勤なら明けを重ねられない
                if (nextShift !== SHIFT_TYPES.NONE && nextShift !== SHIFT_TYPES.NIGHT_END) return false;
                if (nextShift === SHIFT_TYPES.NONE && isCellLocked(s.id, nextDay, sched)) return false; // 翌日が空ロック→明けを置けない
            }
            return true;
        };

        // --- 配置可能判定 ---
        // 連直（当→当）は常に不可。当直の翌日は必ず明けになる。
        // 明けの翌日に置けるのは「公休」か「当直」のみで、当直を置く場合は
        // 「当→明→当→明」を1セットの連勤とみなし、2セットまでを上限とする。
        // D群の職員はこの連勤自体を禁止（単発の夜勤のみ）。
        // d に当直を置いたとき、「当→明→当→明」の連なりが何セットになるかを数える。
        // 1 = 単発、2 = 当明当明。3以上は不可。
        const nightSetRunLength = (s, d, sched) => {
            let n = 1;
            for (let k = d - 2; k >= 1 - 2; k -= 2) {
                if (getShiftSafe(s.id, k, sched) === SHIFT_TYPES.NIGHT) n++; else break;
            }
            for (let k = d + 2; k <= daysInMonth; k += 2) {
                if (sched[s.id][k] === SHIFT_TYPES.NIGHT) n++; else break;
            }
            return n;
        };
        // この職員に「当明当明」の連勤を許すか（D群は禁止）
        const allowsNightSetChain = (s) => s.group !== 'D';

        const isFeasible = (s, d, sched, relaxConsec) => {
            if (!isAbsoluteHard(s, d, sched)) return false;
            const prevShift = getShiftSafe(s.id, d - 1, sched);
            // 連直（当直→当直）は物理的に不可。当直の翌日は必ず明けになる。
            if (prevShift === SHIFT_TYPES.NIGHT) return false;
            // 明けの翌日に入れてよいのは「公休」か「当直」だけ。
            // 翌々日(d+2)が動かせない固定の勤務（日勤・早番・遅番・研修）なら不可。
            const nnd2 = d + 2;
            if (nnd2 <= daysInMonth) {
                const nn = sched[s.id][nnd2];
                const forbiddenNN = [SHIFT_TYPES.DAY, SHIFT_TYPES.EARLY, SHIFT_TYPES.EARLY_DAY,
                                     SHIFT_TYPES.LATE, SHIFT_TYPES.DAY_LATE, SHIFT_TYPES.TRAINING];
                if (forbiddenNN.includes(nn) && isCellLocked(s.id, nnd2, sched)) return false;
            }
            // 当明当明の連勤: 許可した職員のみ、かつ2セットまで
            const run = nightSetRunLength(s, d, sched);
            if (run > 1 && !allowsNightSetChain(s)) return false;
            if (run > 2) return false;
            return true;
        };

        // --- SOFT 違反のカテゴリ別評価（緩和ではなく、結果の内訳表示・並べ替え用） ---
        const evalSoftViolations = (s, d, sched) => {
            const v = { ng: 0, pair: 0, prev2: 0, recent6: 0, nextnext: 0, dayfill: 0 };
            if (isNg(s.id, d, SHIFT_TYPES.NIGHT)) v.ng = 1;
            const currentNightStaff = groupNight.filter(x => x.id !== s.id && sched[x.id][d] === SHIFT_TYPES.NIGHT);
            if (currentNightStaff.some(c => s.forbiddenPairs?.includes(c.id) || c.forbiddenPairs?.includes(s.id))) v.pair = 1;
            if (getShiftSafe(s.id, d - 2, sched) === SHIFT_TYPES.NIGHT) v.prev2 = 1;
            let recent = 0;
            for (let k = 1; k <= 6; k++) if (getShiftSafe(s.id, d - k, sched) === SHIFT_TYPES.NIGHT) recent++;
            if (recent >= 2) v.recent6 = 1;
            const nnd = d + 2;
            if (nnd <= daysInMonth) {
                const nn = sched[s.id][nnd];
                const forbidden = [SHIFT_TYPES.DAY, SHIFT_TYPES.EARLY, SHIFT_TYPES.EARLY_DAY,
                                   SHIFT_TYPES.LATE, SHIFT_TYPES.DAY_LATE, SHIFT_TYPES.TRAINING];
                if (s.group === 'D') forbidden.push(SHIFT_TYPES.NIGHT);
                if (forbidden.includes(nn)) v.nextnext = 1;
            }
            const orig = sched[s.id][d];
            let nextOrig = null, nextChanged = false;
            sched[s.id][d] = SHIFT_TYPES.NIGHT;
            if (d + 1 <= daysInMonth) {
                nextOrig = sched[s.id][d + 1];
                if (nextOrig === SHIFT_TYPES.NONE && !isCellLocked(s.id, d + 1, sched)) {
                    sched[s.id][d + 1] = SHIFT_TYPES.NIGHT_END; nextChanged = true;
                }
            }
            const dayOk = canFillDayShifts(d, sched);
            const nextDayOk = canFillDayShifts(d + 1, sched);
            sched[s.id][d] = orig;
            if (nextChanged) sched[s.id][d + 1] = nextOrig;
            if (!dayOk || !nextDayOk) v.dayfill = 1;
            return v;
        };
        const softScore = (v) => v.ng * VIO.ng + v.pair * VIO.pair + v.prev2 * VIO.prev2
            + v.recent6 * VIO.recent6 + v.nextnext * VIO.nextnext + v.dayfill * VIO.dayfill;

        // 夜勤を配置（明けも同時に設定）
        const applyNight = (s, d, sched) => {
            sched[s.id][d] = SHIFT_TYPES.NIGHT;
            if (d + 1 <= daysInMonth) {
                if (sched[s.id][d + 1] === SHIFT_TYPES.NONE && !isCellLocked(s.id, d + 1, sched)) {
                    sched[s.id][d + 1] = SHIFT_TYPES.NIGHT_END;
                }
            }
        };
        const countNightOnDay = (d, sched) => groupNight.filter(s => sched[s.id][d] === SHIFT_TYPES.NIGHT).length;

        // 夜勤を取り消す（buildAssignment/applyNight が自動付与した明けも巻き戻す）。
        // ロック夜勤・ロック明けは絶対に触らない。明け(d+1)は「自動付与された明け」のみ消す。
        // 戻り値: 取り消せたら true（ロック等で取り消せない場合は false）。
        const removeNight = (s, d, sched) => {
            if (sched[s.id][d] !== SHIFT_TYPES.NIGHT) return false;
            if (isCellLocked(s.id, d, sched)) return false; // ロック夜勤は不可侵
            const nd = d + 1;
            // 翌日の明けが「自動付与された明け」（非ロック）なら一緒に消す
            if (nd <= daysInMonth && sched[s.id][nd] === SHIFT_TYPES.NIGHT_END && !isCellLocked(s.id, nd, sched)) {
                sched[s.id][nd] = SHIFT_TYPES.NONE;
            }
            sched[s.id][d] = SHIFT_TYPES.NONE;
            return true;
        };

        const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);

        // --- 1パターン分: 夜勤充足を hard とする貪欲配置（MRV: 候補が少ない日から） ---
        const buildAssignment = (seed) => {
            const sched = JSON.parse(JSON.stringify(cleanSchedule));
            const nightCounts = {};
            groupNight.forEach(s => {
                nightCounts[s.id] = 0;
                for (let d = 1; d <= daysInMonth; d++) if (sched[s.id][d] === SHIFT_TYPES.NIGHT) nightCounts[s.id]++;
            });

            // 同点タイブレーク用の決定論ハッシュ（seed が変われば順序が変わる＝別パターンになる）。
            // 以前は「seed が偶数なら ID 昇順 / 奇数なら降順」の2通りしかなく、
            // 40パターン試しても実質2通りしか生まれず「再配置」で解が変わらなかった。
            const tieKey = (str, d) => {
                let h = ((seed + 1) * 2654435761) >>> 0;
                for (let i = 0; i < str.length; i++) h = (Math.imul(h ^ str.charCodeAt(i), 16777619)) >>> 0;
                h = (Math.imul(h ^ (d * 2246822519), 2654435761)) >>> 0;
                h = (h ^ (h >>> 13)) >>> 0;
                return h;
            };

            // 候補職員の選択（目標回数・均等性 soft を優先、その後 soft違反の軽い順）
            const chooseStaff = (cands, d) => {
                // キーは1回だけ計算する（比較関数内で毎回シミュレートすると重いため）
                const keys = new Map();
                cands.forEach(s => {
                    const t = (typeof nightTargets[s.id] === 'number' && nightTargets[s.id] > 0) ? nightTargets[s.id] : averageTarget;
                    keys.set(s.id, {
                        // 夜勤は当日だけでなく翌日(明け)・翌々日(休養)も人を拘束する。
                        // その3日で朝ピークの下限(必要数-1)を割る人を最優先で避ける。
                        floor: floorDeficitAfterNight(s, d, sched),
                        ratio: (nightCounts[s.id] || 0) / (t || 1),
                        soft: softScore(evalSoftViolations(s, d, sched)),
                    });
                });
                cands.sort((a, b) => {
                    const ka = keys.get(a.id), kb = keys.get(b.id);
                    if (Math.abs(ka.floor - kb.floor) > 1e-9) return ka.floor - kb.floor;
                    // soft緩和対象: 目標回数比（均等性）
                    if (Math.abs(ka.ratio - kb.ratio) > 1e-9) return ka.ratio - kb.ratio;
                    // タイブレーク: soft違反の軽い方
                    if (ka.soft !== kb.soft) return ka.soft - kb.soft;
                    // 完全同点は seed 依存のハッシュ順（seed ごとに別の職員が選ばれ、多様な解になる）
                    return tieKey(a.id, d) - tieKey(b.id, d);
                });
                return cands[0];
            };

            // 充足が必要な日のリスト（need>0）を、MRV: 候補が最も少ない日から処理
            // 候補数は relaxConsec=false の通常候補数で測る（最も厳しい日を先に埋める）。
            let safety = 0;
            while (safety++ < daysInMonth * 10) {
                // 未充足の日を集め、各日の候補数を算出
                const pending = [];
                for (const d of days) {
                    const need = nightShiftCount - countNightOnDay(d, sched);
                    if (need <= 0) continue;
